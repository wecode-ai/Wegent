<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>云桌面</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1a1a;
      }
      #vnc-container {
        width: 100%;
        height: 100%;
      }
      #status-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1a1a1a;
        color: #999;
        font-family: system-ui, sans-serif;
      }
      #status-overlay.hidden {
        display: none;
      }
      .status-text {
        text-align: center;
      }
      .status-text p {
        margin: 8px 0;
        font-size: 14px;
      }
      .spinner {
        width: 32px;
        height: 32px;
        margin: 0 auto 12px;
        border: 3px solid #333;
        border-top-color: #14b8a6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .error {
        color: #f87171;
      }
      .retry-btn {
        margin-top: 12px;
        padding: 6px 16px;
        background: transparent;
        border: 1px solid #14b8a6;
        color: #14b8a6;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
      }
      .retry-btn:hover {
        background: rgba(20, 184, 166, 0.1);
      }
    </style>
  </head>
  <body>
    <div id="vnc-container"></div>
    <div id="status-overlay">
      <div class="status-text">
        <div class="spinner"></div>
        <p>正在连接云桌面...</p>
      </div>
    </div>

    <script src="./novnc/rfb.min.js"></script>
    <script>
      ;(function () {
        const params = new URLSearchParams(window.location.search)
        const sessionId = params.get('sessionId')
        const sandboxId = params.get('sandboxId')

        const container = document.getElementById('vnc-container')
        const overlay = document.getElementById('status-overlay')
        const statusText = overlay.querySelector('.status-text')
        let authenticatedWsUrl = null
        let rfb = null
        let reconnectTimer = null
        let reconnectAttempt = 0

        const reconnectDelays = [1000, 2000, 3000, 5000, 10000]

        function clearReconnectTimer() {
          if (reconnectTimer !== null) {
            window.clearTimeout(reconnectTimer)
            reconnectTimer = null
          }
        }

        function showConnecting() {
          delete document.documentElement.dataset.vncConnected
          overlay.classList.remove('hidden')
          const spinner = document.createElement('div')
          spinner.className = 'spinner'
          const message = document.createElement('p')
          message.textContent = '正在连接云桌面...'
          statusText.replaceChildren(spinner, message)
        }

        function showError(msg, retryable) {
          delete document.documentElement.dataset.vncConnected
          overlay.classList.remove('hidden')
          const errorText = document.createElement('p')
          errorText.className = 'error'
          errorText.textContent = msg
          if (!retryable) {
            statusText.replaceChildren(errorText)
            return
          }
          const retryButton = document.createElement('button')
          retryButton.type = 'button'
          retryButton.className = 'retry-btn'
          retryButton.textContent = '立即重试'
          retryButton.addEventListener('click', connect)
          statusText.replaceChildren(errorText, retryButton)
        }

        function scheduleReconnect() {
          clearReconnectTimer()
          const delay = reconnectDelays[Math.min(reconnectAttempt, reconnectDelays.length - 1)]
          reconnectAttempt += 1
          showError('连接已断开，正在重试...', true)
          reconnectTimer = window.setTimeout(connect, delay)
        }

        function authenticatedWebSocketUrl(config) {
          if (
            !config ||
            typeof config.wsUrl !== 'string' ||
            typeof config.token !== 'string' ||
            !config.token
          ) {
            throw new Error('Invalid VNC session configuration')
          }
          const url = new URL(config.wsUrl)
          const hasForbiddenQuery = Array.from(url.searchParams.entries()).some(function (entry) {
            const key = entry[0]
            const value = entry[1]
            return (
              key.toLowerCase().includes('token') ||
              key.toLowerCase() === 'authorization' ||
              value === config.token
            )
          })
          if (
            !['ws:', 'wss:'].includes(url.protocol) ||
            !url.host ||
            url.username ||
            url.password ||
            url.hash ||
            hasForbiddenQuery
          ) {
            throw new Error('Invalid VNC WebSocket URL')
          }
          url.searchParams.set('token', config.token)
          return url.toString()
        }

        async function getSessionConfig() {
          const invoke = window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke
          if (typeof invoke === 'function') {
            return invoke('get_vnc_session_config', { sessionId: sessionId })
          }

          const response = await fetch('/session/' + encodeURIComponent(sessionId), {
            cache: 'no-store',
            credentials: 'omit',
          })
          if (!response.ok) {
            var body = await response.json().catch(function () {
              return null
            })
            throw new Error(
              body && typeof body.error === 'string'
                ? body.error
                : 'VNC session is missing or expired'
            )
          }
          return response.json()
        }

        async function connect() {
          clearReconnectTimer()
          showConnecting()
          container.replaceChildren()

          if (rfb) {
            const previousRfb = rfb
            rfb = null
            try {
              previousRfb.disconnect()
            } catch (_error) {
              // The previous connection is already closed.
            }
          }

          try {
            var mod = window.noVNC
            var RFB =
              mod && mod.__esModule && mod.default
                ? mod.default
                : typeof mod === 'function'
                  ? mod
                  : mod && mod.default
                    ? mod.default
                    : mod

            if (!RFB) {
              showError('noVNC 加载失败', false)
              return
            }
            if (!authenticatedWsUrl) {
              const config = await getSessionConfig()
              authenticatedWsUrl = authenticatedWebSocketUrl(config)
            }

            const nextRfb = new RFB(container, authenticatedWsUrl)
            rfb = nextRfb
            nextRfb.scaleViewport = true
            nextRfb.resizeSession = false
            nextRfb.showDotCursor = true
            nextRfb.background = '#1a1a1a'

            nextRfb.addEventListener('connect', function () {
              if (rfb !== nextRfb) return
              clearReconnectTimer()
              reconnectAttempt = 0
              overlay.classList.add('hidden')
              document.documentElement.dataset.vncConnected = 'true'
              document.title = '云桌面' + (sandboxId ? ' - ' + sandboxId : '')
            })

            nextRfb.addEventListener('disconnect', function (e) {
              if (rfb !== nextRfb) return
              var clean = e.detail && e.detail.clean
              if (!clean) {
                scheduleReconnect()
              } else {
                showError('会话已结束', true)
              }
            })

            nextRfb.addEventListener('securityfailure', function (e) {
              if (rfb !== nextRfb) return
              showError('认证失败: ' + ((e.detail && e.detail.reason) || '未知错误'), true)
            })
          } catch (error) {
            const sessionExpired = String(error).includes('VNC session is missing or expired')
            if (!authenticatedWsUrl && sessionExpired) {
              showError('云桌面会话已过期，请关闭后重新打开桌面', false)
              return
            }
            showError('连接失败，请重试', true)
          }
        }

        if (!sessionId) {
          showError('缺少云桌面会话参数', false)
        } else if (window.noVNC) {
          connect()
        } else {
          showError('noVNC 库加载失败，请刷新页面重试', false)
        }
      })()
    </script>
  </body>
</html>
