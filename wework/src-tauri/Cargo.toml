[package]
name = "app"
version = "0.1.10-beta.2"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
release-devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
libc = "0.2"
ctrlc = { version = "3.4", features = ["termination"] }
dirs = "5"
fs2 = "0.4"
tauri = { version = "2.11.5", features = ["macos-private-api", "protocol-asset", "tray-icon", "unstable", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
portable-pty = "0.8"
tauri-plugin-process = "2.3.1"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["time"] }
reqwest = { version = "0.13", features = ["blocking", "multipart"] }
base64 = "0.22"
getrandom = "0.2"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Keep Wry's devtools API available when its debug assertions are disabled below.
wry = { version = "0.55.1", features = ["devtools"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-global-shortcut = "2.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = "0.25.0"
block2 = "0.6.2"
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["block2", "libc", "NSAttributedString", "NSBitmapImageRep", "NSColor", "NSEvent", "NSFont", "NSFontDescriptor", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSOpenPanel", "NSPanel", "NSPasteboard", "NSResponder", "NSRunningApplication", "NSSavePanel", "NSScreen", "NSStringDrawing", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSAttributedString", "NSData", "NSDictionary", "NSDistributedNotificationCenter", "NSError", "NSNotification", "NSObject", "NSString", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Power", "Win32_System_Threading"] }

# Wry prints an expected WKDownload cancellation to stderr whenever Wework takes
# over a browser download. Keep application debug assertions enabled while
# suppressing that dependency-only false error in development builds.
[profile.dev.package.wry]
debug-assertions = false
