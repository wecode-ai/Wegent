<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Wework</title>
    <script src="./theme.js"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="splash-root" class="startup-stage splash" aria-labelledby="splash-title">
      <main class="startup-hero" aria-label="Wework">
        <div class="startup-brand" aria-hidden="true">
          <canvas id="startup-brand-canvas" data-testid="startup-brand-canvas"></canvas>
        </div>
      </main>
      <div
        id="startup-window-drag-region"
        class="startup-window-drag-region"
        data-testid="startup-window-drag-region"
        aria-hidden="true"
      ></div>
      <footer id="startup-status" class="startup-status" data-testid="startup-status">
        <div class="splash-copy">
          <h1 id="splash-title" class="sr-only" aria-live="polite">
            We're preparing your workbench
          </h1>
          <p id="splash-activity" class="activity-line" aria-hidden="true"></p>
          <span id="splash-percentage" aria-hidden="true">0%</span>
        </div>
        <section class="progress-block" aria-label="Startup progress">
          <div class="sr-only">
            <span id="splash-step-count">Starting</span>
            <span id="splash-elapsed">0.0s</span>
          </div>
          <div
            id="splash-progress"
            class="startup-progress is-running"
            role="progressbar"
            aria-label="Preparing your workbench"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <svg class="startup-progress-svg" aria-hidden="true">
              <defs>
                <linearGradient
                  id="startup-progress-gradient"
                  gradientUnits="userSpaceOnUse"
                  x1="0"
                  y1="2"
                  x2="0"
                  y2="2"
                >
                  <stop offset="0%" class="startup-progress-stop-start" />
                  <stop offset="72%" class="startup-progress-stop-middle" />
                  <stop offset="100%" class="startup-progress-stop-end" />
                </linearGradient>
              </defs>
              <line
                id="splash-progress-track"
                class="startup-progress-track"
                x1="0"
                x2="0"
                y1="2"
                y2="2"
              />
              <line
                id="splash-progress-fill"
                class="startup-progress-fill"
                x1="0"
                x2="0"
                y1="2"
                y2="2"
                visibility="hidden"
              />
            </svg>
          </div>
        </section>
        <div id="startup-slow" class="inline-note" hidden>
          <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" />
            <path d="M8 4.6v4l2.3 1.4" fill="none" stroke="currentColor" stroke-linecap="round" />
          </svg>
          <div class="note-body">
            <strong id="startup-slow-title">Please wait</strong>
            <p id="startup-slow-detail">First launches and updates can take longer.</p>
          </div>
        </div>
        <div id="startup-timeout" class="inline-note" role="alert" hidden>
          <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" />
            <path d="M8 2.8v5.4l3 1.8" fill="none" stroke="currentColor" stroke-linecap="round" />
          </svg>
          <div class="note-body">
            <strong id="startup-timeout-title">First startup can take longer</strong>
            <p id="startup-timeout-detail">Still loading. Please wait…</p>
          </div>
        </div>
        <div id="startup-timeout-actions" class="startup-actions startup-timeout-actions" hidden>
          <button
            id="startup-timeout-copy"
            data-testid="startup-timeout-copy-button"
            class="startup-button startup-button-secondary"
            type="button"
          >
            Copy diagnostics
          </button>
          <button
            id="startup-timeout-open-logs"
            data-testid="startup-timeout-open-logs-button"
            class="startup-link-button"
            type="button"
          >
            Open log folder
          </button>
        </div>
        <div id="startup-failure" class="inline-note inline-note-error" role="alert" hidden>
          <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" />
            <path d="M8 4.6v4.2" stroke="currentColor" stroke-linecap="round" />
            <circle cx="8" cy="11.3" r="0.8" fill="currentColor" stroke="none" />
          </svg>
          <div class="note-body">
            <strong id="startup-failure-title">Startup was interrupted</strong>
            <p id="startup-failure-detail">Restarting usually recovers.</p>
          </div>
        </div>
        <div id="startup-recovery" class="startup-recovery" hidden>
          <div class="startup-actions">
            <button
              id="startup-disable-plugin"
              data-testid="startup-disable-plugin-button"
              class="startup-button startup-button-primary"
              type="button"
              hidden
            ></button>
            <button
              id="startup-retry"
              data-testid="startup-retry-button"
              class="startup-button startup-button-secondary"
              type="button"
            >
              Retry
            </button>
            <button
              id="startup-copy-diagnostics"
              data-testid="startup-copy-diagnostics-button"
              class="startup-button startup-button-secondary"
              type="button"
            >
              Copy diagnostics
            </button>
            <button
              id="startup-recover"
              data-testid="startup-recover-button"
              class="startup-button startup-button-primary"
              type="button"
            >
              Repair startup
            </button>
            <button
              id="startup-reset-open"
              data-testid="startup-reset-options-button"
              class="startup-link-button"
              type="button"
            >
              Reset personal state
            </button>
            <button
              id="startup-open-logs"
              data-testid="startup-open-logs-button"
              class="startup-link-button"
              type="button"
            >
              Open log folder
            </button>
          </div>
          <p id="startup-action-error" class="startup-action-error" role="alert" hidden></p>
        </div>
        <div
          id="startup-confirmation"
          class="startup-confirmation"
          role="dialog"
          aria-modal="true"
          aria-labelledby="startup-confirmation-title"
          aria-describedby="startup-confirmation-description"
          hidden
        >
          <h2 id="startup-confirmation-title"></h2>
          <p id="startup-confirmation-description"></p>
          <div class="startup-confirmation-actions">
            <button
              id="startup-confirmation-cancel"
              data-testid="startup-confirmation-cancel-button"
              class="startup-button startup-button-secondary"
              type="button"
            ></button>
            <button
              id="startup-confirmation-submit"
              data-testid="startup-confirmation-submit-button"
              class="startup-button startup-button-danger"
              type="button"
            ></button>
          </div>
        </div>
      </footer>
    </div>
    <div id="startup-toast" class="startup-toast" role="status" hidden></div>
    <script src="./brand-mark.js"></script>
    <script src="./brand-animation.js"></script>
    <script src="./splash.js"></script>
  </body>
</html>
