<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新建任务 · Notion 风格</title>
<style>
  :root {
    --bg: #fafafa;
    --bg-elevated: #ffffff;
    --bg-subtle: #f4f4f5;
    --bg-hover: #f0f0f1;
    --border: rgba(0, 0, 0, 0.07);
    --border-strong: rgba(0, 0, 0, 0.12);
    --text-1: #18181b;
    --text-2: #52525b;
    --text-3: #a1a1aa;
    --shadow-pop: 0 16px 48px rgba(0,0,0,0.12);
    --radius-s: 8px;
    --radius-m: 12px;
    --radius-l: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
      "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px; line-height: 1.5; color: var(--text-1);
    min-height: 100vh;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 6vh 24px 24px;
    background:
      radial-gradient(1200px 600px at 20% 0%, #e8e8ec 0%, transparent 60%),
      radial-gradient(1000px 500px at 90% 100%, #ececf0 0%, transparent 55%),
      #dcdce0;
  }

  /* ============ Page (Notion-style task editor) ============ */
  .page {
    width: 760px;
    max-width: 100%;
    background: var(--bg-elevated);
    border-radius: var(--radius-l);
    box-shadow: var(--shadow-pop);
    animation: rise .25s ease both;
    display: flex;
    flex-direction: column;
    max-height: 88vh;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px) scale(0.99); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .page-chrome {
    display: flex;
    align-items: center;
    padding: 12px 16px 0;
    flex-shrink: 0;
  }
  .page-chrome .crumb {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-3);
  }
  .page-chrome .crumb svg { width: 13px; height: 13px; }
  .page-chrome .spacer { flex: 1; }
  .icon-btn {
    width: 30px; height: 30px;
    border: none; border-radius: var(--radius-s);
    background: transparent; color: var(--text-2);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all .15s ease;
  }
  .icon-btn:hover { background: var(--bg-hover); color: var(--text-1); }
  .icon-btn svg { width: 16px; height: 16px; }

  .page-body {
    padding: 10px 56px 24px;
    overflow-y: auto;
    min-height: 0;
  }

  /* big borderless title */
  .title-input {
    width: 100%;
    border: none; outline: none;
    font-family: inherit;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-1);
    background: transparent;
    padding: 6px 0;
  }
  .title-input::placeholder { color: #d4d4d8; }

  /* property chips in one row */
  .props {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .prop-chip {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 30px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: 99px;
    background: var(--bg-elevated);
    font-family: inherit;
    font-size: 12.5px;
    color: var(--text-1);
    cursor: pointer;
    transition: all .15s ease;
    white-space: nowrap;
  }
  .prop-chip:hover { background: var(--bg-subtle); border-color: var(--border-strong); }
  .prop-chip svg.icon { width: 13px; height: 13px; color: var(--text-3); }
  .prop-chip .label { color: var(--text-3); }
  .prop-chip .dot { width: 7px; height: 7px; border-radius: 50%; }
  .prop-chip .chev { width: 12px; height: 12px; color: var(--text-3); }
  .prop-chip.placeholder { color: var(--text-3); }
  .badge {
    display: inline-flex; align-items: center;
    font-size: 11px; font-weight: 500;
    padding: 1px 7px; border-radius: 99px;
    background: var(--bg-subtle); color: var(--text-2);
  }

  /* document editor */
  .editor { margin-top: 14px; position: relative; }
  .editor-area {
    min-height: 240px;
    font-size: 15px;
    line-height: 1.75;
    color: var(--text-1);
    outline: none;
  }
  .editor-area:empty::before {
    content: attr(data-placeholder);
    color: #c3c3c9;
    pointer-events: none;
  }
  .editor-toolbar {
    position: sticky;
    bottom: 8px;
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 4px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  }
  .editor-toolbar button {
    min-width: 28px; height: 28px;
    padding: 0 7px;
    border: none; border-radius: 7px;
    background: transparent; color: var(--text-2);
    font-family: inherit; font-size: 13px;
    cursor: pointer; transition: all .12s ease;
  }
  .editor-toolbar button:hover { background: var(--bg-hover); color: var(--text-1); }
  .editor-toolbar button strong { font-weight: 700; }
  .editor-toolbar button em { font-style: italic; }
  .editor-toolbar .sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; }
  .editor-hint {
    margin-top: 10px;
    font-size: 12px; color: var(--text-3);
  }

  /* attachments */
  .attachments { margin-top: 22px; }
  .section-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--text-3);
    user-select: none;
  }
  .section-label svg { width: 15px; height: 15px; }
  .attachment-list { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
  .attachment-row {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px;
    border-radius: var(--radius-s);
    transition: background .15s ease;
  }
  .attachment-row:hover { background: var(--bg-subtle); }
  .attachment-row svg.file-icon { width: 16px; height: 16px; color: var(--text-3); flex-shrink: 0; }
  .attachment-row .name { font-size: 13.5px; }
  .attachment-row .size { font-size: 12px; color: var(--text-3); }
  .attachment-row .remove {
    margin-left: auto;
    width: 24px; height: 24px;
    border: none; border-radius: 6px;
    background: transparent; color: var(--text-3);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; opacity: 0; transition: all .15s ease;
  }
  .attachment-row:hover .remove { opacity: 1; }
  .attachment-row .remove:hover { background: var(--bg-hover); color: #dc2626; }
  .attachment-row .remove svg { width: 14px; height: 14px; }
  .upload-zone {
    margin-top: 8px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 16px;
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius-m);
    color: var(--text-3);
    font-size: 13px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .upload-zone:hover { border-color: var(--text-3); color: var(--text-2); background: var(--bg-subtle); }
  .upload-zone svg { width: 15px; height: 15px; }

  /* footer */
  .page-footer {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 8px;
    padding: 12px 20px;
    border-top: 1px solid var(--border);
  }
  .page-footer .hint { font-size: 12px; color: var(--text-3); }
  .page-footer .spacer { flex: 1; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 32px; padding: 0 14px;
    border-radius: 9px;
    font-family: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all .15s ease;
  }
  .btn-ghost {
    border: 1px solid var(--border-strong);
    background: var(--bg-elevated); color: var(--text-1);
  }
  .btn-ghost:hover { background: var(--bg-hover); }
  .btn-primary {
    border: none;
    background: var(--text-1); color: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
  }
  .btn-primary:hover { opacity: .88; }
</style>
</head>
<body>

<div class="page">
  <!-- chrome -->
  <div class="page-chrome">
    <span class="crumb">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      看板项目 · 新建任务
    </span>
    <span class="spacer"></span>
    <button class="icon-btn" title="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <div class="page-body">
    <!-- title -->
    <input class="title-input" placeholder="目标或事项标题" autofocus>

    <!-- property chips in one row -->
    <div class="props">
      <button class="prop-chip">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/></svg>
        <span class="label">状态</span>
        <span class="dot" style="background:#a1a1aa"></span>
        收集箱
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <button class="prop-chip">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
        <span class="label">优先级</span>
        <span class="badge">普通</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <button class="prop-chip">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h7"/></svg>
        <span class="label">父任务</span>
        顶层任务
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <button class="prop-chip placeholder">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span class="label">截止时间</span>
        添加日期
      </button>
    </div>

    <!-- document editor -->
    <div class="editor">
      <div class="editor-area" contenteditable="true" data-placeholder="写下背景、要求或直接完成的文档内容,输入 / 使用 Markdown…"></div>
      <div class="editor-toolbar">
        <button><strong>B</strong></button>
        <button><em>I</em></button>
        <button style="font-family:ui-monospace,monospace">&lt;/&gt;</button>
        <span class="sep"></span>
        <button>• 列表</button>
        <button>1. 列表</button>
        <button>☑ 任务</button>
        <button>❝ 引用</button>
        <span class="sep"></span>
        <button>🔗 链接</button>
      </div>
      <p class="editor-hint">支持 Markdown,可拖拽文件到编辑器添加附件</p>
    </div>

    <!-- attachments -->
    <div class="attachments">
      <span class="section-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        附件
      </span>
      <div class="attachment-list">
        <div class="attachment-row">
          <svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          <span class="name">design-spec.pdf</span>
          <span class="size">2.4 MB</span>
          <button class="remove" title="移除">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="attachment-row">
          <svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
          <span class="name">kanban-mockup.png</span>
          <span class="size">1.1 MB</span>
          <button class="remove" title="移除">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
      <div class="upload-zone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>
        点击上传或拖拽文件到这里
      </div>
    </div>
  </div>

  <!-- footer -->
  <div class="page-footer">
    <span class="hint">ESC 关闭 · ⌘↵ 创建</span>
    <span class="spacer"></span>
    <button class="btn btn-ghost">取消</button>
    <button class="btn btn-primary">创建任务</button>
  </div>
</div>

</body>
</html>
