[package]
name = "wegent-document-parser"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "Shared native PDF and OOXML document parsing"

[features]
default = ["rust-backend"]
rust-backend = ["flate2/rust_backend"]
test-support = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
flate2 = { version = "1", default-features = false }
regex = "1"
