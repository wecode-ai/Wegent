[package]
name = "wegent-filesystem"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Filesystem leases, directory links, and platform path normalization"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3.23"
fs2 = "0.4"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Ioctl", "Win32_System_IO", "Win32_Foundation"] }
