name: Repository Policy

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository Policy Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted policy scripts
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event.repository.default_branch }}
          path: trusted-policy
          persist-credentials: false

      - name: Checkout pull request merge tree
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: policy-target
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Checkout merge group
        if: github.event_name == 'merge_group'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: policy-target
          persist-credentials: false

      - name: Run repository policy check
        env:
          REPOSITORY_POLICY_ROOT: ${{ github.workspace }}/policy-target
          REPOSITORY_POLICY_PATTERN_B64: ${{ vars.RESTRICTED_DOMAIN_PATTERN_B64 }}
          REPOSITORY_POLICY_APPROVED_B64: ${{ vars.APPROVED_DOMAIN_REFERENCES_B64 }}
        run: |
          chmod +x "$GITHUB_WORKSPACE/trusted-policy/scripts/hooks/check-repository-policy.sh"
          bash "$GITHUB_WORKSPACE/trusted-policy/scripts/hooks/check-repository-policy.sh"
