name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect CI Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      knowledge_engine: ${{ steps.classify.outputs.knowledge_engine }}
      frontend: ${{ steps.classify.outputs.frontend }}
      wework: ${{ steps.classify.outputs.wework }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" |
            .github/scripts/classify-ci-changes.sh

  lint-backend:
    name: Lint Backend (Black & isort)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          source $HOME/.cargo/env

      - name: Install dependencies
        working-directory: ./backend
        run: |
          source $HOME/.cargo/env
          uv sync --dev

      - name: Run Black format check
        working-directory: ./backend
        run: |
          source $HOME/.cargo/env
          uv run black --check app/

      - name: Run isort check
        working-directory: ./backend
        run: |
          source $HOME/.cargo/env
          uv run isort --check-only --diff app/

  lint-knowledge-engine:
    name: Lint Knowledge Engine (Black & isort)
    needs: changes
    if: needs.changes.outputs.knowledge_engine == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          source $HOME/.cargo/env

      - name: Install dependencies
        working-directory: ./knowledge_engine
        run: |
          source $HOME/.cargo/env
          uv sync --dev

      - name: Run Black format check
        working-directory: ./knowledge_engine
        run: |
          source $HOME/.cargo/env
          uv run black --check knowledge_engine tests

      - name: Run isort check
        working-directory: ./knowledge_engine
        run: |
          source $HOME/.cargo/env
          uv run isort --check-only --diff knowledge_engine tests

  lint-frontend:
    name: Lint Frontend (ESLint & TypeScript)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm --filter wecode-ai-assistant lint

      - name: Run TypeScript check
        run: pnpm --filter wecode-ai-assistant exec tsc --noEmit

  lint-wework:
    name: Lint Wework (ESLint & TypeScript)
    needs: changes
    if: needs.changes.outputs.wework == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm --filter wework lint

      - name: Run TypeScript check
        run: pnpm --filter wework typecheck

  check-settings-config:
    name: Check Settings Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run settings configuration check
        run: |
          chmod +x ./scripts/hooks/check-settings-config.sh
          ./scripts/hooks/check-settings-config.sh

      - name: Test CI change classifier
        run: .github/scripts/test-classify-ci-changes.sh

      - name: Test repository policy workflow
        run: scripts/test-repository-policy-workflow.sh

      - name: Run repository policy check
        # Fork PRs run this in repository-policy.yml using pull_request_target
        # with the trusted base-branch script and the PR merge tree as data.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          REPOSITORY_POLICY_PATTERN_B64: ${{ vars.RESTRICTED_DOMAIN_PATTERN_B64 }}
          REPOSITORY_POLICY_APPROVED_B64: ${{ vars.APPROVED_DOMAIN_REFERENCES_B64 }}
        run: |
          chmod +x ./scripts/hooks/check-repository-policy.sh
          ./scripts/hooks/check-repository-policy.sh

  check-alembic-heads:
    name: Check Alembic Multi-Head
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Alembic multi-head check
        run: |
          chmod +x ./scripts/hooks/check-alembic-heads.sh
          ./scripts/hooks/check-alembic-heads.sh

  lint-summary:
    name: Lint Summary
    runs-on: ubuntu-latest
    needs: [changes, lint-backend, lint-knowledge-engine, lint-frontend, lint-wework, check-settings-config, check-alembic-heads]
    if: always()

    steps:
      - name: Check lint results
        run: |
          echo "All lint jobs completed"
          assert_result() {
            local expected="$1"
            local result="$2"
            local name="$3"
            if [[ "$expected" == "true" && "$result" != "success" ]]; then
              echo "$name was required but completed with: $result"
              exit 1
            fi
          }

          [[ "${{ needs.changes.result }}" == "success" ]]
          [[ "${{ needs.check-settings-config.result }}" == "success" ]]
          [[ "${{ needs.check-alembic-heads.result }}" == "success" ]]
          assert_result "${{ needs.changes.outputs.backend }}" "${{ needs.lint-backend.result }}" "Backend lint"
          assert_result "${{ needs.changes.outputs.knowledge_engine }}" "${{ needs.lint-knowledge-engine.result }}" "Knowledge Engine lint"
          assert_result "${{ needs.changes.outputs.frontend }}" "${{ needs.lint-frontend.result }}" "Frontend lint"
          assert_result "${{ needs.changes.outputs.wework }}" "${{ needs.lint-wework.result }}" "Wework lint"
