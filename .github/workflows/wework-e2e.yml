name: Wework E2E
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pnpm-paths:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: '11.7.0'
          dest: ${{ runner.temp }}/pnpm-diagnostic
      - name: Inspect pnpm native working directories
        shell: pwsh
        run: |
          node .github/scripts/wework-pnpm-path-diagnostic.mjs (Join-Path $env:RUNNER_TEMP 'pnpm-diagnostic/node_modules/pnpm/bin/pnpm.cjs')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pnpm-native-path-diagnostics
          path: .ci-artifacts/pnpm-native-paths.json
