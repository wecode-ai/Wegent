name: Wework E2E

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name || 'code' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Wework E2E Changes
    runs-on: ubuntu-latest
    outputs:
      wework_e2e: ${{ steps.classify.outputs.wework_e2e }}
      wework_desktop_e2e: ${{ steps.classify.outputs.wework_desktop_e2e }}
      wework_desktop_e2e_matrix: ${{ steps.classify.outputs.wework_desktop_e2e_matrix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          FORCE_ALL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:all') }}
        run: |
          if [[ "$FORCE_ALL" == "true" ]]; then
            .github/scripts/classify-ci-changes.sh --all
            .github/scripts/classify-wework-desktop-e2e.sh --all
          else
            changed_files="$(mktemp)"
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_files"
            .github/scripts/classify-ci-changes.sh < "$changed_files"
            .github/scripts/classify-wework-desktop-e2e.sh < "$changed_files"
          fi

  wework-e2e:
    name: Wework E2E
    needs: changes
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.changes.outputs.wework_e2e == 'true' && (github.event.action != 'labeled' || github.event.label.name == 'ci:all'))
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-wework-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-wework-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ./wework
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: ./wework
        run: pnpm exec playwright install-deps chromium

      - name: Run Wework E2E tests
        env:
          CI: true
        run: pnpm --filter wework e2e

      - name: Upload Wework Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wework-playwright-report
          path: wework/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Wework Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wework-playwright-traces
          path: wework/test-results/
          if-no-files-found: ignore
          retention-days: 7

  wework-desktop-e2e:
    name: Wework Desktop E2E (${{ matrix.name }})
    needs: changes
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.changes.outputs.wework_desktop_e2e == 'true' && (github.event.action != 'labeled' || github.event.label.name == 'ci:all'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.wework_desktop_e2e_matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            imagemagick \
            librsvg2-dev \
            redis-server \
            xvfb

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            executor/target
            wework/src-tauri/target
          key: ${{ runner.os }}-wework-desktop-e2e-${{ hashFiles('executor/Cargo.lock', 'wework/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wework-desktop-e2e-

      - name: Prepare bundled sidecars
        working-directory: ./wework
        run: |
          pnpm run prepare:codex
          pnpm run prepare:dws

      - name: Run Wework desktop ${{ matrix.name }} E2E
        env:
          CI: true
          CODEX_BIN: ${{ github.workspace }}/wework/src-tauri/binaries/codex/x86_64-unknown-linux-gnu/vendor/x86_64-unknown-linux-musl/bin/codex
          E2E_COMMAND: ${{ matrix.command }}
          E2E_SEGMENT: ${{ matrix.segment }}
        run: |
          test -x "$CODEX_BIN"
          args=()
          if [[ -n "$E2E_SEGMENT" ]]; then
            args=(-- --segment "$E2E_SEGMENT")
          fi
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            pnpm --filter wework "$E2E_COMMAND" "${args[@]}"

      - name: Upload Wework desktop E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wework-desktop-${{ matrix.id }}-e2e-diagnostics
          path: |
            wework/test-results/desktop-e2e/
            !wework/test-results/desktop-e2e/**/executor-home/**
          if-no-files-found: ignore
          retention-days: 7

  wework-e2e-summary:
    name: Wework E2E Summary
    needs:
      - changes
      - wework-e2e
      - wework-desktop-e2e
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check Wework E2E results
        env:
          RUN_E2E: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.changes.outputs.wework_e2e == 'true' && (github.event.action != 'labeled' || github.event.label.name == 'ci:all')) }}
          RUN_DESKTOP_E2E: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.changes.outputs.wework_desktop_e2e == 'true' && (github.event.action != 'labeled' || github.event.label.name == 'ci:all')) }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          WEB_E2E_RESULT: ${{ needs.wework-e2e.result }}
          DESKTOP_E2E_RESULT: ${{ needs.wework-desktop-e2e.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Wework E2E change detection completed with: $CHANGES_RESULT"
            exit 1
          fi

          if [[ "$RUN_E2E" != "true" ]]; then
            echo "Wework E2E is not required for this pull request"
            exit 0
          fi

          if [[ "$WEB_E2E_RESULT" != "success" ]]; then
            echo "Wework browser E2E completed with: $WEB_E2E_RESULT"
            exit 1
          fi

          if [[ "$RUN_DESKTOP_E2E" == "true" && "$DESKTOP_E2E_RESULT" != "success" ]]; then
            echo "Wework desktop E2E completed with: $DESKTOP_E2E_RESULT"
            exit 1
          fi

  wework-desktop-memory-e2e:
    name: Wework Desktop Memory E2E
    needs: changes
    if: github.event_name != 'merge_group' && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (contains(github.event.pull_request.labels.*.name, 'ci:memory') || contains(github.event.pull_request.labels.*.name, 'ci:all'))))
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            executor/target
            wework/src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-wework-desktop-memory-e2e-${{ hashFiles('executor/Cargo.lock', 'wework/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-wework-desktop-memory-e2e-

      - name: Prepare bundled sidecars
        working-directory: ./wework
        run: |
          pnpm run prepare:codex
          pnpm run prepare:dws
          codex_bin="$(find "$PWD/src-tauri/binaries/codex" -type f -path '*/bin/codex' -perm -u+x -print -quit)"
          test -n "$codex_bin"
          echo "CODEX_BIN=$codex_bin" >> "$GITHUB_ENV"

      - name: Run Wework desktop memory E2E
        env:
          CI: true
        run: |
          test -x "$CODEX_BIN"
          pnpm --filter wework e2e:desktop:memory

      - name: Upload Wework desktop memory diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wework-desktop-memory-e2e-diagnostics
          path: |
            wework/test-results/desktop-e2e/
            !wework/test-results/desktop-e2e/**/executor-home/**
          if-no-files-found: ignore
          retention-days: 7
