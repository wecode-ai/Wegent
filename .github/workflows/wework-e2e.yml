name: Wework E2E
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-package-commands:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-workspace
      - run: pnpm --dir wework/electron install --frozen-lockfile
      - run: pnpm --filter wework prepare:electron
      - run: pnpm --dir wework/electron test src/runtime/core-dsh-plugin-manager.test.ts
