name: Wework E2E
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: unit
        options: [unit, sqlite, pnpm]
permissions:
  contents: read
  actions: read
jobs:
  native-package-commands:
    if: inputs.mode != 'sqlite'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-workspace
      - run: pnpm --dir wework/electron install --frozen-lockfile
      - run: pnpm --filter wework prepare:electron
      - if: inputs.mode != 'pnpm'
        run: pnpm --dir wework/electron test src/runtime/core-dsh-plugin-manager.test.ts
      - if: inputs.mode == 'pnpm'
        run: pnpm --filter wework exec node ../.github/scripts/wework-pnpm-clone-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always() && inputs.mode == 'pnpm'
        with:
          name: pnpm-clone-diagnostics
          path: .ci-artifacts/pnpm-clone
  sqlite-interruption:
    if: inputs.mode == 'sqlite'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/download-artifact@v6
        with:
          name: wework-desktop-windows-core-e2e-build
          run-id: 41260943329
          github-token: ${{ github.token }}
          path: wework/electron/release/WeWork-win32-x64
      - name: Observe real native SQLite interruption
        shell: pwsh
        run: node .github/scripts/wework-sqlite-interruption-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqlite-interruption-diagnostics
          path: .ci-artifacts/sqlite-interruption
