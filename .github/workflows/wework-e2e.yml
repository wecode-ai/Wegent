name: Wework E2E

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name || 'code' }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect Wework E2E Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      browser_image: ${{ steps.image.outputs.browser-ref }}
      desktop_image: ${{ steps.image.outputs.desktop-ref }}
      executor_image: ${{ steps.runtime.outputs.executor-ref }}
      backend_rs_image: ${{ steps.runtime.outputs.backend-rs-ref }}
      wework_e2e: ${{ steps.classify.outputs.wework_e2e }}
      wework_desktop_e2e: ${{ steps.classify.outputs.wework_desktop_e2e }}
      wework_desktop_core_e2e: ${{ steps.classify.outputs.wework_desktop_core_e2e }}
      wework_desktop_core_e2e_matrix: ${{ steps.classify.outputs.wework_desktop_core_e2e_matrix }}
      wework_desktop_cloud_e2e: ${{ steps.classify.outputs.wework_desktop_cloud_e2e }}
      wework_desktop_cloud_e2e_matrix: ${{ steps.classify.outputs.wework_desktop_cloud_e2e_matrix }}
      wework_desktop_other_e2e: ${{ steps.classify.outputs.wework_desktop_other_e2e }}
      wework_desktop_other_e2e_matrix: ${{ steps.classify.outputs.wework_desktop_other_e2e_matrix }}
      wework_desktop_macos_inspector_e2e: ${{ steps.classify.outputs.wework_desktop_macos_inspector_e2e }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.sha }}
          FORCE_ALL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:all')) }}
        run: |
          if [[ "$FORCE_ALL" == "true" ]]; then
            .github/scripts/classify-ci-changes.sh --all
            .github/scripts/classify-wework-desktop-e2e.sh --all
          else
            changed_files="$(mktemp)"
            git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$changed_files"
            .github/scripts/classify-ci-changes.sh < "$changed_files"
            if [[ "$GITHUB_EVENT_NAME" == "merge_group" ]]; then
              desktop_changed_files="$(mktemp)"
              grep -v '^\.github/' "$changed_files" > "$desktop_changed_files" || true
              .github/scripts/classify-wework-desktop-e2e.sh < "$desktop_changed_files"
            else
              .github/scripts/classify-wework-desktop-e2e.sh < "$changed_files"
            fi
          fi

      - name: Resolve Wework E2E image
        id: image
        run: |
          browser_digest="$(sha256sum docker/wework-e2e/browser.Dockerfile | cut -d ' ' -f 1)"
          desktop_digest="$(sha256sum docker/wework-e2e/desktop.Dockerfile | cut -d ' ' -f 1)"
          echo "browser-ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wegent-wework-e2e:browser-$browser_digest" \
            >> "$GITHUB_OUTPUT"
          echo "desktop-ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wegent-wework-e2e:desktop-$desktop_digest" \
            >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: (steps.classify.outputs.wework_e2e == 'true' || steps.classify.outputs.wework_desktop_e2e == 'true') && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.action != 'labeled' || github.event.label.name == 'ci:all')))
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Wework browser E2E image
        if: (steps.classify.outputs.wework_e2e == 'true' || steps.classify.outputs.wework_desktop_e2e == 'true') && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.action != 'labeled' || github.event.label.name == 'ci:all')))
        id: browser-image-check
        env:
          IMAGE: ${{ steps.image.outputs.browser-ref }}
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Wework desktop E2E image
        if: (steps.classify.outputs.wework_e2e == 'true' || steps.classify.outputs.wework_desktop_e2e == 'true') && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.action != 'labeled' || github.event.label.name == 'ci:all')))
        id: desktop-image-check
        env:
          IMAGE: ${{ steps.image.outputs.desktop-ref }}
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.browser-image-check.outputs.exists == 'false' || steps.desktop-image-check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Resolve shared Rust E2E runtimes
        if: steps.classify.outputs.wework_desktop_e2e == 'true'
        id: runtime
        env:
          EXECUTOR_SOURCE_DIGEST: ${{ hashFiles('frontend/e2e/fixtures/claudecode-executor/Dockerfile', 'executor/Cargo.toml', 'executor/Cargo.lock', 'executor/src/**', 'shared/assets/**') }}
          BACKEND_RS_SOURCE_DIGEST: ${{ hashFiles('backend-rs/Cargo.toml', 'backend-rs/Cargo.lock', 'backend-rs/src/**') }}
        run: |
          runtime_output="$(mktemp)"
          GITHUB_OUTPUT="$runtime_output" \
            SOURCE_DIGEST="$EXECUTOR_SOURCE_DIGEST" \
            .github/scripts/resolve-executor-e2e-runtime.sh
          executor_image="$(sed -n 's/^image=//p' "$runtime_output")"
          test -n "$executor_image"
          {
            echo "executor-ref=$executor_image"
            echo "backend-rs-ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wegent-backend-rs-e2e:v1-$BACKEND_RS_SOURCE_DIGEST"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish Wework browser E2E image
        if: steps.browser-image-check.outputs.exists == 'false'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          file: docker/wework-e2e/browser.Dockerfile
          push: true
          tags: ${{ steps.image.outputs.browser-ref }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/wegent-wework-e2e:buildcache-browser
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/wegent-wework-e2e:buildcache-browser,mode=max

      - name: Build and publish Wework desktop E2E image
        if: steps.desktop-image-check.outputs.exists == 'false'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          file: docker/wework-e2e/desktop.Dockerfile
          push: true
          tags: ${{ steps.image.outputs.desktop-ref }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/wegent-wework-e2e:buildcache-desktop
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/wegent-wework-e2e:buildcache-desktop,mode=max

  wework-e2e:
    name: Wework E2E
    needs:
      - changes
    if: needs.changes.outputs.wework_e2e == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.action != 'labeled' || github.event.label.name == 'ci:all')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOME: /root
    container:
      image: ${{ needs.changes.outputs.browser_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          filter: blob:none

      - name: Set up Node workspace
        uses: ./.github/actions/setup-node-workspace
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          setup-toolchain: "false"

      - name: Run Wework E2E tests
        env:
          CI: true
        run: pnpm --filter wework e2e

      - name: Upload Wework Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wework-playwright-report
          path: wework/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Wework Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wework-playwright-traces
          path: wework/test-results/
          if-no-files-found: ignore
          retention-days: 7

  build-wework-desktop-core-e2e:
    name: Build Shared Wework Desktop E2E Artifact
    needs:
      - changes
    if: (needs.changes.outputs.wework_desktop_core_e2e == 'true' || needs.changes.outputs.wework_desktop_cloud_e2e == 'true' || needs.changes.outputs.wework_desktop_other_e2e == 'true') && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.action != 'labeled' || github.event.label.name == 'ci:all')))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HOME: /root
    container:
      image: ${{ needs.changes.outputs.desktop_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: false

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.1

      - name: Log in to GHCR with ORAS
        run: echo "$GITHUB_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Resolve shared Wework desktop E2E build
        id: shared-build
        env:
          DESKTOP_IMAGE: ${{ needs.changes.outputs.desktop_image }}
          EXECUTOR_IMAGE: ${{ needs.changes.outputs.executor_image }}
          BACKEND_RS_IMAGE: ${{ needs.changes.outputs.backend_rs_image }}
        run: |
          mkdir -p .ci-artifacts
          reference_output="$(mktemp)"
          GITHUB_OUTPUT="$reference_output" \
            .github/scripts/resolve-wework-core-e2e-build-ref.sh \
            "$GITHUB_REPOSITORY_OWNER" \
            "$DESKTOP_IMAGE" \
            "$EXECUTOR_IMAGE" \
            "$BACKEND_RS_IMAGE"
          reference="$(sed -n 's/^reference=//p' "$reference_output")"
          test -n "$reference"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"

          set +e
          .github/scripts/restore-wework-core-e2e-build-oci.sh \
            .ci-artifacts/wework-core-e2e-build.tar.zst \
            "$reference"
          restore_status=$?
          set -e
          case "$restore_status" in
            0) echo "cache-hit=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "cache-hit=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$restore_status" ;;
          esac

      - name: Build shared Wework desktop E2E artifact
        if: steps.shared-build.outputs.cache-hit != 'true'
        uses: ./.github/actions/build-wework-core-e2e
        with:
          executor-image: ${{ needs.changes.outputs.executor_image }}
          backend-rs-image: ${{ needs.changes.outputs.backend_rs_image }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Upload Wework desktop Core E2E build
        uses: actions/upload-artifact@v4
        with:
          name: wework-desktop-core-e2e-build
          path: .ci-artifacts/wework-core-e2e-build.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload Wework desktop Core E2E build diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: wework-desktop-core-e2e-build-diagnostics
          path: |
            wework/test-results/desktop-e2e/
            !wework/test-results/desktop-e2e/**/managed-components/**
            !wework/test-results/desktop-e2e/**/*.zip
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6

  wework-desktop-core-e2e:
    name: Wework Desktop E2E (${{ matrix.name }})
    needs:
      - changes
      - build-wework-desktop-core-e2e
    if: needs.changes.outputs.wework_desktop_core_e2e == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.action != 'labeled' || github.event.label.name == 'ci:all')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HOME: /root
    container:
      image: ${{ needs.changes.outputs.desktop_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      max-parallel: 17
      matrix: ${{ fromJSON(needs.changes.outputs.wework_desktop_core_e2e_matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: false

      - name: Restore local harness CLIs
        if: contains(matrix.segments, 'local-harness') || contains(matrix.segments, 'claude-runtime') || contains(matrix.segments, 'collaboration-agent-automation-chain')
        id: local-harness-clis-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .github/claude-code-cli/node_modules
          key: ${{ runner.os }}-node-24-local-harness-clis-v2-${{ hashFiles('.github/claude-code-cli/package.json', '.github/claude-code-cli/package-lock.json') }}

      - name: Install local harness CLIs
        if: (contains(matrix.segments, 'local-harness') || contains(matrix.segments, 'claude-runtime') || contains(matrix.segments, 'collaboration-agent-automation-chain')) && steps.local-harness-clis-cache.outputs.cache-hit != 'true'
        run: npm ci --prefix .github/claude-code-cli --strict-allow-scripts

      - name: Verify local harness CLIs
        if: contains(matrix.segments, 'local-harness') || contains(matrix.segments, 'claude-runtime') || contains(matrix.segments, 'collaboration-agent-automation-chain')
        run: .github/scripts/verify-local-harness-clis.sh

      - name: Download Wework desktop Core E2E build
        uses: actions/download-artifact@v4
        with:
          name: wework-desktop-core-e2e-build
          path: .ci-artifacts

      - name: Restore Wework desktop Core E2E build
        run: .github/scripts/restore-wework-core-e2e-build.sh

      - name: Set up Collaboration frontend
        if: contains(matrix.segments, 'collaboration-shared-core') || contains(matrix.segments, 'collaboration-agent-automation-chain')
        uses: ./.github/actions/setup-node-workspace
        with:
          setup-toolchain: "false"

      - name: Run Wework desktop Core shard E2E
        env:
          CI: true
          WEWORK_E2E_SOCKET_IO_CLIENT: ${{ github.workspace }}/.ci-artifacts/wework-core-e2e-build/e2e-client/socket.io-client.cjs
          WEWORK_E2E_APP_BIN: ${{ github.workspace }}/.ci-artifacts/wework-core-e2e-build/electron-app/WeWork
          WEWORK_E2E_EXECUTOR_BIN: ${{ github.workspace }}/.ci-artifacts/wework-core-e2e-build/electron-app/resources/bin/wegent-executor
          WEWORK_E2E_CODEX_BIN: ${{ github.workspace }}/.ci-artifacts/wework-core-e2e-build/codex/x86_64-unknown-linux-gnu/vendor/x86_64-unknown-linux-musl/bin/codex
          WEWORK_E2E_ISOLATED_XVFB: "true"
          WEWORK_E2E_PARALLEL_CHECKPOINTS: "2"
          WEWORK_E2E_PARALLEL_SCOPE: core
          WEWORK_E2E_BACKEND_RS_BIN: ${{ github.workspace }}/.ci-artifacts/wework-core-e2e-build/backend-rs/wegent-backend-rs
          WEWORK_E2E_SCREENSHOTS: ${{ contains(matrix.segments, 'harness-apps') && 'harness-milestones' || 'all' }}
          WEWORK_E2E_SEGMENTS: ${{ matrix.segments }}
        run: |
          test -x "$WEWORK_E2E_APP_BIN"
          test -x "$WEWORK_E2E_EXECUTOR_BIN"
          test -x "$WEWORK_E2E_BACKEND_RS_BIN"
          test -x "$WEWORK_E2E_CODEX_BIN"
          node wework/e2e/desktop/run-checkpoints.mjs \
            --parallel-segments "$WEWORK_E2E_SEGMENTS"

      - name: Prune transient Wework desktop E2E caches
        if: always()
        run: .github/scripts/prune-wework-desktop-e2e-diagnostics.sh

      - name: Upload Wework desktop E2E diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: wework-desktop-${{ matrix.id }}-e2e-diagnostics
          path: |
            wework/test-results/desktop-e2e/
            !wework/test-results/desktop-e2e/**/executor-home/**
            !wework/test-results/desktop-e2e/**/managed-components/**
            !wework/test-results/desktop-e2e/**/managed-runtimes/**
            !wework/test-results/desktop-e2e/**/dsh-core/profiles/**
            !wework/test-results/desktop-e2e/**/harness-apps/instances/**/profiles/**
            !wework/test-results/desktop-e2e/**/*.zip
            !wework/test-results/desktop-e2e/**/harness-runtime/**
            !wework/test-results/desktop-e2e/**/node-runtime/**
            !wework/test-results/desktop-e2e/**/WeWork-Electron-E2E-*.app/**
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6

  build-wework-desktop-windows-core-e2e:
    name: Build Windows Wework Desktop Core E2E Artifact
    needs:
      - changes
    if: needs.changes.outputs.wework_desktop_core_e2e == 'true' && github.event_name != 'merge_group' && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.action == 'labeled' && github.event.label.name == 'ci:all'))
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.ci-cache/electron
      WEGENT_CODEX_CACHE_DIR: ${{ github.workspace }}/.ci-cache/codex

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          filter: blob:none

      - name: Set up Node workspace
        uses: ./.github/actions/setup-node-workspace
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8f

      - name: Set up sccache
        uses: ./.github/actions/setup-sccache

      - name: Restore Windows Wework Electron E2E build dependencies
        id: wework-windows-desktop-cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/executor-target
            ${{ env.ELECTRON_CACHE }}
          key: ${{ runner.os }}-wework-electron-e2e-v1-${{ hashFiles('executor/Cargo.lock', 'backend-rs/Cargo.lock', 'wework/electron/package.json', 'wework/electron/pnpm-lock.yaml', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-wework-electron-e2e-v1-

      - name: Restore bundled Codex cache
        id: bundled-windows-codex-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.WEGENT_CODEX_CACHE_DIR }}
          key: ${{ runner.os }}-wework-codex-v1-${{ hashFiles('wework/codex-binaries.lock.json') }}

      - name: Build Windows Wework Electron E2E application
        env:
          CI: true
          WEWORK_EXECUTOR_TARGET_DIR: ${{ runner.temp }}/executor-target
          WEWORK_EXECUTOR_PROFILE: debug
        run: |
          pnpm --filter wework ai:verify:electron:build
          test -f wework/electron/release/WeWork-win32-x64/WeWork.exe
          test -f wework/electron/release/WeWork-win32-x64/resources/bin/wegent-executor.exe
          test -f wework/electron/release/WeWork-win32-x64/resources/codex/vendor/x86_64-pc-windows-msvc/bin/codex.exe
          test -f wework/electron/release/WeWork-win32-x64/resources/bundled-plugins/wework-personal/.agents/plugins/marketplace.json

      - name: Build Rust Backend Windows E2E gateway
        shell: pwsh
        run: |
          $backendRsTarget = Join-Path $env:RUNNER_TEMP "backend-rs-target"
          $env:CARGO_TARGET_DIR = $backendRsTarget
          cargo build --locked --manifest-path backend-rs/Cargo.toml --bin wegent-backend-rs
          $backendRsBin = Join-Path $backendRsTarget "debug/wegent-backend-rs.exe"
          $appBackendRsBin = "wework/electron/release/WeWork-win32-x64/resources/bin/wegent-backend-rs.exe"
          Copy-Item -LiteralPath $backendRsBin -Destination $appBackendRsBin -Force
          if (-not (Test-Path $appBackendRsBin -PathType Leaf)) {
            throw "Missing Windows Rust Backend E2E gateway: $appBackendRsBin"
          }

      - name: Prepare Windows Redis E2E tools
        shell: pwsh
        env:
          REDIS_WINDOWS_VERSION: 8.10.1
          REDIS_WINDOWS_SHA256: 4e8f2f956ed92feadf3f64b4e137ed34026438821e692e7ae22c9bba5976607a
        run: |
          $archiveName = "Redis-$env:REDIS_WINDOWS_VERSION-Windows-x64-msys2.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $downloadUrl = "https://github.com/redis-windows/redis-windows/releases/download/$env:REDIS_WINDOWS_VERSION/$archiveName"
          curl.exe --fail --location --retry 3 --output $archivePath $downloadUrl
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download Windows Redis E2E tools"
          }
          $actualSha256 = (Get-FileHash -Algorithm SHA256 $archivePath).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $env:REDIS_WINDOWS_SHA256) {
            throw "Unexpected Windows Redis archive SHA256: $actualSha256"
          }

          $extractRoot = Join-Path $env:RUNNER_TEMP "redis-windows"
          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractRoot
          $sourceRoot = Join-Path $extractRoot "Redis-$env:REDIS_WINDOWS_VERSION-Windows-x64-msys2"
          $toolsRoot = Join-Path $env:GITHUB_WORKSPACE "wework/test-results/windows-e2e-tools/redis"
          New-Item -ItemType Directory -Path $toolsRoot -Force | Out-Null
          Copy-Item -Path (Join-Path $sourceRoot "*") -Destination $toolsRoot -Recurse -Force
          foreach ($binary in @("redis-server.exe", "redis-cli.exe")) {
            if (-not (Test-Path (Join-Path $toolsRoot $binary) -PathType Leaf)) {
              throw "Missing Windows Redis E2E binary: $binary"
            }
          }

      - name: Save Windows Wework Electron E2E build dependencies
        if: github.ref == 'refs/heads/main' && steps.wework-windows-desktop-cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/executor-target
            ${{ env.ELECTRON_CACHE }}
          key: ${{ steps.wework-windows-desktop-cargo-cache.outputs.cache-primary-key }}

      - name: Save bundled Codex cache
        if: github.ref == 'refs/heads/main' && steps.bundled-windows-codex-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.WEGENT_CODEX_CACHE_DIR }}
          key: ${{ steps.bundled-windows-codex-cache.outputs.cache-primary-key }}

      - name: Upload Windows Wework desktop Core E2E build
        uses: actions/upload-artifact@v4
        with:
          name: wework-desktop-windows-core-e2e-build
          path: wework/electron/release/WeWork-win32-x64/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: true

      - name: Upload Windows Redis E2E tools
        uses: actions/upload-artifact@v4
        with:
          name: wework-desktop-windows-redis-e2e-tools
          path: wework/test-results/windows-e2e-tools/redis/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload Windows Wework desktop Core E2E build diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: wework-desktop-windows-core-e2e-build-diagnostics
          path: |
            wework/test-results/desktop-e2e/
            !wework/test-results/desktop-e2e/**/managed-components/**
            !wework/test-results/desktop-e2e/**/*.zip
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6

  wework-desktop-windows-core-e2e:
    name: Wework Desktop Windows E2E (${{ matrix.name }})
    needs:
      - changes
      - build-wework-desktop-windows-core-e2e
    if: needs.changes.outputs.wework_desktop_core_e2e == 'true' && github.event_name != 'merge_group' && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.action == 'labeled' && github.event.label.name == 'ci:all'))
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 17
      matrix: ${{ fromJSON(needs.changes.outputs.wework_desktop_core_e2e_matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: false

      - name: Set up Node workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv-cache
        with:
          python-version: "3.12"

      - name: Restore local harness CLIs
        if: contains(matrix.segments, 'local-harness') || contains(matrix.segments, 'claude-runtime')
        id: windows-local-harness-clis-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .github/claude-code-cli/node_modules
          key: ${{ runner.os }}-node-24-local-harness-clis-v2-${{ hashFiles('.github/claude-code-cli/package.json', '.github/claude-code-cli/package-lock.json') }}

      - name: Install local harness CLIs
        if: (contains(matrix.segments, 'local-harness') || contains(matrix.segments, 'claude-runtime')) && steps.windows-local-harness-clis-cache.outputs.cache-hit != 'true'
        run: npm ci --prefix .github/claude-code-cli --strict-allow-scripts

      - name: Verify local harness CLIs
        if: contains(matrix.segments, 'local-harness') || contains(matrix.segments, 'claude-runtime')
        run: .github/scripts/verify-local-harness-clis.sh

      - name: Download Windows Wework desktop Core E2E build
        uses: actions/download-artifact@v4
        with:
          name: wework-desktop-windows-core-e2e-build
          path: wework/electron/release/WeWork-win32-x64

      - name: Download Windows Redis E2E tools
        uses: actions/download-artifact@v4
        with:
          name: wework-desktop-windows-redis-e2e-tools
          path: wework/test-results/windows-e2e-tools/redis

      - name: Configure Windows Redis E2E tools
        shell: pwsh
        run: |
          $redisRoot = (Resolve-Path "wework/test-results/windows-e2e-tools/redis").Path
          foreach ($binary in @("redis-server.exe", "redis-cli.exe")) {
            $binaryPath = Join-Path $redisRoot $binary
            if (-not (Test-Path $binaryPath -PathType Leaf)) {
              throw "Missing Windows Redis E2E binary: $binary"
            }
            & $binaryPath --version
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to run Windows Redis E2E binary: $binary"
            }
          }
          $redisServerPath = Join-Path $redisRoot "redis-server.exe"
          "WEWORK_E2E_REDIS_SERVER_BIN=$redisServerPath" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Windows MySQL E2E tools
        shell: pwsh
        run: |
          $mysqlCandidates = @(
            (Get-Command mysqld.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source),
            "C:\Program Files\MySQL\MySQL Server 8.0\bin\mysqld.exe",
            "C:\Program Files\MySQL\MySQL Server 9.0\bin\mysqld.exe"
          ) | Where-Object { $_ -and (Test-Path $_ -PathType Leaf) }
          $mysqlServerPath = $mysqlCandidates | Select-Object -First 1
          if (-not $mysqlServerPath) {
            choco install mysql --yes --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to install MySQL Server for desktop E2E"
            }
            $mysqlServerPath = Get-ChildItem -Path "C:\Program Files\MySQL", "C:\tools\mysql" -Filter mysqld.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $mysqlServerPath) {
            throw "Could not locate mysqld.exe on the Windows runner"
          }
          & $mysqlServerPath --version
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to run MySQL Server binary: $mysqlServerPath"
          }
          "WEWORK_E2E_MYSQLD_BIN=$mysqlServerPath" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Windows Wework desktop Core shard E2E
        id: windows-core-e2e
        continue-on-error: true
        shell: pwsh
        env:
          CI: true
          WEWORK_E2E_APP_BIN: ${{ github.workspace }}/wework/electron/release/WeWork-win32-x64/WeWork.exe
          WEWORK_E2E_EXECUTOR_BIN: ${{ github.workspace }}/wework/electron/release/WeWork-win32-x64/resources/bin/wegent-executor.exe
          WEWORK_E2E_BACKEND_RS_BIN: ${{ github.workspace }}/wework/electron/release/WeWork-win32-x64/resources/bin/wegent-backend-rs.exe
          WEWORK_E2E_CODEX_BIN: ${{ github.workspace }}/wework/electron/release/WeWork-win32-x64/resources/codex/vendor/x86_64-pc-windows-msvc/bin/codex.exe
          WEWORK_E2E_PARALLEL_CHECKPOINTS: "1"
          WEWORK_E2E_PARALLEL_SCOPE: core
          WEWORK_E2E_SCREENSHOTS: ${{ contains(matrix.segments, 'harness-apps') && 'harness-milestones' || 'all' }}
          WEWORK_E2E_SEGMENTS: ${{ matrix.segments }}
        run: |
          foreach ($path in @(
            $env:WEWORK_E2E_APP_BIN,
            $env:WEWORK_E2E_EXECUTOR_BIN,
            $env:WEWORK_E2E_BACKEND_RS_BIN,
            $env:WEWORK_E2E_CODEX_BIN,
            (Join-Path (Split-Path $env:WEWORK_E2E_APP_BIN) "resources/bundled-plugins/wework-personal/.agents/plugins/marketplace.json")
          )) {
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Missing Windows Wework desktop E2E resource: $path"
            }
          }
          $arguments = @(
            "wework/e2e/desktop/run-checkpoints.mjs",
            "--parallel-segments",
            $env:WEWORK_E2E_SEGMENTS
          )
          $nodePath = (Get-Command node).Source
          & ./.github/scripts/run-windows-standard-user-process.ps1 `
            -FilePath $nodePath `
            @arguments

      - name: Report Windows standard-user startup failures
        if: always() && steps.windows-core-e2e.outcome == 'failure'
        run: node .github/scripts/report-wework-desktop-e2e-failures.mjs

      - name: Fail Windows Wework desktop Core shard E2E
        if: always() && steps.windows-core-e2e.outcome == 'failure'
        run: exit 1

      - name: Prune transient Wework desktop E2E caches
        if: always()
        run: .github/scripts/prune-wework-desktop-e2e-diagnostics.sh

      - name: Upload Windows Wework desktop E2E diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: wework-desktop-windows-${{ matrix.id }}-e2e-diagnostics
          path: |
            wework/test-results/desktop-e2e/
            !wework/test-results/desktop-e2e/**/executor-home/**
            !wework/test-results/desktop-e2e/**/managed-components/**
            !wework/test-results/desktop-e2e/**/managed-runtimes/**
            !wework/test-results/desktop-e2e/**/dsh-core/profiles/**
            !wework/test-results/desktop-e2e/**/harness-apps/instances/**/profiles/**
            !wework/test-results/desktop-e2e/**/*.zip
            !wework/test-results/desktop-e2e/**/harness-runtime/**
            !wework/test-results/desktop-e2e/**/node-runtime/**
            !wework/test-results/desktop-e2e/**/WeWork-Electron-E2E-*.app/**
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6

  wework-desktop-cloud-e2e:
    name: Wework Desktop E2E (${{ matrix.name }})
    needs:
      - changes
      - build-wework-desktop-core-e2e
    if: needs.changes.outputs.wework_desktop_cloud_e2e == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.action != 'labeled' || github.event.label.name == 'ci:all')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HOME: /root
    container:
      image: ${{ needs.changes.outputs.desktop_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.changes.outputs.wework_desktop_cloud_e2e_matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: false

      - name: Download shared Wework desktop E2E build
        uses: actions/download-artifact@v4
        with:
          name: wework-desktop-core-e2e-build
          path: .ci-artifacts

      - name: Restore shared Wework desktop E2E build
        run: .github/scripts/restore-wework-core-e2e-build.sh

      - name: Restore shared Python dependencies
        uses: ./.github/actions/setup-python-uv-cache
        with:
          python-version: "3.12"
          setup-python: "false"
          setup-uv: "false"

      - name: Prepare the pinned native DWS compiler for account authentication E2E
        if: contains(matrix.segments, 'plugin-account-auth')
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.9"
          cache: false

      - name: Run Wework desktop Cloud E2E checkpoints
        env:
          CI: true
          WEWORK_E2E_SOCKET_IO_CLIENT: ${{ github.workspace }}/.ci-artifacts/wework-core-e2e-build/e2e-client/socket.io-client.cjs
          WEWORK_E2E_APP_BIN: ${{ github.workspace }}/.ci-artifacts/wework-core-e2e-build/electron-app/WeWork
          WEWORK_E2E_CODEX_BIN: ${{ github.workspace }}/.ci-artifacts/wework-core-e2e-build/codex/x86_64-unknown-linux-gnu/vendor/x86_64-unknown-linux-musl/bin/codex
          WEWORK_E2E_EXECUTOR_BIN: ${{ github.workspace }}/.ci-artifacts/wework-core-e2e-build/electron-app/resources/bin/wegent-executor
          WEWORK_E2E_BACKEND_RS_BIN: ${{ github.workspace }}/.ci-artifacts/wework-core-e2e-build/backend-rs/wegent-backend-rs
          WEWORK_E2E_ISOLATED_XVFB: "true"
          WEWORK_E2E_PARALLEL_CHECKPOINTS: "3"
          WEWORK_E2E_PARALLEL_SCOPE: cloud
          WEWORK_E2E_SEGMENTS: ${{ matrix.segments }}
          WEWORK_E2E_DWS_FIXTURE_DIR: ${{ github.workspace }}/.ci-artifacts/dws-account-auth
        run: |
          test -x "$WEWORK_E2E_APP_BIN"
          test -x "$WEWORK_E2E_BACKEND_RS_BIN"
          test -x "$WEWORK_E2E_EXECUTOR_BIN"
          test -x "$WEWORK_E2E_CODEX_BIN"

          dws_pid=""
          if [[ "$WEWORK_E2E_SEGMENTS" == *plugin-account-auth* ]]; then
            rm -rf "$WEWORK_E2E_DWS_FIXTURE_DIR"
            mkdir -p "$WEWORK_E2E_DWS_FIXTURE_DIR"
            (
              status=0
              uv run --no-project python \
                wework/e2e/desktop/fixtures/dws-account-auth.py \
                prepare \
                --output "$WEWORK_E2E_DWS_FIXTURE_DIR/dws-native.zip" \
                --helper-output "$WEWORK_E2E_DWS_FIXTURE_DIR/store-helper" ||
                status=$?
              if [[ "$status" -eq 0 ]]; then
                touch "$WEWORK_E2E_DWS_FIXTURE_DIR/ready"
              else
                echo "$status" > "$WEWORK_E2E_DWS_FIXTURE_DIR/failed"
              fi
              exit "$status"
            ) &
            dws_pid=$!
          fi

          status=0
          node wework/e2e/desktop/run-checkpoints.mjs \
            --parallel-segments "$WEWORK_E2E_SEGMENTS" ||
            status=$?
          if [[ -n "$dws_pid" ]]; then
            wait "$dws_pid" || status=$?
          fi
          exit "$status"

      - name: Prune transient Wework desktop E2E caches
        if: always()
        run: .github/scripts/prune-wework-desktop-e2e-diagnostics.sh

      - name: Upload Wework desktop Cloud E2E diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: wework-desktop-${{ matrix.id }}-e2e-diagnostics
          path: |
            wework/test-results/desktop-e2e/
            !wework/test-results/desktop-e2e/**/executor-home/**
            !wework/test-results/desktop-e2e/**/managed-components/**
            !wework/test-results/desktop-e2e/**/managed-runtimes/**
            !wework/test-results/desktop-e2e/**/dsh-core/profiles/**
            !wework/test-results/desktop-e2e/**/harness-apps/instances/**/profiles/**
            !wework/test-results/desktop-e2e/**/*.zip
            !wework/test-results/desktop-e2e/**/harness-runtime/**
            !wework/test-results/desktop-e2e/**/node-runtime/**
            !wework/test-results/desktop-e2e/**/WeWork-Electron-E2E-*.app/**
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6

  wework-desktop-e2e:
    name: Wework Desktop E2E (${{ matrix.name }})
    needs:
      - changes
      - build-wework-desktop-core-e2e
    if: needs.changes.outputs.wework_desktop_other_e2e == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.action != 'labeled' || github.event.label.name == 'ci:all')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HOME: /root
    container:
      image: ${{ needs.changes.outputs.desktop_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.wework_desktop_other_e2e_matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          filter: blob:none

      - name: Download shared Wework desktop E2E build
        uses: actions/download-artifact@v4
        with:
          name: wework-desktop-core-e2e-build
          path: .ci-artifacts

      - name: Restore shared Wework desktop E2E build
        run: .github/scripts/restore-wework-core-e2e-build.sh

      - name: Run Wework desktop ${{ matrix.name }} E2E
        env:
          CI: true
          WEWORK_E2E_SOCKET_IO_CLIENT: ${{ github.workspace }}/.ci-artifacts/wework-core-e2e-build/e2e-client/socket.io-client.cjs
          CODEX_BIN: ${{ github.workspace }}/.ci-artifacts/wework-core-e2e-build/codex/x86_64-unknown-linux-gnu/vendor/x86_64-unknown-linux-musl/bin/codex
          E2E_COMMAND: ${{ matrix.command }}
          E2E_SEGMENT: ${{ matrix.segment }}
          WEWORK_E2E_APP_BIN: ${{ github.workspace }}/.ci-artifacts/wework-core-e2e-build/electron-app/WeWork
          WEWORK_E2E_EXECUTOR_BIN: ${{ github.workspace }}/.ci-artifacts/wework-core-e2e-build/electron-app/resources/bin/wegent-executor
          WEWORK_E2E_BACKEND_RS_BIN: ${{ github.workspace }}/.ci-artifacts/wework-core-e2e-build/backend-rs/wegent-backend-rs
          WEWORK_E2E_DESKTOP_SCENARIO_MODULE: ${{ matrix.segment == 'embedded-browser' && './scenarios/embedded-browser-agent.scenario.mjs' || matrix.segment == 'browser-multi-tabs' && './scenarios/embedded-browser-multi-tabs.scenario.mjs' || matrix.segment == 'browser-toolbar-actions' && './scenarios/embedded-browser-toolbar-actions.scenario.mjs' || startsWith(matrix.segment, 'browser-annotation-') && './scenarios/embedded-browser-annotation.scenario.mjs' || '' }}
          WEWORK_E2E_ISOLATED_XVFB: "true"
        run: |
          test -x "$CODEX_BIN"
          test -x "$WEWORK_E2E_APP_BIN"
          test -x "$WEWORK_E2E_EXECUTOR_BIN"
          test -x "$WEWORK_E2E_BACKEND_RS_BIN"
          args=()
          if [[ -n "$E2E_SEGMENT" ]]; then
            args=(-- --segment "$E2E_SEGMENT")
          fi
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            pnpm --filter wework "$E2E_COMMAND" "${args[@]}"

      - name: Prune transient Wework desktop E2E caches
        if: always()
        run: .github/scripts/prune-wework-desktop-e2e-diagnostics.sh

      - name: Upload Wework desktop E2E diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: wework-desktop-${{ matrix.id }}-e2e-diagnostics
          path: |
            wework/test-results/desktop-e2e/
            !wework/test-results/desktop-e2e/**/executor-home/**
            !wework/test-results/desktop-e2e/**/managed-components/**
            !wework/test-results/desktop-e2e/**/managed-runtimes/**
            !wework/test-results/desktop-e2e/**/dsh-core/profiles/**
            !wework/test-results/desktop-e2e/**/harness-apps/instances/**/profiles/**
            !wework/test-results/desktop-e2e/**/*.zip
            !wework/test-results/desktop-e2e/**/harness-runtime/**
            !wework/test-results/desktop-e2e/**/node-runtime/**
            !wework/test-results/desktop-e2e/**/WeWork-Electron-E2E-*.app/**
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6

  wework-e2e-summary:
    name: Wework E2E Summary
    needs:
      - changes
      - wework-e2e
      - build-wework-desktop-core-e2e
      - build-wework-desktop-windows-core-e2e
      - wework-desktop-cloud-e2e
      - wework-desktop-core-e2e
      - wework-desktop-windows-core-e2e
      - wework-desktop-e2e
      - wework-desktop-memory-e2e
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check Wework E2E results
        env:
          RUN_E2E: ${{ needs.changes.outputs.wework_e2e == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.action != 'labeled' || github.event.label.name == 'ci:all'))) }}
          RUN_DESKTOP_CORE_E2E: ${{ needs.changes.outputs.wework_desktop_core_e2e == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.action != 'labeled' || github.event.label.name == 'ci:all'))) }}
          RUN_WINDOWS_DESKTOP_CORE_E2E: ${{ needs.changes.outputs.wework_desktop_core_e2e == 'true' && github.event_name != 'merge_group' && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.action == 'labeled' && github.event.label.name == 'ci:all')) }}
          RUN_DESKTOP_CLOUD_E2E: ${{ needs.changes.outputs.wework_desktop_cloud_e2e == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.action != 'labeled' || github.event.label.name == 'ci:all'))) }}
          RUN_DESKTOP_OTHER_E2E: ${{ needs.changes.outputs.wework_desktop_other_e2e == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.action != 'labeled' || github.event.label.name == 'ci:all'))) }}
          RUN_MACOS_INSPECTOR_E2E: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.changes.outputs.wework_desktop_macos_inspector_e2e == 'true' && (github.event.action != 'labeled' || github.event.label.name == 'ci:all'))) }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          WEB_E2E_RESULT: ${{ needs.wework-e2e.result }}
          DESKTOP_CORE_BUILD_RESULT: ${{ needs.build-wework-desktop-core-e2e.result }}
          WINDOWS_DESKTOP_CORE_BUILD_RESULT: ${{ needs.build-wework-desktop-windows-core-e2e.result }}
          DESKTOP_CLOUD_E2E_RESULT: ${{ needs.wework-desktop-cloud-e2e.result }}
          DESKTOP_CORE_E2E_RESULT: ${{ needs.wework-desktop-core-e2e.result }}
          WINDOWS_DESKTOP_CORE_E2E_RESULT: ${{ needs.wework-desktop-windows-core-e2e.result }}
          DESKTOP_OTHER_E2E_RESULT: ${{ needs.wework-desktop-e2e.result }}
          MACOS_INSPECTOR_E2E_RESULT: ${{ needs.wework-desktop-memory-e2e.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Wework E2E change detection completed with: $CHANGES_RESULT"
            exit 1
          fi

          if [[ "$RUN_E2E" != "true" && \
            "$RUN_DESKTOP_CORE_E2E" != "true" && \
            "$RUN_WINDOWS_DESKTOP_CORE_E2E" != "true" && \
            "$RUN_DESKTOP_CLOUD_E2E" != "true" && \
            "$RUN_DESKTOP_OTHER_E2E" != "true" && \
            "$RUN_MACOS_INSPECTOR_E2E" != "true" ]]; then
            echo "Wework E2E is not required for this event"
            exit 0
          fi

          if [[ "$RUN_E2E" == "true" && "$WEB_E2E_RESULT" != "success" ]]; then
            echo "Wework browser E2E completed with: $WEB_E2E_RESULT"
            exit 1
          fi

          if [[ ( "$RUN_DESKTOP_CORE_E2E" == "true" || \
            "$RUN_DESKTOP_CLOUD_E2E" == "true" || \
            "$RUN_DESKTOP_OTHER_E2E" == "true" ) && \
            "$DESKTOP_CORE_BUILD_RESULT" != "success" ]]; then
            echo "Shared Wework desktop E2E build completed with: $DESKTOP_CORE_BUILD_RESULT"
            exit 1
          fi

          if [[ "$RUN_DESKTOP_CLOUD_E2E" == "true" && \
            "$DESKTOP_CLOUD_E2E_RESULT" != "success" ]]; then
            echo "Wework desktop Cloud E2E completed with: $DESKTOP_CLOUD_E2E_RESULT"
            exit 1
          fi

          if [[ "$RUN_DESKTOP_CORE_E2E" == "true" && \
            "$DESKTOP_CORE_E2E_RESULT" != "success" ]]; then
            echo "Wework desktop Core E2E completed with: $DESKTOP_CORE_E2E_RESULT"
            exit 1
          fi

          if [[ "$RUN_WINDOWS_DESKTOP_CORE_E2E" == "true" && \
            "$WINDOWS_DESKTOP_CORE_BUILD_RESULT" != "success" ]]; then
            echo "Windows Wework desktop Core E2E build completed with: $WINDOWS_DESKTOP_CORE_BUILD_RESULT"
            exit 1
          fi

          if [[ "$RUN_WINDOWS_DESKTOP_CORE_E2E" == "true" && \
            "$WINDOWS_DESKTOP_CORE_E2E_RESULT" != "success" ]]; then
            echo "Windows Wework desktop Core E2E completed with: $WINDOWS_DESKTOP_CORE_E2E_RESULT"
            exit 1
          fi

          if [[ "$RUN_DESKTOP_OTHER_E2E" == "true" && \
            "$DESKTOP_OTHER_E2E_RESULT" != "success" ]]; then
            echo "Wework desktop non-Core E2E completed with: $DESKTOP_OTHER_E2E_RESULT"
            exit 1
          fi

          if [[ "$RUN_MACOS_INSPECTOR_E2E" == "true" && \
            "$MACOS_INSPECTOR_E2E_RESULT" != "success" ]]; then
            echo "Wework desktop macOS Inspector E2E completed with: $MACOS_INSPECTOR_E2E_RESULT"
            exit 1
          fi

  wework-desktop-memory-e2e:
    name: Wework Desktop Memory E2E
    needs: changes
    if: github.event_name != 'merge_group' && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (needs.changes.outputs.wework_desktop_macos_inspector_e2e == 'true' || contains(github.event.pull_request.labels.*.name, 'ci:memory') || contains(github.event.pull_request.labels.*.name, 'ci:all'))))
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          filter: blob:none

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.1

      - name: Log in to GHCR with ORAS
        run: echo "$GITHUB_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Resolve shared macOS Wework E2E build
        id: macos-build
        env:
          EXECUTOR_SOURCE_DIGEST: ${{ hashFiles('executor/Cargo.toml', 'executor/Cargo.lock', 'executor/src/**/*.rs') }}
          BACKEND_RS_SOURCE_DIGEST: ${{ hashFiles('backend-rs/Cargo.toml', 'backend-rs/Cargo.lock', 'backend-rs/src/**/*.rs') }}
        run: |
          mkdir -p .ci-artifacts
          reference_output="$(mktemp)"
          GITHUB_OUTPUT="$reference_output" \
            .github/scripts/resolve-wework-macos-e2e-build-ref.sh \
            "$GITHUB_REPOSITORY_OWNER" \
            "$EXECUTOR_SOURCE_DIGEST" \
            "$BACKEND_RS_SOURCE_DIGEST"
          reference="$(sed -n 's/^reference=//p' "$reference_output")"
          test -n "$reference"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"

          set +e
          .github/scripts/restore-wework-core-e2e-build-oci.sh \
            .ci-artifacts/wework-macos-e2e-build.tar.zst \
            "$reference"
          restore_status=$?
          set -e
          case "$restore_status" in
            0) echo "cache-hit=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "cache-hit=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$restore_status" ;;
          esac

      - name: Set up Rust
        if: steps.macos-build.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Set up sccache
        if: steps.macos-build.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-sccache

      - name: Set up pnpm
        if: steps.macos-build.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up macOS Inspector backend runtime
        if: github.event_name != 'pull_request' || needs.changes.outputs.wework_desktop_macos_inspector_e2e == 'true' || contains(github.event.pull_request.labels.*.name, 'ci:all')
        uses: ./.github/actions/setup-python-uv-cache
        with:
          python-version: "3.12"

      - name: Resolve pnpm store path
        if: steps.macos-build.outputs.cache-hit != 'true'
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore shared macOS pnpm store
        if: steps.macos-build.outputs.cache-hit != 'true'
        id: macos-pnpm-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-v2-${{ hashFiles('pnpm-lock.yaml', 'wework/electron/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-v2-
            ${{ runner.os }}-pnpm-store-v1-

      - name: Install dependencies
        env:
          INSTALL_MACOS_INSPECTOR_DEPENDENCIES: ${{ github.event_name != 'pull_request' || needs.changes.outputs.wework_desktop_macos_inspector_e2e == 'true' || contains(github.event.pull_request.labels.*.name, 'ci:all') }}
          MACOS_BUILD_CACHE_HIT: ${{ steps.macos-build.outputs.cache-hit }}
        run: |
          status=0
          if [[ "$MACOS_BUILD_CACHE_HIT" != "true" ]]; then
            pnpm install --frozen-lockfile &
            workspace_pid=$!
            pnpm --dir wework/electron install --frozen-lockfile &
            electron_pid=$!
          fi

          if [[ "$INSTALL_MACOS_INSPECTOR_DEPENDENCIES" == "true" ]]; then
            brew install redis libmagic mysql &
            brew_pid=$!
            uv sync --project backend --frozen &
            backend_pid=$!
          fi

          if [[ "$MACOS_BUILD_CACHE_HIT" != "true" ]]; then
            if ! wait "$workspace_pid"; then status=1; fi
            if ! wait "$electron_pid"; then status=1; fi
          fi
          if [[ "$INSTALL_MACOS_INSPECTOR_DEPENDENCIES" == "true" ]]; then
            if ! wait "$brew_pid"; then status=1; fi
            if ! wait "$backend_pid"; then status=1; fi
          fi
          if ((status != 0)); then exit "$status"; fi

          if [[ "$INSTALL_MACOS_INSPECTOR_DEPENDENCIES" == "true" ]]; then
            redis-server --version
            mysqld --version
            uv run --project backend python -c \
              "import magic; assert magic.from_buffer(b'Wework E2E', mime=True) == 'text/plain'"
          fi

      - name: Save shared macOS pnpm store
        if: steps.macos-build.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && steps.macos-pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.macos-pnpm-cache.outputs.cache-primary-key }}

      - name: Restore shared Wework Electron build dependencies
        if: steps.macos-build.outputs.cache-hit != 'true'
        id: wework-cargo-sources-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            executor/target
            backend-rs/target
            ~/Library/Caches/electron
          key: ${{ runner.os }}-wework-electron-app-v2-${{ hashFiles('executor/Cargo.lock', 'backend-rs/Cargo.lock', 'wework/electron/package.json', 'wework/electron/pnpm-lock.yaml', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-wework-electron-app-v2-
            ${{ runner.os }}-wework-electron-app-v1-

      - name: Restore macOS arm64 executor runtime
        if: steps.macos-build.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/wegent/wework-macos-e2e-runtimes/wegent-executor
          key: ${{ runner.os }}-${{ runner.arch }}-wework-macos-executor-runtime-v1-${{ hashFiles('executor/Cargo.toml', 'executor/Cargo.lock', 'executor/src/**/*.rs') }}

      - name: Restore macOS arm64 Rust backend runtime
        if: steps.macos-build.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/wegent/wework-macos-e2e-runtimes/wegent-backend-rs
          key: ${{ runner.os }}-${{ runner.arch }}-wework-macos-backend-rs-runtime-v1-${{ hashFiles('backend-rs/Cargo.toml', 'backend-rs/Cargo.lock', 'backend-rs/src/**/*.rs') }}

      - name: Restore macOS arm64 runtimes from OCI
        if: steps.macos-build.outputs.cache-hit != 'true'
        env:
          EXECUTOR_SOURCE_REF: ghcr.io/${{ github.repository_owner }}/wegent-wework-macos-e2e-runtime:executor-v1-${{ hashFiles('executor/Cargo.toml', 'executor/Cargo.lock', 'executor/src/**/*.rs') }}
          EXECUTOR_HEAD_REF: ghcr.io/${{ github.repository_owner }}/wegent-wework-macos-e2e-runtime:executor-head-${{ github.event.pull_request.head.sha || github.sha }}
          BACKEND_SOURCE_REF: ghcr.io/${{ github.repository_owner }}/wegent-wework-macos-e2e-runtime:backend-rs-v1-${{ hashFiles('backend-rs/Cargo.toml', 'backend-rs/Cargo.lock', 'backend-rs/src/**/*.rs') }}
          BACKEND_HEAD_REF: ghcr.io/${{ github.repository_owner }}/wegent-wework-macos-e2e-runtime:backend-rs-head-${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          runtime_root="$HOME/.cache/wegent/wework-macos-e2e-runtimes"
          .github/scripts/restore-macos-e2e-runtime-oci.sh \
            "$runtime_root/wegent-executor" \
            wegent-executor \
            "$EXECUTOR_SOURCE_REF" \
            "$EXECUTOR_HEAD_REF"
          .github/scripts/restore-macos-e2e-runtime-oci.sh \
            "$runtime_root/wegent-backend-rs" \
            wegent-backend-rs \
            "$BACKEND_SOURCE_REF" \
            "$BACKEND_HEAD_REF"

      - name: Build Wework Electron E2E application
        if: steps.macos-build.outputs.cache-hit != 'true'
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          WEWORK_EXECUTOR_TARGET_DIR: ${{ github.workspace }}/executor/target
          WEWORK_BACKEND_RS_TARGET_DIR: ${{ github.workspace }}/backend-rs/target
          WEWORK_EXECUTOR_PROFILE: release
        run: |
          runtime_root="$HOME/.cache/wegent/wework-macos-e2e-runtimes"
          executor_runtime="$runtime_root/wegent-executor"
          backend_runtime="$runtime_root/wegent-backend-rs"

          .github/scripts/build-macos-e2e-runtimes.sh \
            "$executor_runtime" \
            "$backend_runtime" &
          runtimes_pid=$!
          WEWORK_E2E_PREBUILT_EXECUTOR_PATH="$executor_runtime" \
            WEWORK_E2E_PREBUILT_EXECUTOR_WAIT_SECONDS="900" \
            CARGO_BUILD_TARGET=aarch64-apple-darwin \
            pnpm --filter wework ai:verify:electron:build &
          wework_pid=$!

          status=0
          wait "$wework_pid" || status=$?
          wait "$runtimes_pid" || status=$?
          if [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi

          test -x "$PWD/wework/electron/release/WeWork-darwin-arm64/WeWork.app/Contents/MacOS/WeWork"
          test -x "$PWD/wework/electron/release/WeWork-darwin-arm64/WeWork.app/Contents/Resources/bin/wegent-executor"
          test -x "$backend_runtime"

      - name: Archive and publish shared macOS Wework E2E build
        if: steps.macos-build.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          .github/scripts/archive-wework-macos-e2e-build.sh
          .github/scripts/publish-wework-core-e2e-build-oci.sh \
            .ci-artifacts/wework-macos-e2e-build.tar.zst \
            "${{ steps.macos-build.outputs.reference }}"

      - name: Restore shared macOS Wework E2E build
        if: steps.macos-build.outputs.cache-hit == 'true'
        run: .github/scripts/restore-wework-macos-e2e-build.sh

      - name: Configure shared macOS Wework E2E build
        run: |
          if [[ "${{ steps.macos-build.outputs.cache-hit }}" == "true" ]]; then
            build_root="$PWD/.ci-artifacts/wework-macos-e2e-build"
            app_bundle="$build_root/WeWork.app"
            backend_rs_bin="$build_root/wegent-backend-rs"
          else
            app_bundle="$PWD/wework/electron/release/WeWork-darwin-arm64/WeWork.app"
            backend_rs_bin="$HOME/.cache/wegent/wework-macos-e2e-runtimes/wegent-backend-rs"
          fi
          app_bin="$app_bundle/Contents/MacOS/WeWork"
          executor_bin="$app_bundle/Contents/Resources/bin/wegent-executor"
          codex_bin="$app_bundle/Contents/Resources/codex/vendor/aarch64-apple-darwin/bin/codex"
          test -x "$app_bin"
          test -x "$executor_bin"
          test -x "$codex_bin"
          test -x "$backend_rs_bin"
          {
            echo "CODEX_BIN=$codex_bin"
            echo "WEWORK_E2E_CODEX_BIN=$codex_bin"
            echo "WEWORK_E2E_APP_BIN=$app_bin"
            echo "WEWORK_E2E_EXECUTOR_BIN=$executor_bin"
            echo "WEWORK_E2E_BACKEND_RS_BIN=$backend_rs_bin"
          } >> "$GITHUB_ENV"

      - name: Run Wework desktop memory E2E
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:memory') || contains(github.event.pull_request.labels.*.name, 'ci:all')
        env:
          CI: true
        run: |
          test -x "$CODEX_BIN"
          test -x "$WEWORK_E2E_APP_BIN"
          test -x "$WEWORK_E2E_EXECUTOR_BIN"
          pnpm --filter wework e2e:desktop:memory

      - name: Run Wework desktop macOS Inspector E2E
        if: github.event_name != 'pull_request' || needs.changes.outputs.wework_desktop_macos_inspector_e2e == 'true' || contains(github.event.pull_request.labels.*.name, 'ci:all')
        env:
          CI: true
          WEWORK_E2E_PARALLEL_CHECKPOINTS: "3"
        run: |
          test -x "$CODEX_BIN"
          test -x "$WEWORK_E2E_APP_BIN"
          test -x "$WEWORK_E2E_EXECUTOR_BIN"
          test -x "$WEWORK_E2E_BACKEND_RS_BIN"
          node wework/e2e/desktop/run-checkpoints.mjs \
            --parallel-segments browser-toolbar-actions,tray-lifecycle,browser-annotation-design

      - name: Save shared Wework Electron build dependencies
        if: steps.macos-build.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && steps.wework-cargo-sources-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            executor/target
            backend-rs/target
            ~/Library/Caches/electron
          key: ${{ steps.wework-cargo-sources-cache.outputs.cache-primary-key }}

      - name: Prune transient Wework desktop E2E caches
        if: always()
        run: .github/scripts/prune-wework-desktop-e2e-diagnostics.sh

      - name: Upload Wework desktop memory diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: wework-desktop-memory-e2e-diagnostics
          path: |
            wework/test-results/desktop-e2e/
            !wework/test-results/desktop-e2e/**/executor-home/**
            !wework/test-results/desktop-e2e/**/managed-components/**
            !wework/test-results/desktop-e2e/**/managed-runtimes/**
            !wework/test-results/desktop-e2e/**/dsh-core/profiles/**
            !wework/test-results/desktop-e2e/**/harness-apps/instances/**/profiles/**
            !wework/test-results/desktop-e2e/**/*.zip
            !wework/test-results/desktop-e2e/**/harness-runtime/**
            !wework/test-results/desktop-e2e/**/node-runtime/**
            !wework/test-results/desktop-e2e/**/WeWork-Electron-E2E-*.app/**
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6
