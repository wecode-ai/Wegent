name: Wework E2E Image

on:
  push:
    branches:
      - main
    tags:
      - "wework-e2e-image-*"
    paths:
      - ".github/scripts/install-wework-tauri-system-dependencies.sh"
      - ".github/scripts/lib/apt-packages.sh"
      - ".github/workflows/wework-e2e-image.yml"
      - "docker/wework-e2e/Dockerfile"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: wework-e2e-image-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Wework E2E Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Wework E2E image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: docker/wework-e2e/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/wegent-wework-e2e:ubuntu24.04-v1
            ghcr.io/${{ github.repository_owner }}/wegent-wework-e2e:sha-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/wegent-wework-e2e:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/wegent-wework-e2e:buildcache,mode=max
