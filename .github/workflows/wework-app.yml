name: Wework App

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel. Stable releases also advance the Beta channel."
        type: choice
        options:
          - stable
          - beta
        required: true
        default: stable
      version:
        description: "Optional stable version override, for example 1.2.3"
        type: string
        required: false
      publish_release:
        description: "Publish a new version for all desktop changes"
        type: boolean
        required: false
        default: false
      approved_baseline_exclusions:
        description: "Human-approved incompatible baselines to exclude, comma-separated platform/arch/channel/version; never bypasses previous or required source verification"
        type: string
        required: false
        default: ""
      verification_run_id:
        description: "Only verify signed artifacts from an existing Wework App run; never build or publish"
        type: string
        required: false
        default: ""
      build_only:
        description: "Build immutable diagnostic inputs without running upgrade verification or publishing"
        type: boolean
        required: false
        default: false
      verification_checkpoint:
        description: "Run one diagnostic without producing upgrade evidence; refresh and retry require a prebuilt source"
        type: choice
        options:
          - all
          - app-rollback
          - app-rollback-recovery
          - app-upgrade-recovery
          - runtime-extraction
          - app-update-refresh
          - app-update-retry
        default: all
      verification_source_run_id:
        description: "Immutable source producer for a non-publishing full bridge round trip, refresh, or retry diagnostic"
        type: string
        required: false
        default: ""
      verification_release_tag:
        description: "Replay using the matching published release archive instead of the original candidate"
        type: string
        required: false
        default: ""
      verification_writer_wait_seconds:
        description: "Native writer observation before activation, integer 0..600 seconds; nonzero requires a target with stopped preparation"
        type: number
        required: false
        default: 0

concurrency:
  group: ${{ ((inputs.build_only && !inputs.publish_release) || inputs.verification_run_id != '' || (inputs.verification_source_run_id != '' && !inputs.publish_release)) && format('{0}-verification-{1}-{2}', github.workflow, github.ref, inputs.verification_run_id || inputs.verification_source_run_id || github.run_id) || github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  retry-regression:
    name: Verify update retry with independently built regression packages
    if: inputs.verification_checkpoint == 'app-update-retry' && inputs.verification_source_run_id == '' && inputs.verification_run_id == '' && !inputs.publish_release
    permissions:
      contents: read
    uses: ./.github/workflows/wework-upgrade-regression.yml
    with:
      target_version: ${{ inputs.version || '0.6.6' }}

  profile-runtime:
    name: Profile Windows runtime extraction (${{ matrix.runner }})
    if: inputs.verification_checkpoint == 'runtime-extraction'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-2022]
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Reject publication
        shell: bash
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: test "$PUBLISH_RELEASE" != true
      - name: Record Windows extraction environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-MpComputerStatus | Select-Object AMRunningMode, AntivirusEnabled, RealTimeProtectionEnabled, BehaviorMonitorEnabled | ConvertTo-Json -Compress
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | ConvertTo-Json -Compress
          Get-Volume | Where-Object DriveLetter -In @('C', 'D') | Select-Object DriveLetter, FileSystemType, SizeRemaining | ConvertTo-Json -Compress
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Install locked archive reader
        run: pnpm --dir wework/electron install --frozen-lockfile --ignore-scripts
      - name: Verify extraction boundaries on Windows
        run: |
          pnpm --dir wework/electron exec vitest run src/runtime/physical-release-files.test.ts src/runtime/immutable-directory.test.ts src/runtime/bundled-runtime-materializer.test.ts src/runtime/bundled-component-archive.test.ts src/runtime/legacy-prepared-source.test.ts src/runtime/release-layout-recovery.test.ts
          pnpm --dir wework/electron exec node --test ../scripts/retained-source-ownership.test.mjs ../scripts/bundled-runtime-cache.test.mjs ../scripts/installed-source-preparation.test.mjs ../scripts/installed-source-snapshot.test.mjs ../scripts/upgrade-source-prefetch.test.mjs
      - name: Measure the delivered runtime archive
        env:
          GH_TOKEN: ${{ github.token }}
          WEWORK_RUNTIME_PROFILE_RUN_ID: ${{ inputs.verification_run_id }}
        run: node wework/scripts/profile-runtime-extraction.mjs

  prepare-release:
    name: Prepare build
    if: inputs.verification_run_id == '' && (inputs.verification_checkpoint == 'all' || (contains(fromJSON('["app-update-refresh","app-update-retry"]'), inputs.verification_checkpoint) && inputs.verification_source_run_id != '' && !inputs.publish_release)) && inputs.verification_release_tag == ''
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.version-files.outputs.release_sha }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      version: ${{ steps.plan.outputs.value }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      publish_release: ${{ steps.version.outputs.publish_release }}
      release_kind: ${{ steps.plan.outputs.kind }}
      componentized_host_update: ${{ steps.current-channel.outputs.componentized_host_update }}

    steps:
      - name: Reject publishing unverified diagnostic inputs
        if: inputs.build_only && inputs.publish_release
        run: |
          echo 'Build-only diagnostics cannot publish a release' >&2
          exit 1
      - name: Reject publishing an unpublished source pair
        if: inputs.verification_source_run_id != '' && inputs.publish_release
        run: |
          echo 'Immutable source-pair diagnostics cannot publish a release' >&2
          exit 1
      - name: Create release app token
        id: release-app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID || secrets.RELEASE_APP_ID || vars.RELEASE_APP_CLIENT_ID || secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.release-app-token.outputs.token }}

      - name: Resolve Wework release version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel || 'stable' }}
          PUBLISH_RELEASE: ${{ github.event.inputs.publish_release == 'true' }}
        run: node wework/scripts/resolve-release-version.mjs

      - name: Resolve current channel state
        id: current-channel
        if: steps.version.outputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          RELEASE_CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/current-components.json"
          if gh release download wework-updater \
            --pattern "components-${RELEASE_CHANNEL}-macos-arm64.json" \
            --output "$manifest" \
            --clobber >/dev/null 2>&1; then
            node - "$manifest" "$GITHUB_OUTPUT" <<'NODE'
          const { appendFileSync, readFileSync } = require('node:fs')
          const [manifestPath, outputPath] = process.argv.slice(2)
          const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'))
          appendFileSync(outputPath, `app_version=${manifest.appVersion || ''}\n`)
          appendFileSync(outputPath, `source_ref=${manifest.sourceSha || ''}\n`)
          appendFileSync(
            outputPath,
            `componentized_host_update=${manifest.capabilities?.componentizedHostUpdate === 1}\n`,
          )
          NODE
          fi

      - name: Select release or skip unchanged source
        id: plan
        env:
          CANDIDATE_PRERELEASE: ${{ steps.version.outputs.prerelease }}
          CANDIDATE_TAG: ${{ steps.version.outputs.release_tag }}
          CANDIDATE_VERSION: ${{ steps.version.outputs.value }}
          CURRENT_APP_VERSION: ${{ steps.current-channel.outputs.app_version }}
          CURRENT_SOURCE_REF: ${{ steps.current-channel.outputs.source_ref }}
          PUBLISH_RELEASE: ${{ steps.version.outputs.publish_release }}
          RELEASE_CHANNEL: ${{ steps.version.outputs.channel }}
        run: node wework/scripts/plan-desktop-release.mjs

      - name: Validate release target
        if: steps.version.outputs.publish_release == 'true' && steps.plan.outputs.kind != 'none'
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          RELEASE_TAG: ${{ steps.plan.outputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "::error::Release $RELEASE_TAG is already published. Use a new version."
              exit 1
            fi
          fi

      - name: Commit Wework version files
        id: version-files
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          PUBLISH_RELEASE: ${{ steps.version.outputs.publish_release }}
          RELEASE_KIND: ${{ steps.plan.outputs.kind }}
          RELEASE_VERSION: ${{ steps.plan.outputs.value }}
        run: |
          set -euo pipefail
          node wework/scripts/sync-desktop-release-version.mjs "$RELEASE_VERSION"

          if [[ "$PUBLISH_RELEASE" != "true" || "$RELEASE_KIND" != "full" ]]; then
            git checkout -- wework/package.json wework/electron/package.json
            echo "release_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git diff --quiet -- wework/package.json wework/electron/package.json; then
            app_user_id="$(gh api "/users/${{ steps.release-app-token.outputs.app-slug }}[bot]" --jq .id)"
            git config user.name "${{ steps.release-app-token.outputs.app-slug }}[bot]"
            git config user.email "${app_user_id}+${{ steps.release-app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
            git add wework/package.json wework/electron/package.json
            git commit -m "chore(wework): bump app version to ${RELEASE_VERSION}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare-release
    if: needs.prepare-release.outputs.release_kind != 'none'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            platform: macos
            arch: arm64
            cargo_target: aarch64-apple-darwin
            codex_target: aarch64-apple-darwin
          - name: macOS x64
            runner: macos-15-intel
            platform: macos
            arch: x64
            cargo_target: x86_64-apple-darwin
            codex_target: x86_64-apple-darwin
          - name: Windows x64
            runner: windows-latest
            platform: windows
            arch: x64
            cargo_target: x86_64-pc-windows-msvc
            codex_target: x86_64-pc-windows-msvc
          - name: Linux x64
            runner: ubuntu-latest
            platform: linux
            arch: x64
            cargo_target: x86_64-unknown-linux-gnu
            codex_target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: ${{ matrix.cargo_target }}

      - name: Set up compiler cache
        uses: ./.github/actions/setup-sccache
        with:
          save-cache: "true"

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            wework/electron/pnpm-lock.yaml

      - name: Verify native build architecture
        env:
          WEWORK_RELEASE_ARCH: ${{ matrix.arch }}
          WEWORK_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          node -e '
            const expected = process.env.WEWORK_RELEASE_ARCH
            const host = { X64: "x64", ARM64: "arm64" }[process.env.WEWORK_RUNNER_ARCH]
            if (process.arch !== expected || host !== expected) {
              throw new Error("Release target " + expected + " requires native hardware and Node.js; runner uses " + host + "/" + process.arch)
            }
          '

      - name: Install workspace dependencies
        id: workspace-install
        shell: bash
        run: pnpm install --frozen-lockfile --reporter=ndjson | node .github/scripts/pnpm-install-report.mjs "$RUNNER_TEMP/pnpm-install-diagnostics.json"

      - name: Upload workspace install diagnostics
        if: always() && (steps.workspace-install.outcome == 'success' || steps.workspace-install.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-install-diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/pnpm-install-diagnostics.json
          retention-days: 7
          if-no-files-found: warn

      - name: Install Wework Electron dependencies
        run: |
          pnpm --dir wework/electron install --frozen-lockfile
          node -e 'require(require.resolve("electron", { paths: ["./wework/electron"] }))'

      - name: Synchronize desktop build version
        run: node wework/scripts/sync-desktop-release-version.mjs "${{ needs.prepare-release.outputs.version }}"

      - name: Prepare isolated Linux credential verification
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring libsecret-tools libglib2.0-bin x11-utils xvfb
          node --test wework/e2e/desktop/xvfb-lifecycle.test.mjs

      - name: Verify native contracts before packaging
        shell: bash
        run: |
          # Compile and validate the launcher before timed runtime probes; Node sorts test files.
          tests=(wework/scripts/build-launcher.test.mjs wework/scripts/windows-native-runtime.test.mjs wework/e2e/desktop/modules/macos-status-item.test.mjs wework/e2e/desktop/modules/release-startup-owner.test.mjs wework/scripts/upgrade-credentials.test.mjs)
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo install -m 644 .github/ci/wework-electron.apparmor /etc/apparmor.d/wework-electron-ci
            sudo apparmor_parser --replace /etc/apparmor.d/wework-electron-ci
            for test in "${tests[@]}"; do
              dbus-run-session -- xvfb-run -a node --test "$test"
            done
          else
            for test in "${tests[@]}"; do
              node --test "$test"
            done
          fi
          rustc --edition 2021 --test wework/launcher/src/main.rs -o "$RUNNER_TEMP/wework-launcher-tests.exe"
          "$RUNNER_TEMP/wework-launcher-tests.exe"

      - name: Prepare Apple signing keychain
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/wework-signing.p12"
          keychain_path="$RUNNER_TEMP/wework-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          existing_keychains=()
          while IFS= read -r existing_keychain; do
            existing_keychains+=("$existing_keychain")
          done < <(security list-keychains -d user |
            sed -E 's/^[[:space:]]*"([^"]+)"$/\1/')
          security list-keychains -d user -s "$keychain_path" "${existing_keychains[@]}"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          identity="$(security find-identity -v -p codesigning "$keychain_path" |
            awk '/Developer ID Application/ { print $2; exit }')"
          [[ "$identity" =~ ^[[:xdigit:]]{40}$ ]] || {
            echo "Developer ID Application identity not found" >&2
            exit 1
          }
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          # Reuse one keychain so parallel electron-builder processes do not race during cleanup.
          echo "CSC_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "MACOS_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Prepare Apple notarization key
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$key_path"
          chmod 0600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Restore immutable signed components
        if: matrix.platform == 'macos'
        uses: actions/cache@v4
        with:
          path: wework/electron/.cache/signed-components
          key: signed-components-v1-${{ matrix.arch }}-${{ env.APPLE_SIGNING_IDENTITY }}-${{ needs.prepare-release.outputs.release_sha }}
          restore-keys: |
            signed-components-v1-${{ matrix.arch }}-${{ env.APPLE_SIGNING_IDENTITY }}-

      - name: Use TCP for Apple ticket delivery on Intel runners
        if: matrix.platform == 'macos' && matrix.arch == 'x64'
        shell: bash
        run: |
          set -euo pipefail
          # Intel hosted runners lose HTTP/3 ticket requests (actions/runner-images#14924).
          # Limit the transport configuration to this disposable CI machine.
          echo 'block return out quick proto udp from any to any port 443' | sudo pfctl -f -
          sudo pfctl -E

      - name: Build signed Electron release
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CARGO_BUILD_TARGET: ${{ matrix.cargo_target }}
          VITE_WEGENT_BACKEND_URL: https://your.wegent-backend.address
          VITE_WEWORK_POSTHOG_HOST: ${{ secrets.WEWORK_POSTHOG_HOST }}
          VITE_WEWORK_POSTHOG_KEY: ${{ secrets.WEWORK_POSTHOG_KEY }}
          VITE_WEWORK_TELEMETRY_CONTEXT_FIELDS: ${{ vars.WEWORK_TELEMETRY_CONTEXT_FIELDS || '[]' }}
          VITE_WEWORK_TELEMETRY_IDENTITY: ${{ vars.WEWORK_TELEMETRY_IDENTITY || 'anonymous' }}
          VITE_WEWORK_TELEMETRY_SOURCE: ${{ vars.WEWORK_TELEMETRY_SOURCE || 'wework' }}
          VITE_WEWORK_RELEASE_CHANNEL: ${{ needs.prepare-release.outputs.channel }}
          VITE_WEWORK_RUNTIME_MODE: local-first
          WEWORK_CODEX_TARGET: ${{ matrix.codex_target }}
          WEWORK_DWS_TARGET: ${{ matrix.cargo_target }}
          WEWORK_ELECTRON_DEPENDENCIES_READY: "true"
          WEWORK_CUSTOM_MACOS_NOTARIZATION: ${{ matrix.platform == 'macos' && 'true' || '' }}
          WEWORK_RELEASE_ARCH: ${{ matrix.arch }}
          WEWORK_RELEASE_PLATFORM: ${{ matrix.platform }}
          WEWORK_RELEASE_DIAGNOSTICS_DIR: ${{ github.workspace }}/.ci-artifacts/release-build
          WEWORK_ONLINE_UPDATE_INCLUDE_COMPONENTS: ${{ needs.prepare-release.outputs.componentized_host_update != 'true' }}
          WEWORK_SOURCE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        run: pnpm --filter wework build:release

      - name: Retain release build stage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wework-release-build-diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          path: .ci-artifacts/release-build/*.jsonl
          if-no-files-found: ignore
          retention-days: 7

      - name: Set up real cloud verification dependencies
        if: matrix.platform == 'macos' && matrix.arch == 'arm64'
        uses: ./.github/actions/setup-python-uv-cache
        with:
          python-version: "3.12"

      - name: Prepare real cloud services
        if: matrix.platform == 'macos' && matrix.arch == 'arm64'
        run: bash .github/scripts/prepare-macos-inspector-e2e.sh

      - name: Set up cached native Backend transport
        if: matrix.platform == 'macos' && matrix.arch == 'arm64'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.1

      - name: Resolve matching native Backend source
        if: matrix.platform == 'macos' && matrix.arch == 'arm64'
        id: backend-source
        run: echo "digest=$(node .github/scripts/macos-e2e-source-digest.mjs backend-rs)" >> "$GITHUB_OUTPUT"

      - name: Restore matching native Backend
        if: matrix.platform == 'macos' && matrix.arch == 'arm64'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/wegent/wework-macos-e2e-runtimes/wegent-backend-rs
          key: ${{ runner.os }}-${{ runner.arch }}-wework-macos-backend-rs-runtime-v1-${{ steps.backend-source.outputs.digest }}

      - name: Prepare matching native Backend
        if: matrix.platform == 'macos' && matrix.arch == 'arm64'
        env:
          BACKEND_SOURCE_REF: ghcr.io/${{ github.repository_owner }}/wegent-wework-macos-e2e-runtime:backend-rs-v1-${{ steps.backend-source.outputs.digest }}
        run: |
          backend_bin="$HOME/.cache/wegent/wework-macos-e2e-runtimes/wegent-backend-rs"
          bash .github/scripts/restore-macos-e2e-runtime-oci.sh "$backend_bin" wegent-backend-rs "$BACKEND_SOURCE_REF"
          bash .github/scripts/build-macos-e2e-runtimes.sh \
            "$PWD/wework/electron/release-installer/mac-arm64/WeWork.app/Contents/Resources/bin/wegent-executor" "$backend_bin"
          echo "WEWORK_E2E_BACKEND_RS_BIN=$backend_bin" >> "$GITHUB_ENV"

      - name: Verify formal release package
        if: matrix.platform == 'macos' && matrix.arch == 'arm64'
        env:
          CODEX_BIN: ${{ github.workspace }}/wework/resources/binaries/codex/${{ matrix.codex_target }}/vendor/${{ matrix.codex_target }}/bin/codex
          WEWORK_E2E_APP_BIN: ${{ github.workspace }}/wework/electron/release-installer/mac-arm64/WeWork.app/Contents/MacOS/WeWork
          WEWORK_E2E_EXECUTOR_BIN: ${{ github.workspace }}/wework/electron/release-installer/mac-arm64/WeWork.app/Contents/Resources/bin/wegent-executor
          # Signed apps unpack separate runtimes; keep cold starts within runner capacity.
          WEWORK_E2E_PARALLEL_CHECKPOINTS: "1"
          WEWORK_E2E_PARALLEL_SCOPE: core
          WEWORK_E2E_REQUIRE_COMPRESSED_HOST_UPDATE: ${{ needs.prepare-release.outputs.componentized_host_update }}
          WEWORK_E2E_REQUIRE_RELEASE_PACKAGE: "1"
        run: |
          pnpm --filter wework e2e:desktop -- \
            --parallel-segments release-package-startup,component-update,security-boundaries

      - name: Retain formal security verification evidence
        if: matrix.platform == 'macos' && matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: wework-formal-security-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            wework/test-results/desktop-e2e/**/security-boundaries-result.json
            wework/test-results/desktop-e2e/**/real-cloud-credentials-result.json
          if-no-files-found: error
          retention-days: 14

      - name: Prune formal release verification diagnostics
        if: failure() && matrix.platform == 'macos' && matrix.arch == 'arm64'
        run: .github/scripts/prune-wework-desktop-e2e-diagnostics.sh

      - name: Upload formal release verification diagnostics
        if: failure() && matrix.platform == 'macos' && matrix.arch == 'arm64'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: wework-formal-release-e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            wework/test-results/desktop-e2e/
            !wework/test-results/desktop-e2e/**/executor-home/**
            !wework/test-results/desktop-e2e/**/managed-components/**
            !wework/test-results/desktop-e2e/**/managed-runtimes/**
            !wework/test-results/desktop-e2e/**/dsh-core/profiles/**
            !wework/test-results/desktop-e2e/**/harness-apps/instances/**/profiles/**
            !wework/test-results/desktop-e2e/**/*.zip
            !wework/test-results/desktop-e2e/**/harness-runtime/**
            !wework/test-results/desktop-e2e/**/node-runtime/**
            !wework/test-results/desktop-e2e/**/WeWork-Electron-E2E-*.app/**
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6

      - name: Prepare desktop release assets
        shell: bash
        env:
          WEWORK_USE_COMPONENTIZED_HOST_UPDATE: ${{ needs.prepare-release.outputs.componentized_host_update }}
        run: |
          node wework/scripts/prepare-desktop-release-assets.mjs \
            "${{ matrix.platform }}" \
            "${{ matrix.arch }}" \
            "${{ needs.prepare-release.outputs.version }}" \
            "$RUNNER_TEMP/wework-release-assets"

      - name: Upload candidate release build
        uses: actions/upload-artifact@v4
        with:
          name: wework-${{ needs.prepare-release.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/wework-release-assets/*
          if-no-files-found: error
          compression-level: 0

      - name: Share exact macOS x64 package identity
        if: matrix.platform == 'macos' && matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: wework-upgrade-metadata-${{ needs.prepare-release.outputs.version }}-macos-x64
          path: ${{ runner.temp }}/wework-release-assets/release-macos-x64.json
          if-no-files-found: error

      - name: Prepare standalone upgrade test driver
        if: (matrix.platform == 'macos' && matrix.arch == 'arm64') || matrix.platform == 'windows'
        shell: bash
        run: node wework/scripts/build-desktop-e2e-client.mjs "$RUNNER_TEMP/wework-upgrade-client"

      - name: Share immutable release inputs with upgrade verification
        if: (matrix.platform == 'macos' && matrix.arch == 'arm64') || matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: wework-upgrade-input-${{ needs.prepare-release.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/wework-release-assets/WeWorkRelease_*.tar.gz
            ${{ runner.temp }}/wework-release-assets/release-*.json
            ${{ runner.temp }}/wework-upgrade-client/*.cjs
          if-no-files-found: error
          compression-level: 0

      - name: Verify componentized macOS update package
        if: matrix.platform == 'macos' && needs.prepare-release.outputs.componentized_host_update == 'true'
        run: |
          set -euo pipefail
          zip="$(find "$RUNNER_TEMP/wework-release-assets" -maxdepth 1 -name 'WeWorkHostUpdate_*_macos_*.zip' -print -quit)"
          test -n "$zip"
          if unzip -Z1 "$zip" | grep -E '/Resources/(bin|codex|harness-runtime|wework-core-plugins|wework-app-static|bundled-plugins)(/|\.tar\.gz$)' >/dev/null; then
            echo "::error::The online Host update contains managed component resources."
            exit 1
          fi

  prepare-upgrade-inputs:
    name: Resolve immutable upgrade inputs
    needs: [prepare-release, build]
    if: ${{ !cancelled() && !inputs.build_only && inputs.verification_checkpoint != 'runtime-extraction' && !(inputs.verification_checkpoint == 'app-update-retry' && inputs.verification_source_run_id == '' && inputs.verification_run_id == '' && !inputs.publish_release) && (inputs.verification_run_id != '' || inputs.verification_checkpoint != 'all' || inputs.verification_release_tag != '' || needs.build.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.inputs.outputs.run_id }}
      version: ${{ steps.inputs.outputs.version }}
      channel: ${{ steps.inputs.outputs.channel }}
      release_tag: ${{ steps.inputs.outputs.release_tag }}
      verification_sha: ${{ steps.inputs.outputs.verification_sha }}
      diagnostic_checkpoint: ${{ steps.inputs.outputs.diagnostic_checkpoint }}
      published_release_tag: ${{ steps.inputs.outputs.published_release_tag }}
      verification_matrix: ${{ steps.plan.outputs.matrix || steps.inputs.outputs.verification_matrix }}
      source_run_id: ${{ steps.inputs.outputs.source_run_id }}
      source_version: ${{ steps.inputs.outputs.source_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.verification_run_id != '' && github.sha || needs.prepare-release.outputs.release_sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/
            /wework/scripts/lib/
            /wework/e2e/desktop/upgrade-suite.mjs
            /wework/electron/src/runtime/upgrade-policy.mjs
            /wework/electron/src/runtime/release-preparation-progress.mjs
            /wework/upgrade-policy.json
      - name: Resolve completed release build artifacts
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.verification_run_id || github.run_id }}
          EXPECTED_VERSION: ${{ needs.prepare-release.outputs.version }}
          VERIFICATION_SHA: ${{ inputs.verification_run_id != '' && github.sha || needs.prepare-release.outputs.release_sha }}
          REPLAY: ${{ inputs.verification_run_id != '' }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          VERIFICATION_CHECKPOINT: ${{ inputs.verification_checkpoint }}
          PUBLISHED_RELEASE_TAG: ${{ inputs.verification_release_tag }}
          VERIFICATION_SOURCE_RUN_ID: ${{ inputs.verification_source_run_id }}
        run: node .github/scripts/resolve-wework-upgrade-inputs.mjs

      - name: Freeze complete source upgrade matrix
        if: steps.inputs.outputs.diagnostic_checkpoint == ''
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          UPGRADE_VERSION: ${{ steps.inputs.outputs.version }}
          UPGRADE_CHANNEL: ${{ steps.inputs.outputs.channel }}
          UPGRADE_PLAN_DIRECTORY: ${{ runner.temp }}/upgrade-plan
        run: node .github/scripts/plan-wework-upgrade-shards.mjs

      - name: Retain frozen source upgrade plans
        if: steps.inputs.outputs.diagnostic_checkpoint == ''
        uses: actions/upload-artifact@v4
        with:
          name: wework-upgrade-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/upgrade-plan/*.json
          if-no-files-found: error

  verify-upgrades:
    name: Verify release upgrades (${{ matrix.platform }}/${{ matrix.arch }}/${{ matrix.channel }}${{ matrix.source_version && format('/{0}', matrix.source_version) || '' }})
    permissions:
      contents: read
      actions: read
    needs: prepare-upgrade-inputs
    if: ${{ !cancelled() && needs.prepare-upgrade-inputs.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare-upgrade-inputs.outputs.verification_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-upgrade-inputs.outputs.verification_sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts
            packages/chat-core
            wework/package.json
            wework/upgrade-policy.json
            wework/electron/package.json
            wework/electron/src
            wework/e2e
            wework/scripts
            wework/dsh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Report upgrade verification execution time
        if: needs.prepare-upgrade-inputs.outputs.diagnostic_checkpoint == ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFICATION_MATRIX: ${{ needs.prepare-upgrade-inputs.outputs.verification_matrix }}
          UPGRADE_PRODUCER_RUN_ID: ${{ needs.prepare-upgrade-inputs.outputs.run_id }}
        run: node .github/scripts/verify-wework-upgrade-duration.mjs --report-only
      - name: Download frozen source upgrade plans
        if: needs.prepare-upgrade-inputs.outputs.diagnostic_checkpoint == ''
        uses: actions/download-artifact@v4
        with:
          name: wework-upgrade-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/upgrade-plan

      - name: Prefetch historical inputs alongside the target artifact
        if: needs.prepare-upgrade-inputs.outputs.diagnostic_checkpoint == ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREFETCH_DIRECTORY: ${{ runner.temp }}/upgrade-prefetch
          PREFETCH_PLAN_DIRECTORY: ${{ runner.temp }}/upgrade-plan
          PREFETCH_OPTIONS: >-
            {"platform":"${{ matrix.platform }}","arch":"${{ matrix.arch }}","version":"${{ needs.prepare-upgrade-inputs.outputs.version }}","releaseChannel":"${{ needs.prepare-upgrade-inputs.outputs.channel }}","repository":"${{ github.repository }}","channel":"${{ matrix.channel }}","sourceVersion":"${{ matrix.source_version }}"}
        run: |
          node --input-type=module -e 'import { startUpgradeSourcePrefetch } from "./wework/scripts/lib/upgrade-source-prefetch.mjs"; await startUpgradeSourcePrefetch({ ...JSON.parse(process.env.PREFETCH_OPTIONS), directory: process.env.PREFETCH_DIRECTORY, planDirectory: process.env.PREFETCH_PLAN_DIRECTORY })'

      - name: Download prebuilt signed release inputs
        uses: actions/download-artifact@v6
        with:
          name: wework-upgrade-input-${{ needs.prepare-upgrade-inputs.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/upgrade-input
          run-id: ${{ needs.prepare-upgrade-inputs.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download immutable diagnostic source
        if: needs.prepare-upgrade-inputs.outputs.source_run_id != ''
        uses: actions/download-artifact@v6
        with:
          name: wework-upgrade-input-${{ needs.prepare-upgrade-inputs.outputs.source_version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/upgrade-source
          run-id: ${{ needs.prepare-upgrade-inputs.outputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Verify declared upgrade and rollback edges on real release packages
        if: (matrix.platform == 'macos' && matrix.arch == 'arm64') || matrix.platform == 'windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WEWORK_UPGRADE_DIAGNOSTICS_DIR: ${{ runner.temp }}/wework-upgrade-diagnostics
          WEWORK_E2E_SOCKET_IO_CLIENT: ${{ runner.temp }}/upgrade-input/wework-upgrade-client/socket.io-client.cjs
          WEWORK_E2E_YAML_PARSER: ${{ runner.temp }}/upgrade-input/wework-upgrade-client/yaml.cjs
          WEWORK_UPGRADE_DIAGNOSTIC_CHECKPOINT: ${{ needs.prepare-upgrade-inputs.outputs.diagnostic_checkpoint }}
          WEWORK_UPGRADE_PUBLISHED_TARGET_TAG: ${{ needs.prepare-upgrade-inputs.outputs.published_release_tag }}
          WEWORK_UPGRADE_VERIFY_CHANNEL: ${{ matrix.channel }}
          WEWORK_E2E_UPGRADE_WRITER_WAIT_SECONDS: ${{ inputs.verification_writer_wait_seconds || 0 }}
          WEWORK_UPGRADE_SOURCE_ASSETS: ${{ needs.prepare-upgrade-inputs.outputs.source_run_id != '' && format('{0}/upgrade-source/wework-release-assets', runner.temp) || '' }}
          WEWORK_UPGRADE_SOURCE_VERSION: ${{ needs.prepare-upgrade-inputs.outputs.source_version }}
          WEWORK_UPGRADE_PLAN_DIRECTORY: ${{ needs.prepare-upgrade-inputs.outputs.diagnostic_checkpoint == '' && format('{0}/upgrade-plan', runner.temp) || '' }}
          WEWORK_UPGRADE_VERIFY_SOURCE: ${{ matrix.source_version }}
          WEWORK_UPGRADE_PREFETCH_DIRECTORY: ${{ needs.prepare-upgrade-inputs.outputs.diagnostic_checkpoint == '' && format('{0}/upgrade-prefetch', runner.temp) || '' }}
        run: |
          node wework/scripts/verify-release-upgrades.mjs \
            "$RUNNER_TEMP/upgrade-input/wework-release-assets" \
            "${{ matrix.platform }}" "${{ matrix.arch }}" \
            "${{ needs.prepare-upgrade-inputs.outputs.channel }}" \
            "$GITHUB_REPOSITORY" "${{ needs.prepare-upgrade-inputs.outputs.release_tag }}"

      - name: Retain release upgrade decisions and failure diagnostics
        if: always() && ((matrix.platform == 'macos' && matrix.arch == 'arm64') || matrix.platform == 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: wework-release-upgrades-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.channel }}-${{ matrix.source_version || 'diagnostic' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/wework-upgrade-diagnostics/**/summary.json
            ${{ runner.temp }}/wework-upgrade-diagnostics/**/*.log
            ${{ runner.temp }}/wework-upgrade-diagnostics/**/*result.json
            ${{ runner.temp }}/wework-upgrade-diagnostics/**/failure-summary.json
            ${{ runner.temp }}/wework-upgrade-diagnostics/**/ui-snapshot.json
            ${{ runner.temp }}/wework-upgrade-diagnostics/**/failure.txt
            !${{ runner.temp }}/wework-upgrade-diagnostics/**/executor-home/**
            !${{ runner.temp }}/wework-upgrade-diagnostics/**/Local Storage/**
            !${{ runner.temp }}/wework-upgrade-diagnostics/**/Session Storage/**
            !${{ runner.temp }}/wework-upgrade-diagnostics/**/Partitions/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload verified release upgrade evidence
        if: needs.prepare-upgrade-inputs.outputs.diagnostic_checkpoint == '' && ((matrix.platform == 'macos' && matrix.arch == 'arm64') || matrix.platform == 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: wework-${{ needs.prepare-upgrade-inputs.outputs.version }}-upgrade-evidence-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.channel }}-${{ matrix.source_version }}
          path: ${{ runner.temp }}/upgrade-input/wework-release-assets/**/upgrade-*.json
          if-no-files-found: error
          compression-level: 0

      - name: Report complete upgrade verification execution time
        if: needs.prepare-upgrade-inputs.outputs.diagnostic_checkpoint == ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFICATION_MATRIX: ${{ needs.prepare-upgrade-inputs.outputs.verification_matrix }}
          UPGRADE_PRODUCER_RUN_ID: ${{ needs.prepare-upgrade-inputs.outputs.run_id }}
        run: node .github/scripts/verify-wework-upgrade-duration.mjs --report-only

  aggregate-upgrades:
    name: Aggregate complete upgrade verification
    needs: [prepare-upgrade-inputs, verify-upgrades]
    if: ${{ !cancelled() && needs.prepare-upgrade-inputs.result == 'success' && needs.prepare-upgrade-inputs.outputs.diagnostic_checkpoint == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-upgrade-inputs.outputs.verification_sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/
            /wework/scripts/aggregate-release-upgrades.mjs
            /wework/scripts/mirror-macos-upgrade-policy.mjs
            /wework/scripts/lib/
            /wework/upgrade-policy.json
            /wework/e2e/desktop/upgrade-suite.mjs
            /wework/electron/src/runtime/upgrade-policy.mjs
            /wework/electron/src/runtime/release-preparation-progress.mjs
      - name: Download frozen source upgrade plans
        uses: actions/download-artifact@v4
        with:
          name: wework-upgrade-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: upgrade-plan
      - name: Download every source verification result
        uses: actions/download-artifact@v4
        with:
          pattern: wework-${{ needs.prepare-upgrade-inputs.outputs.version }}-upgrade-evidence-*
          path: upgrade-shards
          merge-multiple: true
      - name: Aggregate exact package evidence and enforce all required sources
        env:
          WEWORK_UPGRADE_VERSION: ${{ needs.prepare-upgrade-inputs.outputs.version }}
          WEWORK_UPGRADE_CHANNEL: ${{ needs.prepare-upgrade-inputs.outputs.channel }}
          WEWORK_APPROVED_BASELINE_EXCLUSIONS: ${{ inputs.approved_baseline_exclusions }}
        run: node wework/scripts/aggregate-release-upgrades.mjs upgrade-plan upgrade-shards upgrade-policies
      - name: Download exact macOS x64 package identity
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare-upgrade-inputs.outputs.run_id }}
          name: wework-upgrade-metadata-${{ needs.prepare-upgrade-inputs.outputs.version }}-macos-x64
          path: upgrade-policies
      - name: Verify macOS architecture equivalence before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node wework/scripts/mirror-macos-upgrade-policy.mjs upgrade-policies "${{ needs.prepare-upgrade-inputs.outputs.channel }}" "$GITHUB_REPOSITORY"
          rm upgrade-policies/release-macos-x64.json
      - name: Upload complete verified upgrade policies
        uses: actions/upload-artifact@v4
        with:
          name: wework-${{ needs.prepare-upgrade-inputs.outputs.version }}-upgrade-policies
          path: upgrade-policies/*.json
          if-no-files-found: error
      - name: Report complete verification including aggregation
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFICATION_MATRIX: ${{ needs.prepare-upgrade-inputs.outputs.verification_matrix }}
          UPGRADE_PRODUCER_RUN_ID: ${{ needs.prepare-upgrade-inputs.outputs.run_id }}
        run: node .github/scripts/verify-wework-upgrade-duration.mjs --report-only

  publish:
    name: Publish release and update channels
    needs:
      - prepare-release
      - build
      - prepare-upgrade-inputs
      - verify-upgrades
      - aggregate-upgrades
    runs-on: ubuntu-latest
    if: ${{ !inputs.build_only && needs.prepare-release.outputs.publish_release == 'true' && needs.prepare-release.outputs.release_kind != 'none' }}

    steps:
      - name: Create release app token
        id: release-app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID || secrets.RELEASE_APP_ID || vars.RELEASE_APP_CLIENT_ID || secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Report completed upgrade duration before publication
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFICATION_MATRIX: ${{ needs.prepare-upgrade-inputs.outputs.verification_matrix }}
          UPGRADE_PRODUCER_RUN_ID: ${{ needs.prepare-upgrade-inputs.outputs.run_id }}
        run: node .github/scripts/verify-wework-upgrade-duration.mjs --report-only --completed

      - name: Resolve previous Wework release
        id: previous-release
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          RELEASE_CHANNEL: ${{ needs.prepare-release.outputs.channel }}
        run: echo "tag=$(node wework/scripts/resolve-previous-release-tag.mjs)" >> "$GITHUB_OUTPUT"

      - name: Set up release script dependencies
        uses: ./.github/actions/setup-node-workspace

      - name: Download release builds
        uses: actions/download-artifact@v4
        with:
          pattern: wework-${{ needs.prepare-release.outputs.version }}-*
          path: release-assets
          merge-multiple: true

      - name: Generate desktop update manifests
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_CHANNEL: ${{ needs.prepare-release.outputs.channel }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          PREVIOUS_TAG: ${{ steps.previous-release.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
          WEWORK_USE_COMPONENTIZED_HOST_UPDATE: ${{ needs.prepare-release.outputs.componentized_host_update }}
          WEWORK_REQUIRE_UPGRADE_POLICY: "true"
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/wework-release-notes.md"
          node wework/scripts/generate-release-notes.mjs > "$notes"
          node wework/scripts/generate-desktop-update-manifests.mjs \
            release-assets \
            release-manifests \
            "$RELEASE_VERSION" \
            "$RELEASE_CHANNEL" \
            "$GITHUB_REPOSITORY" \
            "$RELEASE_TAG" \
            "$notes" \
            "${{ needs.prepare-release.outputs.release_sha }}"

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.prepare-release.outputs.channel }}
        run: |
          set -euo pipefail
          title="Wework $RELEASE_VERSION"
          [[ "$RELEASE_CHANNEL" == "beta" ]] && title="$title Beta"
          notes="$RUNNER_TEMP/wework-release-notes.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --target "$RELEASE_SHA" \
              --title "$title" \
              --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" \
              --target "$RELEASE_SHA" \
              --title "$title" \
              --notes-file "$notes" \
              --draft
          fi

      - name: Upload formal release assets
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f \
            ! -name 'components-*.json' \
            ! -name 'WeworkComponent_*.tar.gz' \
            -print0 |
            xargs -0 gh release upload "$RELEASE_TAG" --clobber
          node wework/scripts/upload-desktop-component-assets.mjs \
            release-assets version "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" release-manifests/* --clobber

      - name: Publish version release
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          PRERELEASE: ${{ needs.prepare-release.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          release_id="$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)"
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            --field draft=false \
            --field prerelease="$PRERELEASE" \
            --raw-field make_latest=false >/dev/null

      - name: Publish rolling update channels
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          RELEASE_CHANNEL: ${{ needs.prepare-release.outputs.channel }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view wework-updater >/dev/null 2>&1; then
            gh release create wework-updater \
              --target "$RELEASE_SHA" \
              --title "Wework shared dependencies and updater manifests" \
              --notes "Content-addressed shared dependencies plus rolling Electron and component update manifests." \
              --prerelease
          fi
          existing_component_assets="$RUNNER_TEMP/existing-component-assets.txt"
          gh release view wework-updater \
            --json assets \
            --jq '.assets[].name' > "$existing_component_assets"
          harness_runtime_assets="$RUNNER_TEMP/harness-runtime-assets"
          node wework/scripts/collect-harness-runtime-release-assets.mjs \
            release-assets \
            "$harness_runtime_assets"
          while IFS= read -r runtime_asset; do
            runtime_name="$(basename "$runtime_asset")"
            if grep -Fqx "$runtime_name" "$existing_component_assets"; then
              echo "Reusing immutable Harness Runtime asset $runtime_name."
              continue
            fi
            gh release upload wework-updater "$runtime_asset"
            echo "$runtime_name" >> "$existing_component_assets"
          done < <(find "$harness_runtime_assets" -maxdepth 1 -type f | sort)
          while IFS= read -r component_asset; do
            component_name="$(basename "$component_asset")"
            if grep -Fqx "$component_name" "$existing_component_assets"; then
              echo "Reusing immutable component asset $component_name."
              continue
            fi
            gh release upload wework-updater "$component_asset"
            echo "$component_name" >> "$existing_component_assets"
          done < <(
            node wework/scripts/desktop-component-release.mjs release-assets shared |
              while IFS= read -r component_name; do
                [[ -n "$component_name" ]] && printf '%s\n' "release-assets/$component_name"
              done
          )

          publish_channel() {
            local channel="$1"
            local electron_channel="$channel"
            local current_assets="$RUNNER_TEMP/current-${channel}-assets.json"
            local current_manifest="$RUNNER_TEMP/current-${channel}.yml"
            [[ "$channel" == "stable" ]] && electron_channel="latest"

            gh release view wework-updater --json assets > "$current_assets"
            if gh release download wework-updater \
              --pattern "${electron_channel}-mac.yml" \
              --output "$current_manifest" \
              --clobber >/dev/null 2>&1; then
              current_version="$(
                node wework/scripts/update-channel-manifests.mjs \
                  read-electron-version "$current_manifest"
              )"
              if ! node wework/scripts/update-channel-manifests.mjs \
                is-newer "$RELEASE_VERSION" "$current_version"; then
                if node wework/scripts/update-channel-manifests.mjs \
                  has-complete-channel-assets "$current_assets" "$channel"; then
                  echo "Keeping newer or equal ${channel} update manifests at ${current_version}."
                  return
                fi
                if node wework/scripts/update-channel-manifests.mjs \
                  is-newer "$current_version" "$RELEASE_VERSION"; then
                  echo "::error::The newer ${channel} channel at ${current_version} has incomplete updater assets."
                  return 1
                fi
                echo "Repairing incomplete ${channel} updater assets at ${current_version}."
              fi
            fi

            gh release upload wework-updater \
              "release-manifests/components-${channel}-macos-arm64.json" \
              "release-manifests/components-${channel}-macos-x64.json" \
              "release-manifests/components-${channel}-windows-x64.json" \
              "release-manifests/components-${channel}-linux-x64.json" \
              --clobber
            gh release upload wework-updater \
              "release-manifests/${electron_channel}.yml" \
              "release-manifests/${electron_channel}-mac.yml" \
              --clobber
          }

          publish_channel "$RELEASE_CHANNEL"
          if [[ "$RELEASE_CHANNEL" == "stable" ]]; then
            publish_channel beta
          fi

      - name: Promote stable release to latest
        if: needs.prepare-release.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          release_id="$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)"
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            --raw-field make_latest=true >/dev/null
