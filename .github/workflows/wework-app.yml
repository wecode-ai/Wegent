name: Wework App

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options:
          - stable
          - beta
        required: true
        default: stable
      version:
        description: "Optional stable version override, for example 1.2.3"
        type: string
        required: false
      publish_release:
        description: "Create the formal GitHub Release"
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare build
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.version-files.outputs.release_sha }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      version: ${{ steps.version.outputs.value }}
      channel: ${{ steps.version.outputs.channel }}
      publish_release: ${{ steps.version.outputs.publish_release }}

    steps:
      - name: Create release app token
        id: release-app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID || secrets.RELEASE_APP_ID || vars.RELEASE_APP_CLIENT_ID || secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.release-app-token.outputs.token }}

      - name: Resolve Wework release version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel || 'stable' }}
          PUBLISH_RELEASE: ${{ github.event.inputs.publish_release == 'true' }}
        run: node wework/scripts/resolve-release-version.mjs

      - name: Commit Wework version files
        id: version-files
        env:
          PUBLISH_RELEASE: ${{ steps.version.outputs.publish_release }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'

          const version = process.env.RELEASE_VERSION
          for (const path of ['wework/package.json', 'wework/electron/package.json']) {
            const manifest = JSON.parse(await readFile(path, 'utf8'))
            manifest.version = version
            await writeFile(path, `${JSON.stringify(manifest, null, 2)}\n`)
          }
          NODE

          if [[ "$PUBLISH_RELEASE" != "true" ]]; then
            git checkout -- wework/package.json wework/electron/package.json
            echo "release_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet -- wework/package.json wework/electron/package.json; then
            echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          app_user_id="$(gh api "/users/${{ steps.release-app-token.outputs.app-slug }}[bot]" --jq .id)"
          git config user.name "${{ steps.release-app-token.outputs.app-slug }}[bot]"
          git config user.email "${app_user_id}+${{ steps.release-app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add wework/package.json wework/electron/package.json
          git commit -m "chore(wework): bump app version to ${RELEASE_VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        if: steps.version.outputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          RELEASE_SHA: ${{ steps.version-files.outputs.release_sha }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          set -euo pipefail
          title="Wework $RELEASE_VERSION"
          [[ "$RELEASE_CHANNEL" == "beta" ]] && title="$title Beta"
          notes="$(mktemp)"
          node wework/scripts/generate-release-notes.mjs > "$notes"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$title" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" \
              --target "$RELEASE_SHA" \
              --title "$title" \
              --notes-file "$notes" \
              --draft
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-14
            artifact: macos
          - name: Windows
            runner: windows-latest
            artifact: windows
          - name: Linux
            runner: ubuntu-latest
            artifact: linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Set up Node workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Install Wework Electron dependencies
        run: pnpm --dir wework/electron install --frozen-lockfile

      - name: Prepare bundled sidecars
        working-directory: wework
        run: |
          pnpm run prepare:codex --materialize
          pnpm run prepare:dws

      - name: Build Electron application
        env:
          VITE_WEGENT_BACKEND_URL: https://api.wecode.ai
          VITE_WEWORK_RELEASE_CHANNEL: ${{ needs.prepare-release.outputs.channel }}
        run: pnpm --filter wework ai:verify:electron:build

      - name: Resolve packaged application
        id: package
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          ARTIFACT_PLATFORM: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          package_dir="$(find wework/electron/release -mindepth 1 -maxdepth 1 -type d -name 'WeWork-*' -print -quit)"
          if [[ -z "$package_dir" ]]; then
            echo "Electron package directory was not produced" >&2
            exit 1
          fi
          archive="$RUNNER_TEMP/WeWork_${RELEASE_VERSION}_${ARTIFACT_PLATFORM}.tar.gz"
          tar -C "$(dirname "$package_dir")" -czf "$archive" "$(basename "$package_dir")"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Create release app token
        if: needs.prepare-release.outputs.publish_release == 'true'
        id: release-app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID || secrets.RELEASE_APP_ID || vars.RELEASE_APP_CLIENT_ID || secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Upload release asset
        if: needs.prepare-release.outputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" "${{ steps.package.outputs.archive }}" --clobber

      - name: Upload test artifact
        if: needs.prepare-release.outputs.publish_release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wework-${{ needs.prepare-release.outputs.version }}-${{ matrix.artifact }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
