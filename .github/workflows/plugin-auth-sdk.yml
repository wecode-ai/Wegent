name: Plugin Auth SDK

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled

permissions:
  contents: read

jobs:
  changes:
    name: Detect Plugin Auth SDK Changes
    runs-on: ubuntu-latest
    outputs:
      plugin_auth_sdk: ${{ steps.classify.outputs.plugin_auth_sdk }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORCE_ALL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:all') }}
        run: |
          if [[ "$FORCE_ALL" == "true" ]]; then
            .github/scripts/classify-plugin-auth-sdk.sh --all
          else
            git diff --name-only "$BASE_SHA...$HEAD_SHA" |
              .github/scripts/classify-plugin-auth-sdk.sh
          fi

  dws-native:
    needs: changes
    if: needs.changes.outputs.plugin_auth_sdk == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.9"
          cache: false
      - name: Test shared Go credential transport
        working-directory: sdk/plugin-auth-go
        run: go test -race ./...
      - name: Build and test the pinned DWS native companion
        run: uv run --no-project python sdk/dws-auth/build.py --output executor/target/dws-auth/dws-account-auth --test
      - name: Test declared plugin builds
        run: uv run --no-project python -m unittest discover -s shared/tests -p test_plugin_build.py -v
      - name: Test DWS package assembly and artifact checks
        run: uv run --no-project python -m unittest discover -s sdk/dws-auth/tests -v

  test:
    needs: changes
    if: needs.changes.outputs.plugin_auth_sdk == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test SDK, scaffolds, and isolated plugin processes
        run: uv run --no-project python -m unittest discover -s sdk/plugin-auth/tests -v
      - name: Test Wework Creator Connector validation
        run: uv run --no-project python -m unittest discover -s sdk/plugin-creator/tests -v

  native:
    needs: changes
    if: needs.changes.outputs.plugin_auth_sdk == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: executor
      - name: Test native transport, OAuth lifecycle, and process cleanup
        run: uv run --no-project cargo test --manifest-path executor/Cargo.toml --test plugin_account_auth_contract -- --test-threads=1
