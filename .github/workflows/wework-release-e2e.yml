name: Wework Release E2E

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/wework-app.yml
      - .github/workflows/wework-release-e2e.yml
      - .github/scripts/test-wework-shared-release.sh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shared-release:
    name: Preserve existing shared release
    # Fork workflows cannot create the isolated draft fixture with a read-only token.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared release provisioning against GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/test-wework-shared-release.sh
