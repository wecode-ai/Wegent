      - name: Start Chat Shell server
        working-directory: ./backend
        env:
          CHAT_SHELL_MODE: http
          CHAT_SHELL_STORAGE_TYPE: remote
          CHAT_SHELL_REMOTE_STORAGE_URL: http://localhost:8000/api/internal
          EXECUTOR_MANAGER_URL: http://localhost:8001
        run: |
          source .venv/bin/activate
          nohup python -m uvicorn chat_shell.main:app --host 0.0.0.0 --port 8100 > chat_shell.log 2>&1 &
          echo $! > chat_shell.pid

      - name: Start frontend server
        working-directory: ./frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
          RUNTIME_INTERNAL_API_URL: http://localhost:8000
          RUNTIME_SOCKET_DIRECT_URL: http://localhost:8000
        run: ../.github/scripts/start-frontend-e2e-server.sh

      - name: Start Mock Model Server
        working-directory: ./frontend
        run: |
          pnpm exec tsx e2e/utils/mock-model-server.ts > mock-model-server.log 2>&1 &
          echo $! > mock-server.pid

      - name: Start Knowledge Doc Converter
        env:
          BACKEND_BASE_URL: http://localhost:8000
          BACKEND_INTERNAL_TOKEN: ${{ env.INTERNAL_SERVICE_TOKEN }}
          CELERY_BROKER_URL: redis://redis:6379/0
          CELERY_RESULT_BACKEND: redis://redis:6379/1
          REDIS_URL: redis://redis:6379/0
          MINERU_API_BASE_URL: http://localhost:9999/mineru
          MINERU_POLL_INTERVAL_SECONDS: "1"
          KNOWLEDGE_CONVERSION_QUEUE: knowledge_conversion
          LOG_FILE_ENABLED: "false"
        run: |
          nohup uv run --project knowledge_doc_converter --no-sync celery \
            -A knowledge_doc_converter.celery_app worker \
            --queues=knowledge_conversion \
            --concurrency=1 \
            --loglevel=INFO > knowledge_doc_converter/ci.log 2>&1 &
          echo $! > knowledge_doc_converter/ci.pid

      - name: Wait for services
        run: |
          wait_for_url() {
            local url="$1"
            for i in {1..120}; do
              if curl -sf "$url" >/dev/null; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          wait_for_url http://localhost:8000/api/docs \
            && wait_for_url http://localhost:8200/internal/rag/health \
            && wait_for_url http://qdrant:6333/readyz \
            && wait_for_url http://minio:9000/minio/health/live \
            && wait_for_url http://localhost:8100/health \
            && wait_for_url http://localhost:3000 \
            && wait_for_url http://localhost:9999/health \
            || (cat backend/backend.log knowledge_runtime/ci.log backend/chat_shell.log frontend/next-dev.log frontend/mock-model-server.log; exit 1)

      - name: Start local Executor device
        env:
          EXECUTOR_MODE: local
          WEGENT_BACKEND_URL: http://localhost:8000
          DEVICE_ID: e2e-platform-device-${{ matrix.shardIndex }}
          DEVICE_NAME: E2E Platform Device ${{ matrix.shardIndex }}
          DEVICE_TYPE: app
          BIND_SHELL: claudecode
          WEGENT_EXECUTOR_HOME: /tmp/wegent-platform-executor-${{ matrix.shardIndex }}
          LOCAL_WORKSPACE_ROOT: /tmp/wegent-platform-workspace-${{ matrix.shardIndex }}
          WORKSPACE_ROOT: /tmp/wegent-platform-workspace-${{ matrix.shardIndex }}
          LOCAL_HEARTBEAT_INTERVAL: "5"
          LOG_LEVEL: info
        run: |
          .github/scripts/start-local-e2e-executor.sh \
            .ci-artifacts/wegent-executor \
            executor/platform-executor.log \
            executor/platform-executor.pid

      - name: Start remote workspace Executor Manager
        working-directory: ./executor_manager
