name: E2E Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  merge_group:
    types: [checks_requested]
  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  changes:
    name: Detect Platform E2E Changes
    runs-on: ubuntu-latest
    outputs:
      platform_e2e: ${{ steps.classify.outputs.platform_e2e }}
      wework_desktop_e2e: ${{ steps.classify.outputs.wework_desktop_e2e }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Classify changed paths
        if: github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'ci:all'
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.sha }}
          FORCE_ALL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:all')) }}
        run: |
          if [[ "$FORCE_ALL" == "true" ]]; then
            .github/scripts/classify-ci-changes.sh --all
            .github/scripts/classify-wework-desktop-e2e.sh --all
          else
            changed_files="$(mktemp)"
            git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$changed_files"
            .github/scripts/classify-ci-changes.sh < "$changed_files"
            .github/scripts/classify-wework-desktop-e2e.sh < "$changed_files"
          fi

  build-frontend-e2e:
    name: Build Frontend E2E Artifact
    needs: changes
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.changes.outputs.platform_e2e == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node workspace
        uses: ./.github/actions/setup-node-workspace
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Restore shared Next.js build cache
        id: nextjs-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ./frontend/.next/cache
          key: ${{ runner.os }}-nextjs-e2e-v2-${{ hashFiles('./pnpm-lock.yaml') }}-${{ hashFiles('./frontend/src/**/*.[jt]s', './frontend/src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-e2e-v2-${{ hashFiles('./pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-e2e-v2-

      - name: Build frontend for E2E
        working-directory: ./frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
          RUNTIME_INTERNAL_API_URL: http://localhost:8000
          RUNTIME_SOCKET_DIRECT_URL: http://localhost:8000
        run: pnpm run build

      - name: Save shared Next.js build cache
        if: github.ref == 'refs/heads/main' && steps.nextjs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ./frontend/.next/cache
          key: ${{ steps.nextjs-cache.outputs.cache-primary-key }}

      - name: Archive frontend E2E build
        run: .github/scripts/archive-frontend-e2e-build.sh

      - name: Upload frontend E2E build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-next-build
          path: .ci-artifacts/frontend-next-build.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  prepare-platform-e2e-image:
    name: Prepare Platform E2E Image
    needs: changes
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.changes.outputs.platform_e2e == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve Platform E2E image
        id: image
        run: |
          dockerfile=docker/wework-e2e/browser.Dockerfile
          image_ref="$(awk '$1 == "FROM" { print $2 }' "$dockerfile")"
          image_version="${image_ref#mcr.microsoft.com/playwright:v}"
          image_version="${image_version%-noble}"
          playwright_version="$(
            sed -n 's/^  playwright@\([^:]*\):$/\1/p' pnpm-lock.yaml |
              head -n 1
          )"
          test -n "$playwright_version"
          if [[ "$image_version" != "$playwright_version" ]]; then
            echo "Playwright image version $image_version does not match workspace version $playwright_version" >&2
            exit 1
          fi
          digest="$(sha256sum "$dockerfile" | cut -d ' ' -f 1)"
          echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wegent-wework-e2e:browser-$digest" \
            >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Check Platform E2E image
        id: image-check
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish Platform E2E image
        if: steps.image-check.outputs.exists != 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          file: docker/wework-e2e/browser.Dockerfile
          push: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/wegent-wework-e2e:buildcache-browser
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/wegent-wework-e2e:buildcache-browser,mode=max

  build-backend-rs-e2e-runtime:
    name: Build Backend Rust E2E Runtime
    needs: changes
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.changes.outputs.platform_e2e == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.runtime.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve Backend Rust E2E runtime
        id: runtime
        env:
          SOURCE_DIGEST: ${{ hashFiles('backend-rs/Cargo.toml', 'backend-rs/Cargo.lock', 'backend-rs/src/**', 'backend-rs/examples/**', '.github/runtime-images/backend-rs-e2e.Dockerfile') }}
        run: |
          echo "image=$(.github/scripts/resolve-backend-rs-e2e-runtime.sh)" \
            >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check content-addressed Backend Rust E2E image
        id: image-check
        env:
          IMAGE: ${{ steps.runtime.outputs.image }}
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Rust
        if: steps.image-check.outputs.exists != 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Set up sccache
        if: steps.image-check.outputs.exists != 'true'
        uses: ./.github/actions/setup-sccache

      - name: Restore Backend Rust Cargo sources
        if: steps.image-check.outputs.exists != 'true'
        id: backend-rs-cargo-sources-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-backend-rs-cargo-sources-v1-${{ hashFiles('backend-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-backend-rs-cargo-sources-v1-

      - name: Build Backend Rust E2E runtime
        if: steps.image-check.outputs.exists != 'true'
        env:
          CARGO_PROFILE_RELEASE_STRIP: "false"
          CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_STRIP: "false"
          CARGO_TARGET_DIR: ${{ runner.temp }}/backend-rs-target
        run: |
          cargo build \
            --release \
            --manifest-path backend-rs/Cargo.toml \
            --bin wegent-backend-rs \
            --example attachment_s3_e2e \
            --example attachment_hosting_e2e
          mkdir -p .ci-artifacts
          cp "$CARGO_TARGET_DIR/release/wegent-backend-rs" \
            .ci-artifacts/wegent-backend-rs
          cp "$CARGO_TARGET_DIR/release/examples/attachment_s3_e2e" \
            .ci-artifacts/attachment-s3-e2e
          cp "$CARGO_TARGET_DIR/release/examples/attachment_hosting_e2e" \
            .ci-artifacts/attachment-hosting-e2e
          chmod 0755 .ci-artifacts/wegent-backend-rs

      - name: Publish content-addressed Backend Rust E2E image
        if: steps.image-check.outputs.exists != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          IMAGE: ${{ steps.runtime.outputs.image }}
        run: |
          mkdir -p .ci-artifacts/backend-rs-image
          cp .ci-artifacts/wegent-backend-rs \
            .ci-artifacts/backend-rs-image/wegent-backend-rs
          cp .ci-artifacts/attachment-s3-e2e \
            .ci-artifacts/backend-rs-image/attachment-s3-e2e
          cp .ci-artifacts/attachment-hosting-e2e \
            .ci-artifacts/backend-rs-image/attachment-hosting-e2e
          docker build \
            --file .github/runtime-images/backend-rs-e2e.Dockerfile \
            --tag "$IMAGE" \
            .ci-artifacts/backend-rs-image
          docker push "$IMAGE"

      - name: Restore content-addressed Backend Rust E2E binary
        if: steps.image-check.outputs.exists == 'true'
        env:
          IMAGE: ${{ steps.runtime.outputs.image }}
        run: |
          docker pull "$IMAGE"
          container_id="$(docker create "$IMAGE")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          mkdir -p .ci-artifacts
          docker cp \
            "$container_id:/app/wegent-backend-rs" \
            .ci-artifacts/wegent-backend-rs
          docker cp \
            "$container_id:/app/attachment-s3-e2e" \
            .ci-artifacts/attachment-s3-e2e
          docker cp \
            "$container_id:/app/attachment-hosting-e2e" \
            .ci-artifacts/attachment-hosting-e2e
          chmod 0755 .ci-artifacts/wegent-backend-rs

      - name: Save Backend Rust Cargo sources
        if: steps.image-check.outputs.exists != 'true' && github.ref == 'refs/heads/main' && steps.backend-rs-cargo-sources-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.backend-rs-cargo-sources-cache.outputs.cache-primary-key }}

      - name: Upload Backend Rust E2E runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-rs-e2e-runtime
          path: |
            .ci-artifacts/wegent-backend-rs
            .ci-artifacts/attachment-s3-e2e
            .ci-artifacts/attachment-hosting-e2e
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build-executor-e2e-runtime:
    name: Prepare Executor E2E Runtime
    needs: changes
    # Fork pull requests cannot pull the executor E2E image from GHCR, so the
    # Wework desktop E2E build downloads the executor-e2e-binary artifact from
    # this job instead. That artifact must exist whenever a fork PR selects
    # desktop E2E, even when platform_e2e itself is not selected.
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (needs.changes.outputs.platform_e2e == 'true' || (needs.changes.outputs.wework_desktop_e2e == 'true' && github.event.pull_request.head.repo.full_name != github.repository)))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.runtime.outputs.image }}
      artifact: ${{ steps.access.outputs.artifact }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve Executor E2E registry access
        id: access
        env:
          REGISTRY_ENABLED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [[ "$REGISTRY_ENABLED" == "true" ]]; then
            echo "artifact=false" >> "$GITHUB_OUTPUT"
          else
            echo "artifact=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Resolve Executor E2E runtime
        id: runtime
        env:
          SOURCE_DIGEST: ${{ hashFiles('frontend/e2e/fixtures/claudecode-executor/Dockerfile', 'executor/Cargo.toml', 'executor/Cargo.lock', 'executor/src/**', 'executor/vendor/**', 'shared/assets/**') }}
        run: .github/scripts/resolve-executor-e2e-runtime.sh

      - name: Check content-addressed Executor E2E image
        if: steps.access.outputs.artifact != 'true'
        id: image-check
        env:
          IMAGE: ${{ steps.runtime.outputs.image }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish Executor E2E image
        if: steps.access.outputs.artifact != 'true' && steps.image-check.outputs.exists != 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          file: frontend/e2e/fixtures/claudecode-executor/Dockerfile
          build-args: BASE_IMAGE=${{ steps.runtime.outputs.base-image }}
          push: true
          tags: ${{ steps.runtime.outputs.image }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/wegent-executor:buildcache-e2e

      - name: Build fork Executor E2E image
        if: steps.access.outputs.artifact == 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          file: frontend/e2e/fixtures/claudecode-executor/Dockerfile
          build-args: BASE_IMAGE=${{ steps.runtime.outputs.base-image }}
          load: true
          tags: wegent/e2e-claudecode-executor:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/wegent-executor:buildcache-e2e

      - name: Extract fork Executor binary
        if: steps.access.outputs.artifact == 'true'
        run: |
          mkdir -p executor/target/release
          container_id="$(docker create wegent/e2e-claudecode-executor:latest)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/app/executor" executor/target/release/wegent-executor
          chmod 0755 executor/target/release/wegent-executor

      - name: Extract registry Executor binary
        if: steps.access.outputs.artifact != 'true'
        env:
          EXECUTOR_E2E_IMAGE: ${{ steps.runtime.outputs.image }}
        run: |
          docker pull "$EXECUTOR_E2E_IMAGE"
          mkdir -p executor/target/release
          container_id="$(docker create "$EXECUTOR_E2E_IMAGE")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/app/executor" executor/target/release/wegent-executor
          chmod 0755 executor/target/release/wegent-executor

      - name: Archive fork Executor E2E runtime
        if: steps.access.outputs.artifact == 'true'
        run: .github/scripts/archive-executor-e2e-runtime.sh

      - name: Upload Executor E2E binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: executor-e2e-binary
          path: executor/target/release/wegent-executor
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload fork Executor E2E runtime
        if: steps.access.outputs.artifact == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: executor-e2e-runtime
          path: |
            .ci-artifacts/e2e-claudecode-executor-image.tar.zst
            .ci-artifacts/wegent-executor
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Runs browser and API tests with sharding. Executor-heavy coverage runs separately.
  e2e-tests:
    name: E2E Tests (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    needs:
      [
        build-frontend-e2e,
        build-backend-rs-e2e-runtime,
        build-executor-e2e-runtime,
        prepare-platform-e2e-image,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HOME: /root
      UV_PYTHON: "3.11"
      UV_MANAGED_PYTHON: "true"
    container:
      image: ${{ needs.prepare-platform-e2e-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --add-host=host.docker.internal:host-gateway
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Run 40558717377: provider shard 1 took 120s while shard 3 was empty.
        # Exchange those logical shards without changing users or runner count.
        include:
          - shardIndex: 1
            shardTotal: 4
            providerShardIndex: 3
          - shardIndex: 2
            shardTotal: 4
            providerShardIndex: 2
          - shardIndex: 3
            shardTotal: 4
            providerShardIndex: 1
          - shardIndex: 4
            shardTotal: 4
            providerShardIndex: 4

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test123
          MYSQL_DATABASE: wegent_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=2s
          --health-timeout=5s
          --health-start-period=5s
          --health-retries=30

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=15

      etcd:
        image: quay.io/coreos/etcd:v3.5.16
        env:
          ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_DATA_DIR: /etcd

      # Start storage before Milvus: the runner pulls and starts services sequentially.
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r0
        env:
          MINIO_ROOT_USER: wegent-e2e
          MINIO_ROOT_PASSWORD: wegent-e2e-secret
        options: >-
          --health-cmd="curl -f http://localhost:9000/minio/health/live"
          --health-interval=2s
          --health-timeout=5s
          --health-start-period=5s
          --health-retries=30

      milvus:
        image: milvusdb/milvus:v2.5.4
        command: milvus run standalone
        env:
          ETCD_ENDPOINTS: etcd:2379
          MINIO_ADDRESS: minio:9000
          MINIO_ACCESS_KEY_ID: wegent-e2e
          MINIO_SECRET_ACCESS_KEY: wegent-e2e-secret
        options: >-
          --health-cmd="curl -f http://localhost:9091/healthz"
          --health-interval=5s
          --health-timeout=5s
          --health-start-period=30s
          --health-retries=30

      qdrant:
        image: qdrant/qdrant:v1.15.4

    steps:
      - name: Generate internal service token
        run: |
          token=$(openssl rand -hex 32)
          bootstrap_admin_password=$(openssl rand -hex 32)
          e2e_admin_password=$(openssl rand -hex 32)
          git_token_aes_key=$(openssl rand -hex 16)
          git_token_aes_iv=$(openssl rand -hex 8)
          echo "::add-mask::$token"
          echo "::add-mask::$bootstrap_admin_password"
          echo "::add-mask::$e2e_admin_password"
          echo "::add-mask::$git_token_aes_key"
          echo "::add-mask::$git_token_aes_iv"
          {
            echo "E2E_INTERNAL_SERVICE_TOKEN=$token"
            echo "INTERNAL_SERVICE_TOKEN=$token"
            echo "CHAT_SHELL_REMOTE_STORAGE_TOKEN=$token"
            echo "CHAT_SHELL_INTERNAL_SERVICE_TOKEN=$token"
            echo "E2E_BOOTSTRAP_ADMIN_PASSWORD=$bootstrap_admin_password"
            echo "E2E_ADMIN_PASSWORD=$e2e_admin_password"
            echo "GIT_TOKEN_AES_KEY=$git_token_aes_key"
            echo "GIT_TOKEN_AES_IV=$git_token_aes_iv"
          } >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node workspace
        uses: ./.github/actions/setup-node-workspace
        with:
          setup-toolchain: "false"

      - name: Restore Python dependency cache
        uses: ./.github/actions/setup-python-uv-cache
        with:
          python-version: "3.11"
          setup-python: "false"
          setup-uv: "false"

      - name: Prepare container Python
        run: |
          uv python install --default "$UV_PYTHON"
          python_bin_dir="$(uv python dir --bin)"
          export PATH="$python_bin_dir:$PATH"
          test "$(command -v python)" = "$python_bin_dir/python"
          printf '%s\n' "$python_bin_dir" >> "$GITHUB_PATH"
          uv run --no-project python -c 'import ssl; print(ssl.OPENSSL_VERSION)'

      - name: Install shared module
        working-directory: ./shared
        run: |
          uv venv --allow-existing
          source .venv/bin/activate
          uv pip install -e .

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          uv sync
          source .venv/bin/activate
          uv pip install -e ../shared

      - name: Prepare Chat Shell tokenizers
        working-directory: ./backend
        run: |
          source .venv/bin/activate
          ../.github/scripts/prepare-chat-shell-tokenizers.sh

      - name: Download frontend E2E build
        env:
          ACTIONS_ARTIFACT_WAIT_SECONDS: "300"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/download-actions-artifact.sh \
            frontend-next-build \
            .ci-artifacts

      - name: Download Backend Rust E2E runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/download-actions-artifact.sh \
            backend-rs-e2e-runtime \
            .ci-artifacts
          chmod 0755 .ci-artifacts/wegent-backend-rs

      - name: Download Executor E2E binary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/download-actions-artifact.sh \
            executor-e2e-binary \
            .ci-artifacts
          chmod 0755 .ci-artifacts/wegent-executor

      - name: Prepare remote workspace Executor runtime
        env:
          PLATFORM_E2E_IMAGE: ${{ needs.prepare-platform-e2e-image.outputs.image }}
          DOCKER_BUILDKIT: "0"
        run: |
          uv sync --project executor_manager --frozen
          docker build --pull=false \
            --build-arg BASE_IMAGE="$PLATFORM_E2E_IMAGE" \
            --file frontend/e2e/fixtures/remote-workspace-executor/Dockerfile \
            --tag wegent/e2e-workspace-executor:latest .ci-artifacts

      - name: Install Knowledge Runtime dependencies
        run: uv sync --project knowledge_runtime --frozen

      - name: Install Knowledge Doc Converter dependencies
        run: uv sync --project knowledge_doc_converter --frozen

      - name: Restore frontend E2E build
        run: .github/scripts/restore-frontend-e2e-build.sh

      - name: Run database migrations
        working-directory: ./backend
        env:
          DATABASE_URL: mysql+pymysql://root:test123@mysql:3306/wegent_test
        run: |
          uv run --no-sync alembic upgrade head

      # Runs 40548056927 and 40547828678: shard 1 was slowest; shard 3
      # had the shortest browser phase and shard 4 had room for remote indexing.
      - name: Run attachment storage E2E on shared services
        if: matrix.shardIndex == 2 || matrix.shardIndex == 3
        working-directory: ./backend
        env:
          DATABASE_URL: mysql+pymysql://root:test123@mysql:3306/wegent_test
          REDIS_URL: redis://redis:6379/15
          SECRET_KEY: attachment-s3-e2e-secret-key
          ENVIRONMENT: development
          DB_AUTO_MIGRATE: "false"
          INIT_DATA_ENABLED: "false"
          E2E_MINIO_ROOT_USER: wegent-e2e
          E2E_MINIO_ROOT_PASSWORD: wegent-e2e-secret
          E2E_MINIO_URL: http://127.0.0.1:9000
          ATTACHMENT_PUBLIC_BASE_URL: ""
          INTERNAL_SERVICE_TOKEN: attachment-hosting-e2e-service-token
          PYTHONPATH: ..:.
          E2E_SHARD_INDEX: ${{ matrix.shardIndex }}
          E2E_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          suite=s3-upload
          script=attachment_s3_upload.py
          binary=attachment-s3-e2e
          if [[ "$E2E_SHARD_INDEX" == "3" ]]; then
            suite=media-hosting
            script=attachment_media_hosting.py
            binary=attachment-hosting-e2e
          fi
          export E2E_REPORT_DIR="$GITHUB_WORKSPACE/.ci-artifacts/attachment-$suite"
          export WEGENT_RS_BINARY_PATH="$GITHUB_WORKSPACE/.ci-artifacts/$binary"
          export WEGENT_HOSTING_BINARY_PATH="$WEGENT_RS_BINARY_PATH"
          E2E_TEST_SHA="$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)"
          export E2E_TEST_SHA
          test "$E2E_TEST_SHA" = "$E2E_EXPECTED_SHA"
          chmod 0755 "$WEGENT_RS_BINARY_PATH"
          mkdir -p "$E2E_REPORT_DIR"
          # Preserve the fixtures' loopback-only storage boundary while reusing MinIO.
          socat TCP-LISTEN:9000,bind=127.0.0.1,reuseaddr,fork TCP:minio:9000 &
          relay_pid=$!
          trap 'kill "$relay_pid"; wait "$relay_pid" || true' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 \
            "$E2E_MINIO_URL/minio/health/live"
          uv run --no-sync python "tests/e2e/$script" \
            2>&1 | tee "$E2E_REPORT_DIR/e2e.log"

      - name: Upload attachment storage E2E evidence
        if: always() && (matrix.shardIndex == 2 || matrix.shardIndex == 3)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: attachment-${{ matrix.shardIndex == 2 && 's3-upload' || 'media-hosting' }}-e2e
          path: .ci-artifacts/attachment-${{ matrix.shardIndex == 2 && 's3-upload' || 'media-hosting' }}/
          if-no-files-found: error
          retention-days: 14

      - name: Verify DingTalk sync MySQL transaction rollback
        if: matrix.shardIndex == 1
        working-directory: ./backend
        env:
          DINGTALK_SYNC_TEST_MYSQL_URL: mysql+pymysql://root:test123@mysql:3306/wegent_test
          PYTHONPATH: ..:.
        run: uv run --no-sync python tests/integration/dingtalk_sync_mysql.py

      - name: Verify device registration MySQL serialization
        if: matrix.shardIndex == 1
        working-directory: ./backend
        env:
          DEVICE_REGISTRATION_TEST_MYSQL_URL: mysql+pymysql://root:test123@mysql:3306/wegent_test
          PYTHONPATH: ..:.
        run: uv run --no-sync python tests/integration/device_registration_mysql.py

      - name: Verify MySQL Runtime activity concurrency
        if: matrix.shardIndex == 1
        working-directory: ./backend
        env:
          RUNTIME_ACTIVITY_TEST_MYSQL_URL: mysql+pymysql://root:test123@mysql:3306/wegent_test
          PYTHONPATH: ..:.
        run: uv run --no-sync python tests/integration/runtime_activity_mysql.py

      - name: Verify MySQL project detachment concurrency
        if: matrix.shardIndex == 1
        working-directory: ./backend
        env:
          PROJECT_TASK_TEST_MYSQL_URL: mysql+pymysql://root:test123@mysql:3306/wegent_test
          PYTHONPATH: ..:.
        run: uv run --no-sync python tests/integration/project_task_detachment_mysql.py

      - name: Start backend server
        env:
          EXTERNAL_KNOWLEDGE_MCP_ENABLED: "true"
          EMBEDDED_CELERY_ENABLED: "false"
          DATABASE_URL: mysql+pymysql://root:test123@mysql:3306/wegent_test
          RS_DATABASE_URL_COLLATION: utf8mb4_0900_ai_ci
          REDIS_URL: redis://redis:6379/0
          EXECUTOR_MANAGER_URL: http://localhost:8001
          SECRET_KEY: test-secret-key-for-ci-testing
          ALGORITHM: HS256
          ENVIRONMENT: development
          DB_AUTO_MIGRATE: "false"
          INIT_DATA_ENABLED: "true"
          PLUGIN_LEGACY_UPLOAD_ENABLED: "true"
          KNOWLEDGE_RUNTIME_URL: http://localhost:8200
          KNOWLEDGE_CONVERSION_ENABLED: "true"
          KNOWLEDGE_CONVERSION_FILE_TYPES: "pdf"
          CHUNK_STORAGE_ENABLED: "true"
          ATTACHMENT_S3_ENDPOINT: minio:9000
          ATTACHMENT_S3_ACCESS_KEY: wegent-e2e
          ATTACHMENT_S3_SECRET_KEY: wegent-e2e-secret
          ATTACHMENT_S3_USE_SSL: "false"
          DELIVERY_S3_BUCKET: wegent-deliveries
          WEGENT_RS_BINARY_PATH: ${{ github.workspace }}/.ci-artifacts/wegent-backend-rs
          WEGENT_HYBRID_STATE_FILE: ${{ github.workspace }}/backend/backend-hybrid.state
          RUST_LOG: info,brz_http_gateway::proxy=debug
        run: |
          nohup backend-rs/scripts/start-hybrid-backend.sh \
            > backend/backend.log 2>&1 &
          echo $! > backend/backend.pid

      - name: Start parallel Backend index worker
        working-directory: ./backend
        env:
          DATABASE_URL: mysql+pymysql://root:test123@mysql:3306/wegent_test
          REDIS_URL: redis://redis:6379/0
          SECRET_KEY: test-secret-key-for-ci-testing
          ENVIRONMENT: development
          DB_AUTO_MIGRATE: "false"
          INIT_DATA_ENABLED: "false"
          EMBEDDED_CELERY_ENABLED: "false"
          RAG_RUNTIME_MODE: remote
          KNOWLEDGE_RUNTIME_URL: http://localhost:8200
          KNOWLEDGE_CONVERSION_ENABLED: "true"
