          E2E_USE_ISOLATED_USERS: "false"
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/browser
          CI: true
          RUNNER_PROCESS_DIAGNOSTICS: "1"
          RUNNER_RESOURCE_LOG_PATH: ci-diagnostics/shard-${{ matrix.shardIndex }}.jsonl
        run: |
          # Dependencies are verified; retain resource logging without pnpm's exit worker pool.
          node ../.github/scripts/run-with-resource-logging.mjs \
            node ./node_modules/@playwright/test/cli.js test --project=chromium --project=api \
            --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Run Provider-native E2E tests
        timeout-minutes: 15
        working-directory: ./frontend
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:8000
          MOCK_MODEL_SERVER_URL: http://localhost:9999
          E2E_SHARD_INDEX: ${{ matrix.shardIndex }}
          E2E_QDRANT_URL: http://qdrant:6333
          E2E_KNOWLEDGE_RUNTIME_URL: http://localhost:8200
          E2E_USE_ISOLATED_USERS: "false"
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/provider-native
          CI: true
        run: |
          node ./node_modules/@playwright/test/cli.js test \
            --project=provider-native-chromium \
            --workers=1 \
            --shard=${{ matrix.providerShardIndex }}/${{ matrix.shardTotal }} \
            --no-deps

      - name: Stop Backend index worker
        if: always()
        working-directory: ./backend
        run: |
          if [ -f index-worker.pid ]; then
            kill "$(cat index-worker.pid)" 2>/dev/null || true
            rm -f index-worker.pid
          fi

      - name: Stop Knowledge Runtime
        if: always()
        run: |
          if [ -f knowledge_runtime/ci.pid ]; then
            kill "$(cat knowledge_runtime/ci.pid)"
          fi

      - name: Stop Knowledge Doc Converter
        if: always()
        run: |
          if [ -f knowledge_doc_converter/ci.pid ]; then
            kill "$(cat knowledge_doc_converter/ci.pid)" 2>/dev/null || true
            rm -f knowledge_doc_converter/ci.pid
          fi

      - name: Stop Mock Model Server
        if: always()
        working-directory: ./frontend
        run: |
          if [ -f mock-server.pid ]; then
            kill $(cat mock-server.pid) 2>/dev/null || true
            rm mock-server.pid
          fi

      - name: Stop local Executor device
        if: always()
        run: |
          if [ -f executor/platform-executor.pid ]; then
            kill "$(cat executor/platform-executor.pid)" 2>/dev/null || true
            rm executor/platform-executor.pid
          fi

      - name: Stop remote workspace Executor Manager
        if: always()
        run: |
          if [ -f executor_manager/workspace-manager.pid ]; then
            kill "$(cat executor_manager/workspace-manager.pid)"
          fi
          if command -v docker >/dev/null; then
            mapfile -t containers < <(docker ps -aq \
              --filter ancestor=wegent/e2e-workspace-executor:latest \
              --filter label=owner=executor_manager)
            if ((${#containers[@]})); then
              docker rm -f "${containers[@]}"
            fi
          fi

      - name: Stop frontend dev server
        if: always()
        working-directory: ./frontend
        run: |
          if [ -f next-dev.pid ]; then
            kill $(cat next-dev.pid) 2>/dev/null || true
            rm next-dev.pid
          fi

      - name: Stop Chat Shell server
        if: always()
        working-directory: ./backend
        run: |
          if [ -f chat_shell.pid ]; then
            kill $(cat chat_shell.pid) 2>/dev/null || true
            rm chat_shell.pid
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: frontend/blob-report/
          retention-days: 14

      - name: Upload test traces
        if: failure()
