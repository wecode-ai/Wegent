      - name: Run E2E tests (Sharded)
        # The chromium project auto-discovers every browser spec under
        # frontend/e2e/tests, including skill-management-scope.spec.ts.
        working-directory: ./frontend
        env:
          DATABASE_URL: mysql+pymysql://root:test123@mysql:3306/wegent_test
