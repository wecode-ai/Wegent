            --workers=1 \
            --shard=${{ matrix.providerShardIndex }}/${{ matrix.shardTotal }} \
            --no-deps

      - name: Stop Backend index worker
        if: always()
        working-directory: ./backend
        run: |
          if [ -f index-worker.pid ]; then
            kill "$(cat index-worker.pid)" 2>/dev/null || true
            rm -f index-worker.pid
          fi

      - name: Stop Knowledge Runtime
        if: always()
        run: |
          if [ -f knowledge_runtime/ci.pid ]; then
            kill "$(cat knowledge_runtime/ci.pid)"
          fi

      - name: Stop Knowledge Doc Converter
        if: always()
        run: |
          if [ -f knowledge_doc_converter/ci.pid ]; then
            kill "$(cat knowledge_doc_converter/ci.pid)" 2>/dev/null || true
            rm -f knowledge_doc_converter/ci.pid
          fi

      - name: Stop Mock Model Server
        if: always()
        working-directory: ./frontend
        run: |
          if [ -f mock-server.pid ]; then
            kill $(cat mock-server.pid) 2>/dev/null || true
            rm mock-server.pid
          fi

      - name: Stop local Executor device
        if: always()
        run: |
          if [ -f executor/platform-executor.pid ]; then
            kill "$(cat executor/platform-executor.pid)" 2>/dev/null || true
            rm executor/platform-executor.pid
          fi

      - name: Stop remote workspace Executor Manager
        if: always()
        run: |
          if [ -f executor_manager/workspace-manager.pid ]; then
            kill "$(cat executor_manager/workspace-manager.pid)"
          fi
          if command -v docker >/dev/null; then
            mapfile -t containers < <(docker ps -aq \
              --filter ancestor=wegent/e2e-workspace-executor:latest \
              --filter label=owner=executor_manager)
            if ((${#containers[@]})); then
              docker rm -f "${containers[@]}"
            fi
          fi

      - name: Stop frontend dev server
        if: always()
        working-directory: ./frontend
        run: |
          if [ -f next-dev.pid ]; then
            kill $(cat next-dev.pid) 2>/dev/null || true
            rm next-dev.pid
          fi

      - name: Stop Chat Shell server
        if: always()
        working-directory: ./backend
        run: |
          if [ -f chat_shell.pid ]; then
            kill $(cat chat_shell.pid) 2>/dev/null || true
            rm chat_shell.pid
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: frontend/blob-report/
          retention-days: 14

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-traces-${{ matrix.shardIndex }}
          path: frontend/test-results/
          retention-days: 7

      - name: Upload process diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-process-diagnostics-${{ matrix.shardIndex }}
          path: frontend/ci-diagnostics/
          retention-days: 7

      - name: Upload backend logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-logs-${{ matrix.shardIndex }}
          path: |
            backend/backend.log
            backend/index-worker.log
            logs/backend/rust/
            backend/chat_shell.log
            knowledge_runtime/ci.log
            frontend/next-dev.log
            frontend/mock-model-server.log
            executor/platform-executor.log
            executor_manager/workspace-manager.log
          retention-days: 7

  executor-e2e-tests:
    name: Executor E2E Tests
    permissions:
      actions: read
      contents: read
      packages: read
    needs:
      [
        build-frontend-e2e,
        build-backend-rs-e2e-runtime,
        build-executor-e2e-runtime,
        prepare-platform-e2e-image,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test123
          MYSQL_DATABASE: wegent_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=15

      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r0
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: wegent-e2e
          MINIO_ROOT_PASSWORD: wegent-e2e-secret
        options: >-
          --health-cmd="curl -f http://localhost:9000/minio/health/live"
          --health-interval=2s
          --health-timeout=5s
          --health-start-period=5s
          --health-retries=30

    steps:
      - name: Generate internal service token
        run: |
          token=$(openssl rand -hex 32)
          bootstrap_admin_password=$(openssl rand -hex 32)
          e2e_admin_password=$(openssl rand -hex 32)
          git_token_aes_key=$(openssl rand -hex 16)
          git_token_aes_iv=$(openssl rand -hex 8)
          echo "::add-mask::$token"
          echo "::add-mask::$bootstrap_admin_password"
          echo "::add-mask::$e2e_admin_password"
          echo "::add-mask::$git_token_aes_key"
          echo "::add-mask::$git_token_aes_iv"
          {
            echo "E2E_INTERNAL_SERVICE_TOKEN=$token"
            echo "INTERNAL_SERVICE_TOKEN=$token"
            echo "CHAT_SHELL_REMOTE_STORAGE_TOKEN=$token"
            echo "CHAT_SHELL_INTERNAL_SERVICE_TOKEN=$token"
            echo "E2E_BOOTSTRAP_ADMIN_PASSWORD=$bootstrap_admin_password"
            echo "E2E_ADMIN_PASSWORD=$e2e_admin_password"
            echo "GIT_TOKEN_AES_KEY=$git_token_aes_key"
            echo "GIT_TOKEN_AES_IV=$git_token_aes_iv"
          } >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull E2E images
        env:
          PLATFORM_E2E_IMAGE: ${{ needs.prepare-platform-e2e-image.outputs.image }}
          EXECUTOR_E2E_IMAGE: ${{ needs.build-executor-e2e-runtime.outputs.image }}
          USE_EXECUTOR_ARTIFACT: ${{ needs.build-executor-e2e-runtime.outputs.artifact }}
        run: |
          docker pull "$PLATFORM_E2E_IMAGE" &
          platform_pid=$!
          if [[ "$USE_EXECUTOR_ARTIFACT" != "true" ]]; then
            docker pull "$EXECUTOR_E2E_IMAGE" &
            executor_pid=$!
          fi

          status=0
          wait "$platform_pid" || status=$?
          if [[ -n "${executor_pid:-}" ]]; then
            wait "$executor_pid" || status=$?
          fi
          exit "$status"

      - name: Free executor E2E runner disk space
        run: .github/scripts/free-runner-disk-space-if-needed.sh 50

      - name: Install executor Rust system dependencies
        run: .github/scripts/install-executor-rust-system-dependencies.sh

      - name: Set up Node workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Restore bundled Codex cache
        id: bundled-codex-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/wegent/codex
          key: ${{ runner.os }}-wework-codex-v1-${{ hashFiles('wework/codex-binaries.lock.json') }}

      - name: Prepare bundled Codex for local Executor
        working-directory: ./wework
        run: node scripts/prepare-codex-binary.mjs --materialize

      - name: Add local harness CLIs to PATH
        run: echo "$GITHUB_WORKSPACE/.github/claude-code-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Restore shared Claude Code CLI
        id: claude-code-cli-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .github/claude-code-cli/node_modules
          key: ${{ runner.os }}-node-24-local-harness-clis-v2-${{ hashFiles('.github/claude-code-cli/package.json', '.github/claude-code-cli/package-lock.json') }}

      - name: Set up Python 3.11 and uv
        uses: ./.github/actions/setup-python-uv-cache
        with:
          python-version: "3.11"

      - name: Install shared module
        working-directory: ./shared
        run: |
          uv venv --allow-existing
          source .venv/bin/activate
          uv pip install -e .

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          uv sync
          source .venv/bin/activate
          uv pip install -e ../shared

      - name: Prepare Chat Shell tokenizers
        working-directory: ./backend
        run: |
          source .venv/bin/activate
          ../.github/scripts/prepare-chat-shell-tokenizers.sh

      - name: Install executor manager dependencies
        working-directory: ./executor_manager
        run: |
          uv sync
          source .venv/bin/activate
          uv pip install -e ../shared

      - name: Install local harness CLIs
        if: steps.claude-code-cli-cache.outputs.cache-hit != 'true'
        run: npm ci --prefix .github/claude-code-cli --strict-allow-scripts

      - name: Verify local harness CLIs
        run: .github/scripts/verify-local-harness-clis.sh

      - name: Save shared local harness CLIs
        if: github.ref == 'refs/heads/main' && steps.claude-code-cli-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .github/claude-code-cli/node_modules
          key: ${{ steps.claude-code-cli-cache.outputs.cache-primary-key }}

      - name: Download frontend E2E build
        env:
          ACTIONS_ARTIFACT_WAIT_SECONDS: "300"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/download-actions-artifact.sh \
            frontend-next-build \
            .ci-artifacts

      - name: Download Backend Rust E2E runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/download-actions-artifact.sh \
            backend-rs-e2e-runtime \
            .ci-artifacts
          chmod 0755 .ci-artifacts/wegent-backend-rs

      - name: Download Executor E2E binary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/download-actions-artifact.sh \
            executor-e2e-binary \
            .ci-artifacts
          mkdir -p executor/target/release
          cp .ci-artifacts/wegent-executor executor/target/release/wegent-executor
          chmod 0755 executor/target/release/wegent-executor

      - name: Restore frontend E2E build
        run: .github/scripts/restore-frontend-e2e-build.sh

      - name: Download fork Executor E2E runtime
        if: needs.build-executor-e2e-runtime.outputs.artifact == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/download-actions-artifact.sh \
            executor-e2e-runtime \
            .ci-artifacts

      - name: Restore fork Executor E2E runtime
        if: needs.build-executor-e2e-runtime.outputs.artifact == 'true'
        run: .github/scripts/restore-executor-e2e-runtime.sh

      - name: Run database migrations
        working-directory: ./backend
        env:
          DATABASE_URL: mysql+pymysql://root:test123@localhost:3306/wegent_test
        run: |
          uv run --no-sync alembic upgrade head

      - name: Resolve Docker bridge host
        run: |
          DOCKER_BRIDGE_HOST=$(ip -4 addr show docker0 | awk '/inet / {print $2}' | cut -d/ -f1)
          if [ -z "$DOCKER_BRIDGE_HOST" ]; then
            DOCKER_BRIDGE_HOST=172.17.0.1
          fi
          echo "E2E_DOCKER_BRIDGE_HOST=$DOCKER_BRIDGE_HOST" >> "$GITHUB_ENV"
          echo "BACKEND_INTERNAL_URL=http://$DOCKER_BRIDGE_HOST:8000" >> "$GITHUB_ENV"
          echo "CALLBACK_HOST=http://$DOCKER_BRIDGE_HOST:8001" >> "$GITHUB_ENV"
          echo "TASK_API_DOMAIN=http://$DOCKER_BRIDGE_HOST:8000" >> "$GITHUB_ENV"
          echo "E2E_CLAUDE_MODEL_SERVER_URL=http://$DOCKER_BRIDGE_HOST:9999" >> "$GITHUB_ENV"
          echo "E2E_CODEX_MODEL_SERVER_URL=http://$DOCKER_BRIDGE_HOST:9999" >> "$GITHUB_ENV"
          echo "Docker bridge host: $DOCKER_BRIDGE_HOST"

      - name: Start backend server
        env:
          DATABASE_URL: mysql+pymysql://root:test123@localhost:3306/wegent_test
          RS_DATABASE_URL_COLLATION: utf8mb4_0900_ai_ci
          REDIS_URL: redis://localhost:6379/0
          EXECUTOR_MANAGER_URL: http://localhost:8001
          SECRET_KEY: test-secret-key-for-ci-testing
          ALGORITHM: HS256
          ENVIRONMENT: development
          DB_AUTO_MIGRATE: "false"
          INIT_DATA_ENABLED: "true"
          PLUGIN_LEGACY_UPLOAD_ENABLED: "true"
          ATTACHMENT_S3_ENDPOINT: localhost:9000
          ATTACHMENT_S3_ACCESS_KEY: wegent-e2e
          ATTACHMENT_S3_SECRET_KEY: wegent-e2e-secret
          ATTACHMENT_S3_USE_SSL: "false"
          WEGENT_RS_BINARY_PATH: ${{ github.workspace }}/.ci-artifacts/wegent-backend-rs
          WEGENT_HYBRID_STATE_FILE: ${{ github.workspace }}/backend/backend-hybrid.state
        run: |
          nohup backend-rs/scripts/start-hybrid-backend.sh \
            > backend/backend.log 2>&1 &
          echo $! > backend/backend.pid

      - name: Start Chat Shell server
        working-directory: ./backend
        env:
          CHAT_SHELL_MODE: http
          CHAT_SHELL_STORAGE_TYPE: remote
          CHAT_SHELL_REMOTE_STORAGE_URL: http://localhost:8000/api/internal
          EXECUTOR_MANAGER_URL: http://localhost:8001
        run: |
          source .venv/bin/activate
          nohup python -m uvicorn chat_shell.main:app --host 0.0.0.0 --port 8100 > chat_shell.log 2>&1 &
          echo $! > chat_shell.pid

      - name: Start frontend server
        working-directory: ./frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
          RUNTIME_INTERNAL_API_URL: http://localhost:8000
          RUNTIME_SOCKET_DIRECT_URL: http://localhost:8000
        run: ../.github/scripts/start-frontend-e2e-server.sh

      - name: Start Mock Model Server
        working-directory: ./frontend
        run: |
          pnpm exec tsx e2e/utils/mock-model-server.ts > mock-model-server.log 2>&1 &
          echo $! > mock-server.pid

      - name: Start Local Executor
        env:
          EXECUTOR_MODE: local
          WEGENT_BACKEND_URL: http://localhost:8000
          DEVICE_ID: e2e-claudecode-device
          DEVICE_NAME: E2E ClaudeCode Device
          DEVICE_TYPE: app
          BIND_SHELL: claudecode
          CLAUDE_BINARY_PATH: ${{ github.workspace }}/.github/claude-code-cli/node_modules/.bin/claude
          WEGENT_EXECUTOR_HOME: ${{ runner.temp }}/wegent-executor
          LOCAL_WORKSPACE_ROOT: ${{ runner.temp }}/wegent-workspace
          WORKSPACE_ROOT: ${{ runner.temp }}/wegent-workspace
          LOCAL_HEARTBEAT_INTERVAL: "5"
          LOG_LEVEL: info
          CODEX_BINARY_PATH: ${{ github.workspace }}/wework/resources/binaries/codex/x86_64-unknown-linux-gnu/vendor/x86_64-unknown-linux-musl/bin/codex
          CODEX_HOME: ${{ runner.temp }}/wegent-executor/codex
          WEGENT_CODEX_HOME: ${{ runner.temp }}/wegent-executor/codex
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY: "1"
          CLAUDE_CODE_DISABLE_NONSTREAMING_FALLBACK: "1"
          CLAUDE_CODE_INCLUDE_CO_AUTHORED_BY: "false"
        run: |
          .github/scripts/start-local-e2e-executor.sh \
            executor/target/release/wegent-executor \
            executor/local-executor.log \
            executor/local-executor.pid

      - name: Start Claude Code Compaction Executor
        env:
          EXECUTOR_MODE: local
          WEGENT_BACKEND_URL: http://localhost:8000
          DEVICE_ID: e2e-claudecode-compaction-device
          DEVICE_NAME: E2E Claude Code Compaction Device
          DEVICE_TYPE: local
          DEVICE_SESSION_GATEWAY_PORT: "17889"
          BIND_SHELL: claudecode
          WEGENT_EXECUTOR_HOME: ${{ runner.temp }}/wegent-compaction-executor
          WEGENT_CLAUDE_HOME: ${{ runner.temp }}/wegent-compaction-executor/claude
          LOCAL_WORKSPACE_ROOT: ${{ runner.temp }}/wegent-compaction-workspace
          WORKSPACE_ROOT: ${{ runner.temp }}/wegent-compaction-workspace
          LOCAL_HEARTBEAT_INTERVAL: "5"
          LOG_LEVEL: info
          CLAUDE_BINARY_PATH: ${{ github.workspace }}/.github/claude-code-cli/node_modules/.bin/claude
          CODEX_BINARY_PATH: ${{ github.workspace }}/wework/resources/binaries/codex/x86_64-unknown-linux-gnu/vendor/x86_64-unknown-linux-musl/bin/codex
          CODEX_HOME: ${{ runner.temp }}/wegent-compaction-executor/codex
          WEGENT_CODEX_HOME: ${{ runner.temp }}/wegent-compaction-executor/codex
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY: "1"
          CLAUDE_CODE_DISABLE_NONSTREAMING_FALLBACK: "1"
        run: |
          .github/scripts/start-local-e2e-executor.sh \
            executor/target/release/wegent-executor \
            executor/compaction-executor.log \
            executor/compaction-executor.pid

      - name: Start Executor Manager
        working-directory: ./executor_manager
        env:
          REDIS_URL: redis://localhost:6379/0
          EXECUTOR_IMAGE: ${{ needs.build-executor-e2e-runtime.outputs.artifact == 'true' && 'wegent/e2e-claudecode-executor:latest' || needs.build-executor-e2e-runtime.outputs.image }}
          EXECUTOR_PORT_RANGE_MIN: "12000"
          EXECUTOR_PORT_RANGE_MAX: "12100"
          EXECUTOR_READY_MAX_RETRIES: "90"
          EXECUTOR_READY_INTERVAL: "1"
          SANDBOX_READY_MAX_RETRIES: "90"
          SANDBOX_READY_INTERVAL: "1"
          EXECUTOR_MANAGER_CALLBACK_URL: http://localhost:8001/executor-manager/callback
          DOCKER_HOST_ADDR: localhost
          NETWORK: bridge
          SERVICE_POOL: e2e-executor
          EXECUTOR_WORKSPACE: ${{ runner.temp }}/wegent-executor-workspace
          OTEL_ENABLED: "false"
        run: |
          mkdir -p "${EXECUTOR_WORKSPACE}"
          source .venv/bin/activate
          nohup uvicorn main:app --host 0.0.0.0 --port 8001 > executor_manager.log 2>&1 &
          echo $! > executor_manager.pid

      - name: Wait for services
        run: |
          wait_for_url() {
            local url="$1"
            for i in {1..120}; do
              if curl -sf "$url" >/dev/null; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          wait_for_url http://localhost:8000/api/docs \
            && wait_for_url http://localhost:8100/health \
            && wait_for_url http://localhost:3000 \
            && wait_for_url http://localhost:9999/health \
            && wait_for_url http://localhost:8001/health \
            || (cat backend/backend.log && cat backend/chat_shell.log && cat frontend/next-dev.log && cat frontend/mock-model-server.log && cat executor/local-executor.log && cat executor_manager/executor_manager.log && exit 1)

      - name: Verify backend is running
        run: |
          curl -f http://localhost:8000/api/docs > /dev/null 2>&1 || (cat backend/backend.log && exit 1)

      - name: Verify Chat Shell is running
        run: |
          curl -f http://localhost:8100/health > /dev/null 2>&1 || (cat backend/chat_shell.log && exit 1)

      - name: Run Executor Manager resilience E2E tests
        working-directory: ./executor_manager
        env:
          E2E_REDIS_URL: redis://localhost:6379/15
          OTEL_ENABLED: "false"
          PYTHONPATH: ${{ github.workspace }}
        run: uv run pytest e2e_tests/ --no-cov -v

      - name: Verify retired artifact revision against real MySQL
        working-directory: ./backend
        env:
          WEGENT_MIGRATION_TEST_DATABASE_URL: mysql+pymysql://root:test123@localhost:3306/wegent_test
          PYTHONPATH: ${{ github.workspace }}
        run: uv run pytest tests/models/test_wework_file_delivery_migration.py -n 0 --no-cov

      - name: Run Executor E2E tests
        env:
          DATABASE_URL: mysql+pymysql://root:test123@localhost:3306/wegent_test
          PLATFORM_E2E_IMAGE: ${{ needs.prepare-platform-e2e-image.outputs.image }}
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:8000
          E2E_USE_ISOLATED_USERS: "false"
          MOCK_MODEL_SERVER_URL: http://localhost:9999
          E2E_LOCAL_CLAUDE_MODEL_SERVER_URL: http://localhost:9999
          E2E_CLAUDE_EXECUTOR_IMAGE: ${{ needs.build-executor-e2e-runtime.outputs.artifact == 'true' && 'wegent/e2e-claudecode-executor:latest' || needs.build-executor-e2e-runtime.outputs.image }}
          E2E_DEVICE_ID: e2e-claudecode-device
          CI: true
        run: |
          repository_name="${GITHUB_REPOSITORY##*/}"
          container_workspace="/__w/$repository_name/$repository_name"
          docker run --rm \
            --network host \
            --ipc host \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$GITHUB_WORKSPACE:$container_workspace" \
            --workdir "$container_workspace/frontend" \
            --env E2E_INTERNAL_SERVICE_TOKEN \
            --env INTERNAL_SERVICE_TOKEN \
            --env CHAT_SHELL_REMOTE_STORAGE_TOKEN \
            --env CHAT_SHELL_INTERNAL_SERVICE_TOKEN \
            --env E2E_BOOTSTRAP_ADMIN_PASSWORD \
            --env E2E_ADMIN_PASSWORD \
            --env GIT_TOKEN_AES_KEY \
            --env GIT_TOKEN_AES_IV \
            --env E2E_BASE_URL \
            --env E2E_API_URL \
            --env E2E_USE_ISOLATED_USERS \
            --env MOCK_MODEL_SERVER_URL \
            --env E2E_CLAUDE_MODEL_SERVER_URL \
            --env E2E_CODEX_MODEL_SERVER_URL \
            --env E2E_LOCAL_CLAUDE_MODEL_SERVER_URL \
            --env E2E_CLAUDE_EXECUTOR_IMAGE \
            --env DATABASE_URL \
            --env E2E_DEVICE_ID \
            --env CI \
            "$PLATFORM_E2E_IMAGE" \
            node ./node_modules/@playwright/test/cli.js test --project=executor-chromium

      - name: Stop Local ClaudeCode Executor
        if: always()
        run: |
          for pid_file in executor/local-executor.pid executor/compaction-executor.pid; do
            if [ -f "$pid_file" ]; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
              rm "$pid_file"
            fi
          done

      - name: Stop frontend dev server
        if: always()
        working-directory: ./frontend
        run: |
          if [ -f next-dev.pid ]; then
            kill $(cat next-dev.pid) 2>/dev/null || true
            rm next-dev.pid
          fi

      - name: Stop Executor Manager
        if: always()
        working-directory: ./executor_manager
        run: |
          if [ -f executor_manager.pid ]; then
            kill $(cat executor_manager.pid) 2>/dev/null || true
            rm executor_manager.pid
          fi

      - name: Capture Executor Manager container logs
        if: failure()
        run: |
          mkdir -p executor_manager/container-logs
          for container_id in $(docker ps -aq --filter label=owner=executor_manager); do
            container_name=$(docker inspect --format '{{.Name}}' "$container_id" | sed 's#^/##')
            docker logs "$container_id" \
              > "executor_manager/container-logs/${container_name}.log" 2>&1 || true
          done

      - name: Remove Executor Manager Containers
        if: always()
        run: |
          docker ps -aq --filter label=owner=executor_manager | xargs -r docker rm -f

      - name: Stop Mock Model Server
        if: always()
        working-directory: ./frontend
        run: |
          if [ -f mock-server.pid ]; then
            kill $(cat mock-server.pid) 2>/dev/null || true
            rm mock-server.pid
          fi

      - name: Stop Chat Shell server
        if: always()
        working-directory: ./backend
        run: |
          if [ -f chat_shell.pid ]; then
            kill $(cat chat_shell.pid) 2>/dev/null || true
            rm chat_shell.pid
          fi

      - name: Upload executor test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blob-report-executor
          path: frontend/blob-report/
          retention-days: 14

      - name: Upload executor test traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-traces-executor
          path: frontend/test-results/
          retention-days: 7

      - name: Upload executor logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-logs-executor
          path: |
            backend/backend.log
            backend/chat_shell.log
            frontend/next-dev.log
            frontend/mock-model-server.log
            executor/local-executor.log
            executor/compaction-executor.log
            executor_manager/executor_manager.log
            executor_manager/container-logs/
          retention-days: 7

  platform-e2e-summary:
    name: Platform E2E Summary
    needs:
      - changes
      - build-frontend-e2e
      - build-executor-e2e-runtime
      - e2e-tests
      - executor-e2e-tests
    if: always() && !cancelled()
    runs-on: ubuntu-latest

    steps:
      - name: Check Platform E2E results
        env:
          RUN_E2E: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.changes.outputs.platform_e2e == 'true') }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_BUILD_RESULT: ${{ needs.build-frontend-e2e.result }}
          EXECUTOR_BUILD_RESULT: ${{ needs.build-executor-e2e-runtime.result }}
          PLATFORM_E2E_RESULT: ${{ needs.e2e-tests.result }}
          EXECUTOR_E2E_RESULT: ${{ needs.executor-e2e-tests.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Platform E2E change detection completed with: $CHANGES_RESULT"
            exit 1
          fi

          if [[ "$RUN_E2E" != "true" ]]; then
            echo "Platform E2E is not required for this pull request"
            exit 0
          fi

          assert_success() {
            local result="$1"
            local name="$2"
            if [[ "$result" != "success" ]]; then
              echo "$name completed with: $result"
              exit 1
            fi
          }

          assert_success "$FRONTEND_BUILD_RESULT" "Frontend E2E build"
          assert_success "$EXECUTOR_BUILD_RESULT" "Executor E2E build"
          assert_success "$PLATFORM_E2E_RESULT" "Platform E2E"
          assert_success "$EXECUTOR_E2E_RESULT" "Executor E2E"
