name: E2E Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  merge_group:
    types: [checks_requested]
  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  changes:
    name: Detect Platform E2E Changes
    runs-on: ubuntu-latest
    outputs:
      platform_e2e: ${{ steps.classify.outputs.platform_e2e }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          FORCE_ALL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:all') }}
        run: |
          if [[ "$FORCE_ALL" == "true" ]]; then
            .github/scripts/classify-ci-changes.sh --all
          else
            git diff --name-only "$BASE_SHA...$HEAD_SHA" |
              .github/scripts/classify-ci-changes.sh
          fi

  build-frontend-e2e:
    name: Build Frontend E2E Artifact
    needs: changes
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.changes.outputs.platform_e2e == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      playwright_version: ${{ steps.playwright-version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node workspace
        uses: ./.github/actions/setup-node-workspace
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Resolve Playwright version
        id: playwright-version
        working-directory: ./frontend
        run: |
          version="$(pnpm exec playwright --version | sed -n 's/^Version //p')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore shared Next.js build cache
        id: nextjs-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ./frontend/.next/cache
          key: ${{ runner.os }}-nextjs-e2e-v2-${{ hashFiles('./pnpm-lock.yaml') }}-${{ hashFiles('./frontend/src/**/*.[jt]s', './frontend/src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-e2e-v2-${{ hashFiles('./pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-e2e-v2-

      - name: Build frontend for E2E
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: 1
          RUNTIME_INTERNAL_API_URL: http://localhost:8000
          RUNTIME_SOCKET_DIRECT_URL: http://localhost:8000
        run: pnpm run build

      - name: Save shared Next.js build cache
        if: github.ref == 'refs/heads/main' && steps.nextjs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ./frontend/.next/cache
          key: ${{ steps.nextjs-cache.outputs.cache-primary-key }}

      - name: Archive frontend E2E build
        run: .github/scripts/archive-frontend-e2e-build.sh

      - name: Upload frontend E2E build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-next-build
          path: .ci-artifacts/frontend-next-build.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  prepare-platform-e2e-image:
    name: Prepare Platform E2E Image
    needs: [changes, build-frontend-e2e]
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.changes.outputs.platform_e2e == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Resolve Platform E2E image
        id: image
        env:
          PLAYWRIGHT_VERSION: ${{ needs.build-frontend-e2e.outputs.playwright_version }}
        run: |
          dockerfile=docker/wework-e2e/browser.Dockerfile
          image_ref="$(awk '$1 == "FROM" { print $2 }' "$dockerfile")"
          image_version="${image_ref#mcr.microsoft.com/playwright:v}"
          image_version="${image_version%-noble}"
          if [[ "$image_version" != "$PLAYWRIGHT_VERSION" ]]; then
            echo "Playwright image version $image_version does not match workspace version $PLAYWRIGHT_VERSION" >&2
            exit 1
          fi
          digest="$(sha256sum "$dockerfile" | cut -d ' ' -f 1)"
          echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wegent-wework-e2e:browser-$digest" \
            >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Check Platform E2E image
        id: image-check
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish Platform E2E image
        if: steps.image-check.outputs.exists != 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          file: docker/wework-e2e/browser.Dockerfile
          push: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/wegent-wework-e2e:buildcache-browser
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/wegent-wework-e2e:buildcache-browser,mode=max

  build-executor-e2e-runtime:
    name: Prepare Executor E2E Runtime
    needs: changes
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.changes.outputs.platform_e2e == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.runtime.outputs.image }}
      artifact: ${{ steps.access.outputs.artifact }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Resolve Executor E2E registry access
        id: access
        env:
          REGISTRY_ENABLED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [[ "$REGISTRY_ENABLED" == "true" ]]; then
            echo "artifact=false" >> "$GITHUB_OUTPUT"
          else
            echo "artifact=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Resolve Executor E2E runtime
        id: runtime
        env:
          SOURCE_DIGEST: ${{ hashFiles('frontend/e2e/fixtures/claudecode-executor/Dockerfile', 'executor/Cargo.toml', 'executor/Cargo.lock', 'executor/src/**', 'shared/assets/**') }}
        run: .github/scripts/resolve-executor-e2e-runtime.sh

      - name: Check content-addressed Executor E2E image
        if: steps.access.outputs.artifact != 'true'
        id: image-check
        env:
          IMAGE: ${{ steps.runtime.outputs.image }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish Executor E2E image
        if: steps.access.outputs.artifact != 'true' && steps.image-check.outputs.exists != 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          file: frontend/e2e/fixtures/claudecode-executor/Dockerfile
          build-args: BASE_IMAGE=${{ steps.runtime.outputs.base-image }}
          push: true
          tags: ${{ steps.runtime.outputs.image }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/wegent-executor:buildcache-e2e

      - name: Build fork Executor E2E image
        if: steps.access.outputs.artifact == 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          file: frontend/e2e/fixtures/claudecode-executor/Dockerfile
          build-args: BASE_IMAGE=${{ steps.runtime.outputs.base-image }}
          load: true
          tags: wegent/e2e-claudecode-executor:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/wegent-executor:buildcache-e2e

      - name: Extract fork Executor binary
        if: steps.access.outputs.artifact == 'true'
        run: |
          mkdir -p executor/target/release
          container_id="$(docker create wegent/e2e-claudecode-executor:latest)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/app/executor" executor/target/release/wegent-executor
          chmod 0755 executor/target/release/wegent-executor

      - name: Archive fork Executor E2E runtime
        if: steps.access.outputs.artifact == 'true'
        run: .github/scripts/archive-executor-e2e-runtime.sh

      - name: Upload fork Executor E2E runtime
        if: steps.access.outputs.artifact == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: executor-e2e-runtime
          path: |
            .ci-artifacts/e2e-claudecode-executor-image.tar.zst
            .ci-artifacts/wegent-executor
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Runs browser and API tests with sharding. Executor-heavy coverage runs separately.
  e2e-tests:
    name: E2E Tests (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    needs: [build-frontend-e2e, prepare-platform-e2e-image]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HOME: /root
    container:
      image: ${{ needs.prepare-platform-e2e-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test123
          MYSQL_DATABASE: wegent_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-start-period=45s
          --health-retries=6

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      qdrant:
        image: qdrant/qdrant:v1.15.4

    steps:
      - name: Generate internal service token
        run: |
          token=$(openssl rand -hex 32)
          bootstrap_admin_password=$(openssl rand -hex 32)
          e2e_admin_password=$(openssl rand -hex 32)
          git_token_aes_key=$(openssl rand -hex 16)
          git_token_aes_iv=$(openssl rand -hex 8)
          echo "::add-mask::$token"
          echo "::add-mask::$bootstrap_admin_password"
          echo "::add-mask::$e2e_admin_password"
          echo "::add-mask::$git_token_aes_key"
          echo "::add-mask::$git_token_aes_iv"
          {
            echo "E2E_INTERNAL_SERVICE_TOKEN=$token"
            echo "INTERNAL_SERVICE_TOKEN=$token"
            echo "CHAT_SHELL_REMOTE_STORAGE_TOKEN=$token"
            echo "CHAT_SHELL_INTERNAL_SERVICE_TOKEN=$token"
            echo "E2E_BOOTSTRAP_ADMIN_PASSWORD=$bootstrap_admin_password"
            echo "E2E_ADMIN_PASSWORD=$e2e_admin_password"
            echo "GIT_TOKEN_AES_KEY=$git_token_aes_key"
            echo "GIT_TOKEN_AES_IV=$git_token_aes_iv"
          } >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node workspace
        uses: ./.github/actions/setup-node-workspace
        with:
          setup-toolchain: "false"

      - name: Set up Python 3.11 and uv
        uses: ./.github/actions/setup-python-uv-cache
        with:
          python-version: "3.11"
          setup-uv: "false"

      - name: Install shared module
        working-directory: ./shared
        run: |
          uv venv --allow-existing
          source .venv/bin/activate
          uv pip install -e .

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          uv sync
          source .venv/bin/activate
          uv pip install -e ../shared

      - name: Download frontend E2E build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: frontend-next-build
          path: .ci-artifacts

      - name: Install Knowledge Runtime dependencies
        run: uv sync --project knowledge_runtime --frozen

      - name: Restore frontend E2E build
        run: .github/scripts/restore-frontend-e2e-build.sh

      - name: Run database migrations
        working-directory: ./backend
        env:
          DATABASE_URL: mysql+pymysql://root:test123@mysql:3306/wegent_test
        run: |
          source .venv/bin/activate
          alembic upgrade head

      - name: Verify DingTalk sync MySQL transaction rollback
        if: matrix.shardIndex == 1
        working-directory: ./backend
        env:
          DINGTALK_SYNC_TEST_MYSQL_URL: mysql+pymysql://root:test123@mysql:3306/wegent_test
          PYTHONPATH: ..:.
        run: uv run --no-sync python tests/integration/dingtalk_sync_mysql.py

      - name: Start backend server
        working-directory: ./backend
        env:
          DATABASE_URL: mysql+pymysql://root:test123@mysql:3306/wegent_test
          REDIS_URL: redis://redis:6379/0
          EXECUTOR_MANAGER_URL: http://localhost:8001
          SECRET_KEY: test-secret-key-for-ci-testing
          ALGORITHM: HS256
          ENVIRONMENT: development
          DB_AUTO_MIGRATE: "false"
          INIT_DATA_ENABLED: "true"
          RAG_RUNTIME_MODE: remote
          KNOWLEDGE_RUNTIME_URL: http://localhost:8200
          CHUNK_STORAGE_ENABLED: "true"
        run: |
          source .venv/bin/activate
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Start Knowledge Runtime
        env:
          KNOWLEDGE_RUNTIME_DATABASE_URL: mysql+pymysql://root:test123@mysql:3306/wegent_test
          KNOWLEDGE_RUNTIME_BACKEND_INTERNAL_URL: http://localhost:8000
          LOG_FILE_ENABLED: "false"
        run: |
          nohup uv run --project knowledge_runtime --no-sync uvicorn knowledge_runtime.main:app \
            --host 0.0.0.0 --port 8200 > knowledge_runtime/ci.log 2>&1 &
          echo $! > knowledge_runtime/ci.pid

      - name: Start Chat Shell server
        working-directory: ./backend
        env:
          CHAT_SHELL_MODE: http
          CHAT_SHELL_STORAGE_TYPE: remote
          CHAT_SHELL_REMOTE_STORAGE_URL: http://localhost:8000/api/internal
          EXECUTOR_MANAGER_URL: http://localhost:8001
        run: |
          source .venv/bin/activate
          nohup python -m uvicorn chat_shell.main:app --host 0.0.0.0 --port 8100 > chat_shell.log 2>&1 &
          echo $! > chat_shell.pid

      - name: Start frontend server
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: 1
          RUNTIME_INTERNAL_API_URL: http://localhost:8000
          RUNTIME_SOCKET_DIRECT_URL: http://localhost:8000
        run: ../.github/scripts/start-frontend-e2e-server.sh

      - name: Start Mock Model Server
        working-directory: ./frontend
        run: |
          pnpm exec tsx e2e/utils/mock-model-server.ts > mock-model-server.log 2>&1 &
          echo $! > mock-server.pid

      - name: Wait for services
        run: |
          wait_for_url() {
            local url="$1"
            for i in {1..120}; do
              if curl -sf "$url" >/dev/null; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          wait_for_url http://localhost:8000/api/docs \
            && wait_for_url http://localhost:8200/internal/rag/health \
            && wait_for_url http://qdrant:6333/readyz \
            && wait_for_url http://localhost:8100/health \
            && wait_for_url http://localhost:3000 \
            && wait_for_url http://localhost:9999/health \
            || (cat backend/backend.log knowledge_runtime/ci.log backend/chat_shell.log frontend/next-dev.log frontend/mock-model-server.log; exit 1)

      - name: Verify backend is running
        run: |
          curl -f http://localhost:8000/api/docs > /dev/null 2>&1 || (cat backend/backend.log && exit 1)

      - name: Verify Chat Shell is running
        run: |
          curl -f http://localhost:8100/health > /dev/null 2>&1 || (cat backend/chat_shell.log && exit 1)

      - name: Run E2E tests (Sharded)
        working-directory: ./frontend
        env:
          DATABASE_URL: mysql+pymysql://root:test123@mysql:3306/wegent_test
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:8000
          MOCK_MODEL_SERVER_URL: http://localhost:9999
          E2E_SHARD_INDEX: ${{ matrix.shardIndex }}
          CI: true
        run: |
          pnpm exec playwright test --project=chromium --project=api \
            --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Run Provider-native E2E tests serially
        if: matrix.shardIndex == 1
        timeout-minutes: 15
        working-directory: ./frontend
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:8000
          MOCK_MODEL_SERVER_URL: http://localhost:9999
          E2E_SHARD_INDEX: ${{ matrix.shardIndex }}
          E2E_QDRANT_URL: http://qdrant:6333
          E2E_KNOWLEDGE_RUNTIME_URL: http://localhost:8200
          CI: true
        run: pnpm exec playwright test --project=provider-native-chromium --workers=1 --no-deps

      - name: Stop Knowledge Runtime
        if: always()
        run: |
          if [ -f knowledge_runtime/ci.pid ]; then
            kill "$(cat knowledge_runtime/ci.pid)"
          fi

      - name: Stop Mock Model Server
        if: always()
        working-directory: ./frontend
        run: |
          if [ -f mock-server.pid ]; then
            kill $(cat mock-server.pid) 2>/dev/null || true
            rm mock-server.pid
          fi

      - name: Stop frontend dev server
        if: always()
        working-directory: ./frontend
        run: |
          if [ -f next-dev.pid ]; then
            kill $(cat next-dev.pid) 2>/dev/null || true
            rm next-dev.pid
          fi

      - name: Stop Chat Shell server
        if: always()
        working-directory: ./backend
        run: |
          if [ -f chat_shell.pid ]; then
            kill $(cat chat_shell.pid) 2>/dev/null || true
            rm chat_shell.pid
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: frontend/blob-report/
          retention-days: 14

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-traces-${{ matrix.shardIndex }}
          path: frontend/test-results/
          retention-days: 7

      - name: Upload backend logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-logs-${{ matrix.shardIndex }}
          path: |
            backend/backend.log
            backend/chat_shell.log
            knowledge_runtime/ci.log
            frontend/next-dev.log
            frontend/mock-model-server.log
          retention-days: 7

  executor-e2e-tests:
    name: Executor E2E Tests
    needs:
      [
        build-frontend-e2e,
        build-executor-e2e-runtime,
        prepare-platform-e2e-image,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test123
          MYSQL_DATABASE: wegent_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Generate internal service token
        run: |
          token=$(openssl rand -hex 32)
          bootstrap_admin_password=$(openssl rand -hex 32)
          e2e_admin_password=$(openssl rand -hex 32)
          git_token_aes_key=$(openssl rand -hex 16)
          git_token_aes_iv=$(openssl rand -hex 8)
          echo "::add-mask::$token"
          echo "::add-mask::$bootstrap_admin_password"
          echo "::add-mask::$e2e_admin_password"
          echo "::add-mask::$git_token_aes_key"
          echo "::add-mask::$git_token_aes_iv"
          {
            echo "E2E_INTERNAL_SERVICE_TOKEN=$token"
            echo "INTERNAL_SERVICE_TOKEN=$token"
            echo "CHAT_SHELL_REMOTE_STORAGE_TOKEN=$token"
            echo "CHAT_SHELL_INTERNAL_SERVICE_TOKEN=$token"
            echo "E2E_BOOTSTRAP_ADMIN_PASSWORD=$bootstrap_admin_password"
            echo "E2E_ADMIN_PASSWORD=$e2e_admin_password"
            echo "GIT_TOKEN_AES_KEY=$git_token_aes_key"
            echo "GIT_TOKEN_AES_IV=$git_token_aes_iv"
          } >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull E2E images
        env:
          PLATFORM_E2E_IMAGE: ${{ needs.prepare-platform-e2e-image.outputs.image }}
          EXECUTOR_E2E_IMAGE: ${{ needs.build-executor-e2e-runtime.outputs.image }}
          USE_EXECUTOR_ARTIFACT: ${{ needs.build-executor-e2e-runtime.outputs.artifact }}
        run: |
          docker pull "$PLATFORM_E2E_IMAGE" &
          platform_pid=$!
          if [[ "$USE_EXECUTOR_ARTIFACT" != "true" ]]; then
            docker pull "$EXECUTOR_E2E_IMAGE" &
            executor_pid=$!
          fi

          status=0
          wait "$platform_pid" || status=$?
          if [[ -n "${executor_pid:-}" ]]; then
            wait "$executor_pid" || status=$?
          fi
          exit "$status"

      - name: Free executor E2E runner disk space
        run: .github/scripts/free-runner-disk-space-if-needed.sh 50

      - name: Install executor Rust system dependencies
        run: .github/scripts/install-executor-rust-system-dependencies.sh

      - name: Set up Node workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Add local harness CLIs to PATH
        run: echo "$GITHUB_WORKSPACE/.github/claude-code-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Restore shared Claude Code CLI
        id: claude-code-cli-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .github/claude-code-cli/node_modules
          key: ${{ runner.os }}-node-24-local-harness-clis-v2-${{ hashFiles('.github/claude-code-cli/package.json', '.github/claude-code-cli/package-lock.json') }}

      - name: Set up Python 3.11 and uv
        uses: ./.github/actions/setup-python-uv-cache
        with:
          python-version: "3.11"

      - name: Install shared module
        working-directory: ./shared
        run: |
          uv venv --allow-existing
          source .venv/bin/activate
          uv pip install -e .

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          uv sync
          source .venv/bin/activate
          uv pip install -e ../shared

      - name: Install executor manager dependencies
        working-directory: ./executor_manager
        run: |
          uv sync
          source .venv/bin/activate
          uv pip install -e ../shared

      - name: Install local harness CLIs
        if: steps.claude-code-cli-cache.outputs.cache-hit != 'true'
        run: npm ci --prefix .github/claude-code-cli --strict-allow-scripts

      - name: Verify local harness CLIs
        run: .github/scripts/verify-local-harness-clis.sh

      - name: Save shared local harness CLIs
        if: github.ref == 'refs/heads/main' && steps.claude-code-cli-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .github/claude-code-cli/node_modules
          key: ${{ steps.claude-code-cli-cache.outputs.cache-primary-key }}

      - name: Download frontend E2E build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: frontend-next-build
          path: .ci-artifacts

      - name: Restore frontend E2E build
        run: .github/scripts/restore-frontend-e2e-build.sh

      - name: Extract content-addressed Executor binary
        if: needs.build-executor-e2e-runtime.outputs.artifact != 'true'
        env:
          EXECUTOR_E2E_IMAGE: ${{ needs.build-executor-e2e-runtime.outputs.image }}
        run: |
          mkdir -p executor/target/release
          container_id="$(docker create "$EXECUTOR_E2E_IMAGE")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/app/executor" executor/target/release/wegent-executor
          chmod 0755 executor/target/release/wegent-executor

      - name: Download fork Executor E2E runtime
        if: needs.build-executor-e2e-runtime.outputs.artifact == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: executor-e2e-runtime
          path: .ci-artifacts

      - name: Restore fork Executor E2E runtime
        if: needs.build-executor-e2e-runtime.outputs.artifact == 'true'
        run: .github/scripts/restore-executor-e2e-runtime.sh

      - name: Run database migrations
        working-directory: ./backend
        env:
          DATABASE_URL: mysql+pymysql://root:test123@localhost:3306/wegent_test
        run: |
          source .venv/bin/activate
          alembic upgrade head

      - name: Resolve Docker bridge host
        run: |
          DOCKER_BRIDGE_HOST=$(ip -4 addr show docker0 | awk '/inet / {print $2}' | cut -d/ -f1)
          if [ -z "$DOCKER_BRIDGE_HOST" ]; then
            DOCKER_BRIDGE_HOST=172.17.0.1
          fi
          echo "E2E_DOCKER_BRIDGE_HOST=$DOCKER_BRIDGE_HOST" >> "$GITHUB_ENV"
          echo "BACKEND_INTERNAL_URL=http://$DOCKER_BRIDGE_HOST:8000" >> "$GITHUB_ENV"
          echo "CALLBACK_HOST=http://$DOCKER_BRIDGE_HOST:8001" >> "$GITHUB_ENV"
          echo "TASK_API_DOMAIN=http://$DOCKER_BRIDGE_HOST:8000" >> "$GITHUB_ENV"
          echo "E2E_CLAUDE_MODEL_SERVER_URL=http://$DOCKER_BRIDGE_HOST:9999" >> "$GITHUB_ENV"
          echo "Docker bridge host: $DOCKER_BRIDGE_HOST"

      - name: Start backend server
        working-directory: ./backend
        env:
          DATABASE_URL: mysql+pymysql://root:test123@localhost:3306/wegent_test
          REDIS_URL: redis://localhost:6379/0
          EXECUTOR_MANAGER_URL: http://localhost:8001
          SECRET_KEY: test-secret-key-for-ci-testing
          ALGORITHM: HS256
          ENVIRONMENT: development
          DB_AUTO_MIGRATE: "false"
          INIT_DATA_ENABLED: "true"
        run: |
          source .venv/bin/activate
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Start Chat Shell server
        working-directory: ./backend
        env:
          CHAT_SHELL_MODE: http
          CHAT_SHELL_STORAGE_TYPE: remote
          CHAT_SHELL_REMOTE_STORAGE_URL: http://localhost:8000/api/internal
          EXECUTOR_MANAGER_URL: http://localhost:8001
        run: |
          source .venv/bin/activate
          nohup python -m uvicorn chat_shell.main:app --host 0.0.0.0 --port 8100 > chat_shell.log 2>&1 &
          echo $! > chat_shell.pid

      - name: Start frontend server
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: 1
          RUNTIME_INTERNAL_API_URL: http://localhost:8000
          RUNTIME_SOCKET_DIRECT_URL: http://localhost:8000
        run: ../.github/scripts/start-frontend-e2e-server.sh

      - name: Start Mock Model Server
        working-directory: ./frontend
        run: |
          pnpm exec tsx e2e/utils/mock-model-server.ts > mock-model-server.log 2>&1 &
          echo $! > mock-server.pid

      - name: Start Local ClaudeCode Executor
        env:
          EXECUTOR_MODE: local
          WEGENT_BACKEND_URL: http://localhost:8000
          DEVICE_ID: e2e-claudecode-device
          DEVICE_NAME: E2E ClaudeCode Device
          DEVICE_TYPE: app
          BIND_SHELL: claudecode
          WEGENT_EXECUTOR_HOME: ${{ runner.temp }}/wegent-executor
          LOCAL_WORKSPACE_ROOT: ${{ runner.temp }}/wegent-workspace
          WORKSPACE_ROOT: ${{ runner.temp }}/wegent-workspace
          LOCAL_HEARTBEAT_INTERVAL: "5"
          LOG_LEVEL: info
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY: "1"
          CLAUDE_CODE_DISABLE_NONSTREAMING_FALLBACK: "1"
          CLAUDE_CODE_INCLUDE_CO_AUTHORED_BY: "false"
        run: |
          for i in {1..120}; do
            if curl -sf http://localhost:8000/api/docs >/dev/null; then
              break
            fi
            sleep 1
          done
          TOKEN=$(python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          API_BASE_URL = "http://localhost:8000/api"
          ADMIN_PASSWORD = os.environ["E2E_BOOTSTRAP_ADMIN_PASSWORD"]


          def request_json(path, *, method="GET", payload=None, allowed_statuses=()):
              data = None
              headers = {"Content-Type": "application/json"}
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  f"{API_BASE_URL}{path}",
                  data=data,
                  headers=headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code in allowed_statuses:
                      return None
                  body = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"{method} {path} failed with HTTP {error.code}: {body}"
                  ) from error


          request_json(
              "/auth/admin-password/setup",
              method="POST",
              payload={"password": ADMIN_PASSWORD},
              allowed_statuses=(409,),
          )

          token_response = request_json(
              "/auth/login",
              method="POST",
              payload={"user_name": "admin", "password": ADMIN_PASSWORD},
          )
          print(token_response["access_token"])
          PY
          )
          test -x executor/target/release/wegent-executor
          nohup env \
            -u GIT_TOKEN_AES_KEY \
            -u GIT_TOKEN_AES_IV \
            WEGENT_AUTH_TOKEN="$TOKEN" \
            executor/target/release/wegent-executor > executor/local-executor.log 2>&1 &
          echo $! > executor/local-executor.pid

      - name: Start Executor Manager
        working-directory: ./executor_manager
        env:
          REDIS_URL: redis://localhost:6379/0
          EXECUTOR_IMAGE: ${{ needs.build-executor-e2e-runtime.outputs.artifact == 'true' && 'wegent/e2e-claudecode-executor:latest' || needs.build-executor-e2e-runtime.outputs.image }}
          EXECUTOR_PORT_RANGE_MIN: "12000"
          EXECUTOR_PORT_RANGE_MAX: "12100"
          EXECUTOR_READY_MAX_RETRIES: "90"
          EXECUTOR_READY_INTERVAL: "1"
          SANDBOX_READY_MAX_RETRIES: "90"
          SANDBOX_READY_INTERVAL: "1"
          EXECUTOR_MANAGER_CALLBACK_URL: http://localhost:8001/executor-manager/callback
          DOCKER_HOST_ADDR: localhost
          NETWORK: bridge
          SERVICE_POOL: e2e-executor
          EXECUTOR_WORKSPACE: ${{ runner.temp }}/wegent-executor-workspace
          OTEL_ENABLED: "false"
        run: |
          mkdir -p "${EXECUTOR_WORKSPACE}"
          source .venv/bin/activate
          nohup uvicorn main:app --host 0.0.0.0 --port 8001 > executor_manager.log 2>&1 &
          echo $! > executor_manager.pid

      - name: Wait for services
        run: |
          wait_for_url() {
            local url="$1"
            for i in {1..120}; do
              if curl -sf "$url" >/dev/null; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          wait_for_url http://localhost:8000/api/docs \
            && wait_for_url http://localhost:8100/health \
            && wait_for_url http://localhost:3000 \
            && wait_for_url http://localhost:9999/health \
            && wait_for_url http://localhost:8001/health \
            || (cat backend/backend.log && cat backend/chat_shell.log && cat frontend/next-dev.log && cat frontend/mock-model-server.log && cat executor/local-executor.log && cat executor_manager/executor_manager.log && exit 1)

      - name: Verify backend is running
        run: |
          curl -f http://localhost:8000/api/docs > /dev/null 2>&1 || (cat backend/backend.log && exit 1)

      - name: Verify Chat Shell is running
        run: |
          curl -f http://localhost:8100/health > /dev/null 2>&1 || (cat backend/chat_shell.log && exit 1)

      - name: Run Executor E2E tests
        env:
          PLATFORM_E2E_IMAGE: ${{ needs.prepare-platform-e2e-image.outputs.image }}
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:8000
          E2E_USE_ISOLATED_USERS: "false"
          MOCK_MODEL_SERVER_URL: http://localhost:9999
          E2E_LOCAL_CLAUDE_MODEL_SERVER_URL: http://localhost:9999
          E2E_CLAUDE_EXECUTOR_IMAGE: ${{ needs.build-executor-e2e-runtime.outputs.artifact == 'true' && 'wegent/e2e-claudecode-executor:latest' || needs.build-executor-e2e-runtime.outputs.image }}
          E2E_DEVICE_ID: e2e-claudecode-device
          CI: true
        run: |
          repository_name="${GITHUB_REPOSITORY##*/}"
          container_workspace="/__w/$repository_name/$repository_name"
          docker run --rm \
            --network host \
            --ipc host \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$GITHUB_WORKSPACE:$container_workspace" \
            --workdir "$container_workspace/frontend" \
            --env E2E_INTERNAL_SERVICE_TOKEN \
            --env INTERNAL_SERVICE_TOKEN \
            --env CHAT_SHELL_REMOTE_STORAGE_TOKEN \
            --env CHAT_SHELL_INTERNAL_SERVICE_TOKEN \
            --env E2E_BOOTSTRAP_ADMIN_PASSWORD \
            --env E2E_ADMIN_PASSWORD \
            --env GIT_TOKEN_AES_KEY \
            --env GIT_TOKEN_AES_IV \
            --env E2E_BASE_URL \
            --env E2E_API_URL \
            --env E2E_USE_ISOLATED_USERS \
            --env MOCK_MODEL_SERVER_URL \
            --env E2E_CLAUDE_MODEL_SERVER_URL \
            --env E2E_LOCAL_CLAUDE_MODEL_SERVER_URL \
            --env E2E_CLAUDE_EXECUTOR_IMAGE \
            --env E2E_DEVICE_ID \
            --env CI \
            "$PLATFORM_E2E_IMAGE" \
            pnpm exec playwright test --project=executor-chromium

      - name: Stop Local ClaudeCode Executor
        if: always()
        run: |
          if [ -f executor/local-executor.pid ]; then
            kill $(cat executor/local-executor.pid) 2>/dev/null || true
            rm executor/local-executor.pid
          fi

      - name: Stop frontend dev server
        if: always()
        working-directory: ./frontend
        run: |
          if [ -f next-dev.pid ]; then
            kill $(cat next-dev.pid) 2>/dev/null || true
            rm next-dev.pid
          fi

      - name: Stop Executor Manager
        if: always()
        working-directory: ./executor_manager
        run: |
          if [ -f executor_manager.pid ]; then
            kill $(cat executor_manager.pid) 2>/dev/null || true
            rm executor_manager.pid
          fi

      - name: Remove Executor Manager Containers
        if: always()
        run: |
          docker ps -aq --filter label=owner=executor_manager | xargs -r docker rm -f

      - name: Stop Mock Model Server
        if: always()
        working-directory: ./frontend
        run: |
          if [ -f mock-server.pid ]; then
            kill $(cat mock-server.pid) 2>/dev/null || true
            rm mock-server.pid
          fi

      - name: Stop Chat Shell server
        if: always()
        working-directory: ./backend
        run: |
          if [ -f chat_shell.pid ]; then
            kill $(cat chat_shell.pid) 2>/dev/null || true
            rm chat_shell.pid
          fi

      - name: Upload executor test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blob-report-executor
          path: frontend/blob-report/
          retention-days: 14

      - name: Upload executor test traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-traces-executor
          path: frontend/test-results/
          retention-days: 7

      - name: Upload executor logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-logs-executor
          path: |
            backend/backend.log
            backend/chat_shell.log
            frontend/next-dev.log
            frontend/mock-model-server.log
            executor/local-executor.log
            executor_manager/executor_manager.log
          retention-days: 7

  # Merge test reports from all E2E jobs
  merge-reports:
    name: Merge Test Reports
    needs: [changes, e2e-tests, executor-e2e-tests]
    if: always() && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.changes.outputs.platform_e2e == 'true'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Download shard 1 blob report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: blob-report-1
          path: all-blob-reports

      - name: Download shard 2 blob report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: blob-report-2
          path: all-blob-reports

      - name: Download shard 3 blob report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: blob-report-3
          path: all-blob-reports

      - name: Download shard 4 blob report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: blob-report-4
          path: all-blob-reports

      - name: Download executor blob report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: blob-report-executor
          path: all-blob-reports

      - name: Merge reports
        working-directory: ./frontend
        run: pnpm exec playwright merge-reports --reporter html ../all-blob-reports

      - name: Upload merged report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report-merged
          path: frontend/playwright-report/
          retention-days: 30

  platform-e2e-summary:
    name: Platform E2E Summary
    needs:
      - changes
      - build-frontend-e2e
      - build-executor-e2e-runtime
      - e2e-tests
      - executor-e2e-tests
      - merge-reports
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check Platform E2E results
        env:
          RUN_E2E: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.changes.outputs.platform_e2e == 'true') }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_BUILD_RESULT: ${{ needs.build-frontend-e2e.result }}
          EXECUTOR_BUILD_RESULT: ${{ needs.build-executor-e2e-runtime.result }}
          PLATFORM_E2E_RESULT: ${{ needs.e2e-tests.result }}
          EXECUTOR_E2E_RESULT: ${{ needs.executor-e2e-tests.result }}
          REPORT_RESULT: ${{ needs.merge-reports.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Platform E2E change detection completed with: $CHANGES_RESULT"
            exit 1
          fi

          if [[ "$RUN_E2E" != "true" ]]; then
            echo "Platform E2E is not required for this pull request"
            exit 0
          fi

          assert_success() {
            local result="$1"
            local name="$2"
            if [[ "$result" != "success" ]]; then
              echo "$name completed with: $result"
              exit 1
            fi
          }

          assert_success "$FRONTEND_BUILD_RESULT" "Frontend E2E build"
          assert_success "$EXECUTOR_BUILD_RESULT" "Executor E2E build"
          assert_success "$PLATFORM_E2E_RESULT" "Platform E2E"
          assert_success "$EXECUTOR_E2E_RESULT" "Executor E2E"
          assert_success "$REPORT_RESULT" "E2E report merge"
