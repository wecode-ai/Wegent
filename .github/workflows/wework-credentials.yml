name: Wework native credentials

on:
  pull_request:
    paths:
      - "wework/electron/**"
      - "packages/chat-core/src/codex-catalog.ts"
      - "shared/assets/codex-models/**"
      - "executor/src/server/model_credentials.rs"
      - ".github/workflows/wework-credentials.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-credentials:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CI: "true"
      ELECTRON_RUN_AS_NODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install locked Electron dependencies and compile the Host
        run: |
          pnpm --dir wework/electron install --frozen-lockfile
          pnpm --dir wework/electron run build
      - name: Verify native credential APIs on macOS and Windows
        if: runner.os != 'Linux'
        run: pnpm --dir wework/electron exec electron scripts/verify-native-credentials.mjs
      - name: Verify the full historical upgrade and every native failure boundary
        run: pnpm --dir wework/electron exec vitest run src/host/credential-upgrade.test.ts src/host/model-configuration-recovery.test.ts src/host/model-configuration-capabilities.test.ts
      - name: Verify a real Linux Secret Service in an isolated D-Bus session
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dbus gnome-keyring
          dbus-run-session -- bash -eu -c '
            taskSecretDirectory=$(mktemp -d)
            trap '\''rm -rf "$taskSecretDirectory"'\'' EXIT
            printf "\n" | XDG_DATA_HOME="$taskSecretDirectory" gnome-keyring-daemon --unlock --components=secrets >/dev/null
            pnpm --dir wework/electron exec electron scripts/verify-native-credentials.mjs
          '
