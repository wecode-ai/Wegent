name: Tests

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'ci:all' && github.run_id || 'code' }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'ci:all'
    name: Detect CI Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      backend_rs: ${{ steps.classify.outputs.backend_rs }}
      executor: ${{ steps.classify.outputs.executor }}
      executor_manager: ${{ steps.classify.outputs.executor_manager }}
      shared: ${{ steps.classify.outputs.shared }}
      knowledge_engine: ${{ steps.classify.outputs.knowledge_engine }}
      frontend: ${{ steps.classify.outputs.frontend }}
      wework: ${{ steps.classify.outputs.wework }}
      wegent_cli: ${{ steps.classify.outputs.wegent_cli }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORCE_ALL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:all') }}
        run: |
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            # Always verify Backend and Rust against the queued merge commit.
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "backend_rs=true" >> "$GITHUB_OUTPUT"
          elif [[ "$FORCE_ALL" == "true" ]]; then
            # ci:all is the explicit full-regression path.
            .github/scripts/classify-ci-changes.sh --all
          else
            git diff --name-only "$BASE_SHA...$HEAD_SHA" |
              .github/scripts/classify-ci-changes.sh
          fi

  test-backend:
    name: Test Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      BACKEND_GUARD_TESTS: >-
        tests/test_collaboration_permission_guard.py
        tests/api/test_collaboration_permission_contract.py
        tests/api/test_collaboration_permission_resources.py
        tests/api/test_loop_item_reorder_permissions.py
        tests/api/test_workspace_shared_agents.py
        tests/models/test_collaboration_permission_compatibility.py
        tests/test_startup_migration_failure.py
        tests/services/test_runner_routing.py

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.11 and uv
        uses: ./.github/actions/setup-python-uv-cache
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --dev

      - name: Install runtime dependencies for index-to-query contract tests
        run: uv sync --project knowledge_runtime --frozen

      - name: Guard approved collaboration permission invariants
        working-directory: ./backend
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p ../.ci-artifacts/backend-tests
          read -r -a guard_tests <<< "$BACKEND_GUARD_TESTS"
          uv run pytest "${guard_tests[@]}" -n 0 --cov=app --cov-report= --durations=40 \
            --junitxml=../.ci-artifacts/backend-tests/guard-results.xml
          git rev-parse HEAD > ../.ci-artifacts/backend-tests/guard.sha.txt

      - name: Run backend tests
        working-directory: ./backend
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test -f .coverage
          test "$(cat ../.ci-artifacts/backend-tests/guard.sha.txt)" = "$(git rev-parse HEAD)"
          read -r -a guard_tests <<< "$BACKEND_GUARD_TESTS"
          ignore_guards=("${guard_tests[@]/#/--ignore=}")
          mkdir -p ../.ci-artifacts/backend-tests
          git rev-parse HEAD > ../.ci-artifacts/backend-tests/sha.txt
          # These read-only schema assertions share one worker's production OpenAPI cache.
          command=(uv run pytest tests/ "${ignore_guards[@]}" --dist=loadgroup --cov=app --cov-append --durations=40 \
            --cov-report=xml --cov-report=term-missing -v \
            --junitxml=../.ci-artifacts/backend-tests/results.xml)
          printf '%q ' "${command[@]}" > ../.ci-artifacts/backend-tests/command.txt
          printf '\n' >> ../.ci-artifacts/backend-tests/command.txt
          "${command[@]}" \
            2>&1 | tee ../.ci-artifacts/backend-tests/pytest.log

      - name: Upload backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-evidence
          path: .ci-artifacts/backend-tests/
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

  test-backend-rs:
    name: Test Backend Rust
    needs: changes
    if: needs.changes.outputs.backend_rs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      WEGENT_TEST_MYSQL_ADDRESS: 127.0.0.1:3306
      WEGENT_TEST_REDIS_ADDRESS: 127.0.0.1:6379
      WEGENT_TEST_REDIS_REPLICA_ADDRESS: 127.0.0.1:6380
      WEGENT_TEST_REDIS_REPLICA_PRIMARY: redis:6379
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis-replica:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      mysql:
        image: mysql:8.0.25
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python and uv for gateway tests
        uses: ./.github/actions/setup-python-uv-cache
        with:
          python-version: "3.11"

      - name: Prepare stdlib-only Python environment for gateway tests
        run: uv venv --python 3.11 backend/.venv

      - name: Set up shared Rust toolchain and cache
        uses: ./.github/actions/setup-rust-cache
        with:
          manifest-path: backend-rs/Cargo.toml
          components: rustfmt, clippy

      - name: Check Rust backend formatting
        working-directory: backend-rs
        run: cargo fmt --all --check

      - name: Record signal runtime for gateway tests
        run: /bin/kill --version

      - name: Check shared Rust library formatting and tests
        run: |
          cargo fmt --manifest-path shared/rust/Cargo.toml --all --check
          cargo test --manifest-path shared/rust/Cargo.toml --locked
          cargo clippy --manifest-path shared/rust/Cargo.toml --all-targets --locked -- -D warnings

      - name: Run Rust backend tests
        working-directory: backend-rs
        run: |
          set -o pipefail
          mkdir -p ../.ci-artifacts/backend-rs-tests
          git rev-parse HEAD > ../.ci-artifacts/backend-rs-tests/sha.txt
          echo 'cargo test --locked' > ../.ci-artifacts/backend-rs-tests/command.txt
          cargo test --locked 2>&1 | tee ../.ci-artifacts/backend-rs-tests/cargo-test.log

      - name: Verify Socket.IO device heartbeat with Redis
        working-directory: backend-rs
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
          WEGENT_BACKEND_RS_ENV_FILE: /dev/null
          SECRET_KEY: heartbeat-e2e-signing-key
        run: |
          set -o pipefail
          cargo test --locked --test device_heartbeat_redis -- --ignored --nocapture 2>&1 | tee ../.ci-artifacts/backend-rs-tests/device-heartbeat-redis.log

      - name: Verify streaming activity recovery with Redis
        working-directory: backend-rs
        env:
          WEGENT_TEST_REDIS_ADDRESS: 127.0.0.1:6379
          RUNNER_RESOURCE_LOG_PATH: ../.ci-artifacts/backend-rs-tests/streaming-activity-resources.jsonl
          RUNNER_PROCESS_DIAGNOSTICS: "1"
          RUNNER_RESOURCE_SAMPLE_INTERVAL_MS: "100"
          REDIS_CONTAINER_ID: ${{ job.services.redis.id }}
        run: |
          set -o pipefail
          bash ../.github/scripts/run-with-redis-monitor.sh "$REDIS_CONTAINER_ID" \
            ../.ci-artifacts/backend-rs-tests/streaming-activity-redis-arrivals.log \
            node ../.github/scripts/run-with-resource-logging.mjs \
            cargo test --locked --lib streaming_activity_redis_tests -- --ignored --test-threads=1 \
            2>&1 | tee ../.ci-artifacts/backend-rs-tests/streaming-activity-redis.log

      - name: Test Git connection inbox against real Redis
        working-directory: backend-rs
        env:
          GIT_INBOX_TEST_REDIS_ENDPOINT: 127.0.0.1:6379
        run: |
          set -o pipefail
          cargo test --locked --lib git_connection_inbox::store::redis_tests -- --ignored --test-threads=1 \
            2>&1 | tee ../.ci-artifacts/backend-rs-tests/git-inbox-redis.log

      - name: Verify native MySQL schema lifecycle and initialization
        working-directory: backend-rs
        run: |
          set -o pipefail
          cargo test --locked --lib migrations::mysql_tests -- --ignored --nocapture \
            2>&1 | tee ../.ci-artifacts/backend-rs-tests/migrations-mysql.log

      - name: Verify account HTTP plugin snapshots without Device registration
        working-directory: backend-rs
        env:
          PLUGIN_LOCAL_SYNC_ENABLED: "true"
          WEWORK_PLUGIN_CREDENTIAL_KEYS: '{"native-test":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}'
          WEWORK_PLUGIN_CREDENTIAL_ACTIVE_KEY_ID: native-test
          SECRET_KEY: plugin-local-contract-test
          DATABASE_URL: mysql://root@127.0.0.1:3306/mysql
          REDIS_URL: redis://127.0.0.1:6379/0
          WEGENT_BACKEND_RS_ENV_FILE: /dev/null
          EXECUTOR_MANAGER_URL: http://127.0.0.1:1
        run: |
          set -o pipefail
          cargo test --locked --lib plugins_installed::local_sync::mysql_tests -- --ignored --nocapture \
            2>&1 | tee ../.ci-artifacts/backend-rs-tests/plugin-local-sync-mysql.log
          cargo test --locked --lib plugin_account_auth::local_http::mysql_tests -- --ignored --nocapture \
            2>&1 | tee ../.ci-artifacts/backend-rs-tests/plugin-native-auth-mysql.log

      - name: Verify plugin write leases with real Redis replication and MySQL
        working-directory: backend-rs
        run: |
          set -o pipefail
          cargo test --locked --lib plugins_installed::auto_update::auto_update_mysql_tests -- --ignored --nocapture --test-threads=1 \
            2>&1 | tee ../.ci-artifacts/backend-rs-tests/plugin-write-replica-mysql.log

      - name: Verify attachment API key authentication with MySQL
        working-directory: backend-rs
        run: |
          set -o pipefail
          cargo test --locked --lib attachments_task_all::auth::mysql_tests -- --ignored \
            2>&1 | tee ../.ci-artifacts/backend-rs-tests/attachment-auth-mysql.log

      - name: Verify handoff title search with MySQL
        working-directory: backend-rs
        run: |
          set -o pipefail
          cargo test --locked --lib tasks_search::mysql_tests -- --ignored \
            2>&1 | tee ../.ci-artifacts/backend-rs-tests/tasks-search-mysql.log

      - name: Verify assignment index schema compatibility with MySQL
        working-directory: backend-rs
        run: |
          set -o pipefail
          cargo test --locked --lib loop_tasks::assignment_index::mysql_tests -- --ignored \
            2>&1 | tee ../.ci-artifacts/backend-rs-tests/assignment-index-mysql.log
          cargo test --locked --lib loop_tasks::human_requests::mysql_tests -- --ignored \
            2>&1 | tee ../.ci-artifacts/backend-rs-tests/human-requests-mysql.log

      - name: Verify batched project roster permission compatibility with MySQL
        working-directory: backend-rs
        run: |
          set -o pipefail
          cargo test --locked --lib cloud_projects::members::roster_mysql_tests -- --ignored \
            2>&1 | tee ../.ci-artifacts/backend-rs-tests/project-roster-mysql.log

      - name: Verify project coordination binding ownership and revocation with MySQL
        working-directory: backend-rs
        run: |
          set -o pipefail
          cargo test --locked --lib project_coordination::mysql_tests -- --ignored \
            2>&1 | tee ../.ci-artifacts/backend-rs-tests/project-coordination-mysql.log

      - name: Verify Responses HTTP E2E with large JSON and long conversations
        working-directory: backend-rs
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/mysql
          REDIS_URL: redis://127.0.0.1:6379/0
          WEGENT_BACKEND_RS_ENV_FILE: /dev/null
          RATE_LIMIT_GET_RESPONSE: 120/minute
          EXECUTOR_MANAGER_URL: http://127.0.0.1:1
          SECRET_KEY: responses-fixture-signing-key
        run: |
          set -o pipefail
          cargo test --locked --test responses_large_json -- --ignored --test-threads=1 --nocapture 2>&1 | tee ../.ci-artifacts/backend-rs-tests/responses-mysql.log

      - name: Verify assignment read-only HTTP E2E
        working-directory: backend-rs
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/mysql
          REDIS_URL: redis://127.0.0.1:6379/0
          WEGENT_BACKEND_RS_ENV_FILE: /dev/null
          EXECUTOR_MANAGER_URL: http://127.0.0.1:1
          SECRET_KEY: assignment-e2e-signing-key
          WEGENT_E2E_LOG_DIRECTORY: ../.ci-artifacts/backend-rs-tests/assignments-http
        run: |
          set -o pipefail
          cargo test --locked --test assignments_read_only -- --ignored --test-threads=1 --nocapture 2>&1 | tee ../.ci-artifacts/backend-rs-tests/assignments-http.log

      - name: Upload Rust backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-rs-test-evidence
          path: .ci-artifacts/backend-rs-tests/
          if-no-files-found: error

      - name: Check Rust backend lints
        working-directory: backend-rs
        run: cargo clippy --locked --all-targets -- -D warnings

  test-plugin-auth-mysql:
    name: Test Backend MySQL Regressions
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: plugin_auth_test
          MYSQL_DATABASE: plugin_auth_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pplugin_auth_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-uv-cache
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: uv sync --dev
      - name: Verify real Redis and InnoDB plugin write races
        working-directory: backend
        env:
          PLUGIN_AUTH_MYSQL_TEST_URL: mysql+pymysql://root:plugin_auth_test@127.0.0.1:3306/plugin_auth_test
          PLUGIN_AUTH_REDIS_TEST_URL: redis://127.0.0.1:6379/15
        run: uv run pytest integration_checks/test_plugin_account_auth_mysql.py integration_checks/test_plugin_write_races_mysql.py integration_checks/test_plugin_connection_requests_mysql.py integration_checks/test_plugin_policy_bootstrap_mysql.py -n 0

      - name: Verify MCP OAuth refresh and authorization races with InnoDB and Redis
        working-directory: backend
        env:
          MCP_OAUTH_TEST_MYSQL_URL: mysql+pymysql://root:plugin_auth_test@127.0.0.1:3306/plugin_auth_test
          MCP_OAUTH_TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: uv run pytest integration_checks/test_user_mcp_oauth_mysql.py -n 0 --junitxml=reports/mcp-oauth-mysql.xml

      - name: Upload MCP OAuth concurrency results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-oauth-mysql-results
          path: backend/reports/mcp-oauth-mysql.xml
          if-no-files-found: error

      - name: Verify share-token upgrade and old-writer storage compatibility
        working-directory: backend
        env:
          SHARE_TOKEN_TEST_MYSQL_URL: mysql+pymysql://root:plugin_auth_test@127.0.0.1:3306/plugin_auth_test
          PYTHONPATH: .:..
        run: uv run --no-sync python tests/integration/secure_share_tokens_mysql.py

      - name: Verify namespace grants with MySQL connection collations
        working-directory: backend
        env:
          TEAM_NAMESPACE_MYSQL_TEST_URL: mysql+pymysql://root:plugin_auth_test@127.0.0.1:3306/plugin_auth_test
        run: uv run pytest integration_checks/test_team_namespace_collation_mysql.py -n 0

      - name: Verify populated legacy MySQL collaboration permission compatibility
        working-directory: backend
        env:
          COLLABORATION_PERMISSION_MYSQL_TEST_URL: mysql+pymysql://root:plugin_auth_test@127.0.0.1:3306/plugin_auth_test
        run: uv run pytest integration_checks/test_collaboration_permission_mysql.py integration_checks/test_rust_collaboration_permissions_mysql.py integration_checks/test_rust_runtime_binding_identity_mysql.py -n 0

  test-executor:
    name: Test Executor
    needs: changes
    if: needs.changes.outputs.executor == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_PROFILE_TEST_DEBUG: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up shared Rust toolchain and cache
        uses: ./.github/actions/setup-rust-cache
        with:
          manifest-path: executor/Cargo.toml
          components: rustfmt, clippy

      - name: Install executor Rust system dependencies
        run: .github/scripts/install-executor-rust-system-dependencies.sh

      - name: Verify Cargo worktree build isolation
        run: bash scripts/tests/cargo-cache.test.sh

      - name: Run executor Rust format check
        working-directory: ./executor
        run: cargo fmt --all --check

      - name: Run executor Rust tests
        working-directory: ./executor
        run: cargo test --all-features

      - name: Run executor Rust clippy
        working-directory: ./executor
        run: cargo clippy --all-targets --all-features -- -D warnings

  test-executor-manager:
    name: Test Executor Manager
    needs: changes
    if: needs.changes.outputs.executor_manager == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 and uv
        uses: ./.github/actions/setup-python-uv-cache
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ./executor_manager
        run: uv sync --dev

      - name: Run executor manager tests
        working-directory: ./executor_manager
        env:
          PYTHONPATH: ${{ github.workspace }}
          COVERAGE_CORE: sysmon
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: uv run pytest tests/ --cov=executors --cov-report=xml --cov-report=term-missing -v -s

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./executor_manager/coverage.xml
          flags: executor-manager
          name: executor-manager-coverage

  test-executor-local-auth-platforms:
    name: Test Executor Platform Regressions (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.executor == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    env:
      CARGO_PROFILE_TEST_DEBUG: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Windows executor installer release selection
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/test-local-executor-installer.ps1

      - name: Set up shared Rust toolchain and cache
        uses: ./.github/actions/setup-rust-cache
        with:
          manifest-path: executor/Cargo.toml

      - name: Run local connector auth platform tests
        working-directory: ./executor
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/executor-target
        run: cargo test --all-features --lib runtime_work::local_connector_auth::tests

      - name: Run native file platform regressions
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ./executor
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/executor-target
        run: |
          cargo test --all-features --lib runtime_work::store::tests::atomic_write
          cargo test -p wegent-plugin-packages --all-features --lib local::capabilities::runtime_recovery::marketplace_sources::tests
          cargo test --all-features --lib claude_execution_home_publishes_runtime_selection_beyond_windows_max_path
          cargo test --manifest-path ../shared/rust/Cargo.toml -p wegent-filesystem --lib json_file::tests
          cargo test --all-features --lib effective_instructions_tests
          cargo test -p wegent-executor --all-features --lib side_source
          cargo test --manifest-path ../shared/rust/Cargo.toml -p wegent-filesystem atomic_file::tests
          cargo test -p wegent-workspace --lib workspace_files::tests
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cargo test -p wegent-workspace --lib turn_file_changes::git_capture::capture_tests
          fi

      - name: Run native worktree platform regressions
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ./executor
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/executor-target
        run: |
          cargo test --all-features --lib worktree_metadata_can_exceed_the_windows_max_path_limit
          cargo test --all-features --lib deferred_worktree_rebases_project_roots_using_path_identity
          cargo test -p wegent-executor --all-features --lib cleanup_waits_for_owned_git_on_exit_timeout_and_cancellation -- --nocapture
          cargo test -p wegent-workspace --all-features --lib pipe_lifetime_tests

      - name: Run native clone platform regressions
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ./executor
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/executor-target
        run: cargo test --all-features --lib clones_and_reuses_repositories_beyond_windows_max_path

      - name: Run bounded executor and interrupted Goal platform regressions
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ./executor
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/executor-target
        run: |
          cargo test --all-features --lib local::plugin_import::hash_tests
          cargo test --all-features --lib runtime_rpc_dispatch_fits_a_bounded_worker_stack
          cargo test --all-features --lib agents::codex::tests::stopping_
          cargo test --all-features --lib codex_app_server_starts_beyond_windows_max_path
          cargo test --all-features --lib agents::codex::home::auth_tests
          cargo test --all-features --lib agents::codex::auth_mode::tests
          cargo test --all-features --lib closed_notification_stream
          cargo test --all-features --lib stopped_active_goal_does_not_emit_a_terminal_result_or_discard_its_status

      - name: Set up Node for native package filesystem regressions
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run native managed package filesystem regressions
        if: ${{ !cancelled() }}
        run: node --experimental-strip-types --test wework/electron/src/runtime/managed-plugin-files.test.mjs

  test-shared:
    name: Test Shared
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10 and uv
        uses: ./.github/actions/setup-python-uv-cache
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: ./shared
        run: uv sync --dev

      - name: Run shared tests
        working-directory: ./shared
        env:
          COVERAGE_CORE: sysmon
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          # Run pytest and capture exit code, ignoring thread cleanup errors
          set +e
          uv run pytest tests/ --cov=utils --cov-config=.coveragerc --cov-report=xml --cov-report=term-missing -v -p no:cacheprovider 2>&1
          PYTEST_EXIT=$?
          set -e
          # Exit code 0 = success, others indicate test failures
          # Thread cleanup errors cause exit 134 but tests pass, so check coverage.xml exists
          if [ "$PYTEST_EXIT" -eq 0 ] || { [ "$PYTEST_EXIT" -eq 134 ] && [ -f coverage.xml ]; }; then
            echo "Tests completed successfully"
            exit 0
          else
            echo "Tests failed with exit code $PYTEST_EXIT"
            exit "$PYTEST_EXIT"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./shared/coverage.xml
          flags: shared
          name: shared-coverage

  test-knowledge-engine:
    name: Test Knowledge Engine and Runtime
    needs: changes
    if: needs.changes.outputs.knowledge_engine == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12 and uv
        uses: ./.github/actions/setup-python-uv-cache
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ./knowledge_engine
        run: uv sync --dev

      - name: Run knowledge engine tests
        working-directory: ./knowledge_engine
        env:
          COVERAGE_CORE: sysmon
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: uv run pytest tests/ --cov=knowledge_engine --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./knowledge_engine/coverage.xml
          flags: knowledge-engine
          name: knowledge-engine-coverage

      - name: Install knowledge runtime test dependencies
        working-directory: ./knowledge_runtime
        run: uv sync --dev --frozen

      - name: Run knowledge runtime tests
        working-directory: ./knowledge_runtime
        run: uv run --no-sync pytest tests/ -v

  test-frontend:
    name: Test Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Run chat core tests
        run: pnpm --filter @wegent/chat-core test

      - name: Verify shared collaboration types and permission UI regressions
        run: |
          pnpm --filter @wegent/collaboration build
          pnpm --filter @wegent/collaboration test

      - name: Run frontend tests
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm --filter wecode-ai-assistant run test --coverage --passWithNoTests

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage

  test-wework:
    name: Test Wework (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.wework == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Restore verified Electron installer cache
        if: matrix.shard == 1
        uses: ./.github/actions/prepare-electron-installer-cache

      - name: Prepare Wework Electron dependencies
        if: matrix.shard == 1
        env:
          WEWORK_ELECTRON_DEPENDENCIES_READY: "true"
        run: pnpm --filter wework prepare:electron

      - name: Install Wework host modules for renderer fixtures
        if: matrix.shard != 1
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm --dir wework/electron install --frozen-lockfile

      - name: Run process explorer package tests
        if: matrix.shard == 1
        run: |
          pnpm --filter @wegent/process-explorer typecheck
          pnpm --filter @wegent/process-explorer test

      - name: Run Wework DSH Node tests
        if: matrix.shard == 1
        working-directory: ./wework
        run: |
          mapfile -d '' -t tests < <(find dsh -name '*.test.mjs' -print0)
          if ((${#tests[@]} == 0)); then
            echo 'No DSH tests found' >&2
            exit 1
          fi
          node --test "${tests[@]}"

      - name: Verify immutable upgrade artifact consumption
        if: matrix.shard == 1
        run: node --test wework/scripts/published-desktop-release.test.mjs wework/scripts/portable-desktop-release.test.mjs wework/e2e/desktop/modules/inspect-before-start.test.mjs wework/e2e/desktop/modules/macos-status-item.test.mjs wework/e2e/desktop/modules/desktop-build-flows.test.mjs wework/e2e/desktop/modules/failure-followup.test.mjs wework/e2e/desktop/modules/voice-toolbar-flow.test.mjs wework/e2e/desktop/modules/electron-launch-arguments.test.mjs

      - name: Verify startup theme evidence
        if: matrix.shard == 1
        run: node --test wework/scripts/startup-theme-evidence.test.mjs wework/scripts/windows-native-runtime.test.mjs

      - name: Verify isolated Electron update transport
        if: matrix.shard == 1
        run: |
          source .github/scripts/lib/apt-packages.sh
          mapfile -t missing < <(find_missing_apt_packages gdb)
          if ((${#missing[@]})); then
            bash .github/scripts/install-e2e-apt-packages.sh "${missing[@]}"
          fi
          sudo -n gdb --version
          sudo install -m 644 .github/ci/wework-electron.apparmor /etc/apparmor.d/wework-electron-ci
          sudo apparmor_parser --replace /etc/apparmor.d/wework-electron-ci
          dbus-run-session -- xvfb-run -a node --test wework/e2e/desktop/modules/upgrade-request-route.test.mjs

      - name: Verify measured Wework test sharding
        if: matrix.shard == 1
        run: node --test wework/scripts/ci-test-sequencer.test.mjs

      - name: Verify delegated work command and history contracts
        if: matrix.shard == 1
        run: node --test wework/scripts/dots-command-result.test.mjs wework/scripts/dots-history-navigation.test.mjs

      - name: Run Wework tests
        env:
          TZ: Asia/Shanghai
          WEWORK_CI_BALANCED_SHARDS: "true"
          WEWORK_TEST_TIMING_FILE: ${{ runner.temp }}/wework-unit-timings.json
        run: |
          WEWORK_TEST_REPORT_FILE=../.ci-artifacts/wework-tests/renderer.xml \
          pnpm --filter wework exec vitest run \
            --passWithNoTests \
            --shard=${{ matrix.shard }}/4 &
          vitest_pid=$!

          electron_pid=
          if [[ "${{ matrix.shard }}" == "1" ]]; then
            WEWORK_TEST_REPORT_FILE=../../.ci-artifacts/wework-tests/electron.xml \
            pnpm --dir wework/electron test &
            electron_pid=$!
          fi

          status=0
          wait "$vitest_pid" || status=$?
          if [[ -n "$electron_pid" ]]; then
            wait "$electron_pid" || status=$?
          fi
          exit "$status"

      - name: Upload Wework unit timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wework-unit-timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/wework-unit-timings.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Wework test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wework-test-evidence-${{ matrix.shard }}
          path: .ci-artifacts/wework-tests/
          retention-days: 7

  test-wegent-cli:
    name: Test wegent CLI
    needs: changes
    if: needs.changes.outputs.wegent_cli == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Restore shared Python dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-wegent-cli-v2-${{ hashFiles('wegent-cli/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-wegent-cli-v2-

      - name: Install dependencies
        working-directory: ./wegent-cli
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Run wegent unit tests
        working-directory: ./wegent-cli
        run: |
          pytest tests/ --ignore=tests/test_integration.py --cov=wegent --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./wegent-cli/coverage.xml
          flags: wegent-cli
          name: wegent-cli-coverage

  test-wegent-cli-integration:
    name: Test wegent CLI Integration
    needs: changes
    if: needs.changes.outputs.wegent_cli == 'true'
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test123
          MYSQL_DATABASE: task_manager
          MYSQL_USER: task_user
          MYSQL_PASSWORD: task_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptest123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Generate internal service token
        run: |
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "INTERNAL_SERVICE_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10 and uv
        uses: ./.github/actions/setup-python-uv-cache
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        working-directory: ./backend
        run: uv sync

      - name: Install shared module
        run: |
          pip install ./shared || pip install cryptography

      - name: Start backend service
        working-directory: ./backend
        env:
          ENVIRONMENT: development
          DB_AUTO_MIGRATE: "True"
          DATABASE_URL: mysql+pymysql://task_user:task_pass@localhost:3306/task_manager
          SECRET_KEY: test-secret-key-for-ci
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 1440
          REDIS_URL: redis://localhost:6379/0
          INIT_DATA_ENABLED: "False"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for backend to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/api/health > /dev/null 2>&1; then
              echo "Backend is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Install wegent dependencies
        working-directory: ./wegent-cli
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run wegent integration tests
        working-directory: ./wegent-cli
        env:
          WEGENT_TEST_SERVER: http://localhost:8000
        run: |
          pytest tests/test_integration.py --integration -v

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        test-backend,
        test-backend-rs,
        test-plugin-auth-mysql,
        test-executor,
        test-executor-local-auth-platforms,
        test-executor-manager,
        test-shared,
        test-knowledge-engine,
        test-frontend,
        test-wework,
        test-wegent-cli,
        test-wegent-cli-integration,
      ]
    if: always() && !cancelled() && (github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'ci:all')

    steps:
      - name: Check test results
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "All test jobs completed"
          assert_result() {
            local expected="$1"
            local result="$2"
            local name="$3"
            if [[ "$expected" == "true" && "$result" != "success" ]]; then
              echo "$name was required but completed with: $result"
              exit 1
            fi
          }

          [[ "${{ needs.changes.result }}" == "success" ]]
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            # Missing outputs must not turn required merge checks into skips.
            [[ "${{ needs.changes.outputs.backend }}" == "true" ]]
            [[ "${{ needs.changes.outputs.backend_rs }}" == "true" ]]
          fi
          assert_result "${{ needs.changes.outputs.backend }}" "${{ needs.test-backend.result }}" "Backend tests"
          assert_result "${{ needs.changes.outputs.backend_rs }}" "${{ needs.test-backend-rs.result }}" "Backend Rust tests"
          assert_result "${{ needs.changes.outputs.backend }}" "${{ needs.test-plugin-auth-mysql.result }}" "Plugin auth MySQL transactions"
          assert_result "${{ needs.changes.outputs.executor }}" "${{ needs.test-executor.result }}" "Executor tests"
          assert_result "${{ needs.changes.outputs.executor }}" "${{ needs.test-executor-local-auth-platforms.result }}" "Executor local auth platform tests"
          assert_result "${{ needs.changes.outputs.executor_manager }}" "${{ needs.test-executor-manager.result }}" "Executor Manager tests"
          assert_result "${{ needs.changes.outputs.shared }}" "${{ needs.test-shared.result }}" "Shared tests"
          assert_result "${{ needs.changes.outputs.knowledge_engine }}" "${{ needs.test-knowledge-engine.result }}" "Knowledge Engine tests"
          assert_result "${{ needs.changes.outputs.frontend }}" "${{ needs.test-frontend.result }}" "Frontend tests"
          assert_result "${{ needs.changes.outputs.wework }}" "${{ needs.test-wework.result }}" "Wework tests"
          assert_result "${{ needs.changes.outputs.wegent_cli }}" "${{ needs.test-wegent-cli.result }}" "wegent CLI tests"
          assert_result "${{ needs.changes.outputs.wegent_cli }}" "${{ needs.test-wegent-cli-integration.result }}" "wegent CLI integration tests"
