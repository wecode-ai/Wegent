name: Tests

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect CI Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      executor: ${{ steps.classify.outputs.executor }}
      executor_manager: ${{ steps.classify.outputs.executor_manager }}
      shared: ${{ steps.classify.outputs.shared }}
      knowledge_engine: ${{ steps.classify.outputs.knowledge_engine }}
      frontend: ${{ steps.classify.outputs.frontend }}
      wework: ${{ steps.classify.outputs.wework }}
      wework_rust: ${{ steps.classify.outputs.wework_rust }}
      wegent_cli: ${{ steps.classify.outputs.wegent_cli }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          FORCE_ALL: ${{ github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'ci:all') }}
        run: |
          if [[ "$FORCE_ALL" == "true" ]]; then
            # Merge groups and ci:all force every module test.
            .github/scripts/classify-ci-changes.sh --all
          else
            git diff --name-only "$BASE_SHA...$HEAD_SHA" |
              .github/scripts/classify-ci-changes.sh
          fi

  test-backend:
    name: Test Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 and uv
        uses: ./.github/actions/setup-python-uv-cache
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --dev

      - name: Run backend tests
        working-directory: ./backend
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: uv run pytest tests/ --cov=app --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

  test-executor:
    name: Test Executor
    needs: changes
    if: needs.changes.outputs.executor == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_PROFILE_TEST_DEBUG: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure executor target directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/executor-target" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: rustfmt, clippy

      - name: Set up sccache
        uses: ./.github/actions/setup-sccache

      - name: Install executor Rust system dependencies
        run: .github/scripts/install-executor-rust-system-dependencies.sh

      - name: Restore shared executor Cargo sources
        id: executor-cargo-sources-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-executor-cargo-sources-v3-${{ hashFiles('executor/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-executor-cargo-sources-v3-

      - name: Run executor Rust format check
        working-directory: ./executor
        run: cargo fmt --check

      - name: Run executor Rust tests
        working-directory: ./executor
        run: cargo test --all-features

      - name: Run executor Rust clippy
        working-directory: ./executor
        run: cargo clippy --all-targets --all-features -- -D warnings

  test-executor-manager:
    name: Test Executor Manager
    needs: changes
    if: needs.changes.outputs.executor_manager == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 and uv
        uses: ./.github/actions/setup-python-uv-cache
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./executor_manager
        run: uv sync --dev

      - name: Run executor manager tests
        working-directory: ./executor_manager
        env:
          PYTHONPATH: ${{ github.workspace }}
          COVERAGE_CORE: sysmon
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: uv run pytest tests/ --cov=executors --cov-report=xml --cov-report=term-missing -v -s

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./executor_manager/coverage.xml
          flags: executor-manager
          name: executor-manager-coverage

  test-shared:
    name: Test Shared
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10 and uv
        uses: ./.github/actions/setup-python-uv-cache
        with:
          python-version: '3.10'

      - name: Install dependencies
        working-directory: ./shared
        run: uv sync --dev

      - name: Run shared tests
        working-directory: ./shared
        env:
          COVERAGE_CORE: sysmon
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          # Run pytest and capture exit code, ignoring thread cleanup errors
          set +e
          uv run pytest tests/ --cov=utils --cov-config=.coveragerc --cov-report=xml --cov-report=term-missing -v -p no:cacheprovider 2>&1
          PYTEST_EXIT=$?
          set -e
          # Exit code 0 = success, others indicate test failures
          # Thread cleanup errors cause exit 134 but tests pass, so check coverage.xml exists
          if [ "$PYTEST_EXIT" -eq 0 ] || { [ "$PYTEST_EXIT" -eq 134 ] && [ -f coverage.xml ]; }; then
            echo "Tests completed successfully"
            exit 0
          else
            echo "Tests failed with exit code $PYTEST_EXIT"
            exit "$PYTEST_EXIT"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./shared/coverage.xml
          flags: shared
          name: shared-coverage

  test-knowledge-engine:
    name: Test Knowledge Engine
    needs: changes
    if: needs.changes.outputs.knowledge_engine == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12 and uv
        uses: ./.github/actions/setup-python-uv-cache
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ./knowledge_engine
        run: uv sync --dev

      - name: Run knowledge engine tests
        working-directory: ./knowledge_engine
        env:
          COVERAGE_CORE: sysmon
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: uv run pytest tests/ --cov=knowledge_engine --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./knowledge_engine/coverage.xml
          flags: knowledge-engine
          name: knowledge-engine-coverage

  test-frontend:
    name: Test Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Run chat core tests
        run: pnpm --filter @wegent/chat-core test

      - name: Run frontend tests
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm --filter wecode-ai-assistant run test --coverage --passWithNoTests

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage

  test-wework:
    name: Test Wework
    needs: changes
    if: needs.changes.outputs.wework == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Run wework tests
        env:
          TZ: Asia/Shanghai
        run: pnpm --filter wework exec vitest run --coverage --passWithNoTests

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./wework/coverage/coverage-final.json
          flags: wework
          name: wework-coverage

  check-wework-windows-rust:
    name: Check Wework Windows Rust
    needs: changes
    if: needs.changes.outputs.wework_rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up sccache
        uses: ./.github/actions/setup-sccache

      - name: Restore shared Wework Cargo sources
        id: wework-cargo-sources-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-wework-cargo-sources-v2-${{ hashFiles('wework/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-wework-cargo-sources-v2-

      - name: Check Wework Rust for Windows
        working-directory: ./wework/src-tauri
        run: cargo check --locked --target x86_64-pc-windows-msvc

  test-wegent-cli:
    name: Test wegent CLI
    needs: changes
    if: needs.changes.outputs.wegent_cli == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Restore shared Python dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-wegent-cli-v2-${{ hashFiles('wegent-cli/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-wegent-cli-v2-

      - name: Install dependencies
        working-directory: ./wegent-cli
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Run wegent unit tests
        working-directory: ./wegent-cli
        run: |
          pytest tests/ --ignore=tests/test_integration.py --cov=wegent --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./wegent-cli/coverage.xml
          flags: wegent-cli
          name: wegent-cli-coverage

  test-wegent-cli-integration:
    name: Test wegent CLI Integration
    needs: changes
    if: needs.changes.outputs.wegent_cli == 'true'
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test123
          MYSQL_DATABASE: task_manager
          MYSQL_USER: task_user
          MYSQL_PASSWORD: task_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptest123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Generate internal service token
        run: |
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "INTERNAL_SERVICE_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10 and uv
        uses: ./.github/actions/setup-python-uv-cache
        with:
          python-version: '3.10'

      - name: Install backend dependencies
        working-directory: ./backend
        run: uv sync

      - name: Install shared module
        run: |
          pip install ./shared || pip install cryptography

      - name: Start backend service
        working-directory: ./backend
        env:
          ENVIRONMENT: development
          DB_AUTO_MIGRATE: "True"
          DATABASE_URL: mysql+pymysql://task_user:task_pass@localhost:3306/task_manager
          SECRET_KEY: test-secret-key-for-ci
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 1440
          REDIS_URL: redis://localhost:6379/0
          INIT_DATA_ENABLED: "False"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for backend to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/api/health > /dev/null 2>&1; then
              echo "Backend is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Install wegent dependencies
        working-directory: ./wegent-cli
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run wegent integration tests
        working-directory: ./wegent-cli
        env:
          WEGENT_TEST_SERVER: http://localhost:8000
        run: |
          pytest tests/test_integration.py --integration -v

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [changes, test-backend, test-executor, test-executor-manager, test-shared, test-knowledge-engine, test-frontend, test-wework, check-wework-windows-rust, test-wegent-cli, test-wegent-cli-integration]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "All test jobs completed"
          assert_result() {
            local expected="$1"
            local result="$2"
            local name="$3"
            if [[ "$expected" == "true" && "$result" != "success" ]]; then
              echo "$name was required but completed with: $result"
              exit 1
            fi
          }

          [[ "${{ needs.changes.result }}" == "success" ]]
          assert_result "${{ needs.changes.outputs.backend }}" "${{ needs.test-backend.result }}" "Backend tests"
          assert_result "${{ needs.changes.outputs.executor }}" "${{ needs.test-executor.result }}" "Executor tests"
          assert_result "${{ needs.changes.outputs.executor_manager }}" "${{ needs.test-executor-manager.result }}" "Executor Manager tests"
          assert_result "${{ needs.changes.outputs.shared }}" "${{ needs.test-shared.result }}" "Shared tests"
          assert_result "${{ needs.changes.outputs.knowledge_engine }}" "${{ needs.test-knowledge-engine.result }}" "Knowledge Engine tests"
          assert_result "${{ needs.changes.outputs.frontend }}" "${{ needs.test-frontend.result }}" "Frontend tests"
          assert_result "${{ needs.changes.outputs.wework }}" "${{ needs.test-wework.result }}" "Wework tests"
          assert_result "${{ needs.changes.outputs.wework_rust }}" "${{ needs.check-wework-windows-rust.result }}" "Wework Windows Rust check"
          assert_result "${{ needs.changes.outputs.wegent_cli }}" "${{ needs.test-wegent-cli.result }}" "wegent CLI tests"
          assert_result "${{ needs.changes.outputs.wegent_cli }}" "${{ needs.test-wegent-cli-integration.result }}" "wegent CLI integration tests"
