name: CI Cache Warmup

on:
  push:
    branches:
      - main
    paths:
      - ".github/actions/**"
      - ".github/claude-code-cli/**"
      - ".github/scripts/classify-ci-cache-warmup.sh"
      - ".github/scripts/frontend-e2e-build*.mjs"
      - ".github/scripts/macos-e2e-build*.mjs"
      - ".github/scripts/restore-macos-ci-build.mjs"
      - ".github/scripts/verified-build-oci.mjs"
      - ".github/scripts/restore-frontend-ci-build.mjs"
      - ".github/scripts/archive-frontend-e2e-build.sh"
      - ".github/scripts/restore-frontend-e2e-build.sh"
      - ".github/scripts/wework-windows-e2e-build-key.mjs"
      - ".github/scripts/archive-wework-core-e2e-build.sh"
      - ".github/scripts/restore-wework-core-e2e-build.sh"
      - ".github/scripts/wework-core-e2e-transport.mjs"
      - ".github/scripts/download-actions-artifact.sh"
      - ".github/scripts/publish-wework-core-e2e-build-oci.sh"
      - ".github/scripts/resolve-wework-core-e2e-build-ref.sh"
      - ".github/scripts/resolve-executor-e2e-runtime.sh"
      - ".github/scripts/restore-oci-runtime-binary.sh"
      - ".github/scripts/restore-wework-core-e2e-build-oci.sh"
      - ".github/scripts/install-executor-rust-system-dependencies.sh"
      - ".github/scripts/lib/apt-packages.sh"
      - ".github/workflows/ci-cache-warmup.yml"
      - ".github/workflows/e2e-tests.yml"
      - ".github/workflows/lint.yml"
      - ".github/workflows/test.yml"
      - ".github/workflows/wework-e2e.yml"
      - "backend-rs/**"
      - "backend/uv.lock"
      - "docker/wework-e2e/desktop.Dockerfile"
      - "executor/**"
      - "executor_manager/uv.lock"
      - "frontend/**"
      - "knowledge_engine/uv.lock"
      - ".github/runtime-images/**"
      - ".github/scripts/ci-prebuilt-images.*"
      - ".github/scripts/resolve-ci-image.*"
      - ".github/ci/prebuilt-images.json"
      - ".github/scripts/publish-ci-prebuild.sh"
      - ".github/scripts/restore-ci-downloads.sh"
      - "sdk/plugin-auth/**"
      - "sdk/plugin-creator/**"
      - ".github/ci/rust-toolchain"
      - ".cargo/**"
      - ".npmrc"
      - "package.json"
      - "packages/**"
      - "patches/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "shared/assets/**"
      - "shared/protocol/**"
      - "shared/rust/**"
      - "LICENSES/Apache-2.0.txt"
      - "shared/uv.lock"
      - "wegent-cli/requirements.txt"
      - "wework/**"
  workflow_dispatch:
    inputs:
      prebuild:
        description: Select the prebuilds to publish without running E2E.
        type: choice
        options: [linux, macos-runtimes, frontend]
        default: linux
      macos_runtime_source_run:
        description: Optional upstream Wework CI run whose successful macOS producer supplies the native binaries.
        type: string
        default: ""
      promote_macos_build:
        description: Also promote the complete App from the successful macOS source producer, without rebuilding it.
        type: boolean
        default: false
      frontend_build_source_run:
        description: Optional upstream E2E run whose successful frontend producer supplies a complete build.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-cache-warmup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Cache Changes
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.prebuild == 'linux')
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.classify.outputs.docker }}
      executor_rust: ${{ steps.classify.outputs.executor_rust }}
      backend_rs_rust: ${{ steps.classify.outputs.backend_rs_rust }}
      node: ${{ steps.classify.outputs.node }}
      python: ${{ steps.classify.outputs.python }}
      wework_target: ${{ steps.classify.outputs.wework_target }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify cache changes
        id: classify
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] ||
            [[ ! "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]] ||
            ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            .github/scripts/classify-ci-cache-warmup.sh --all
          else
            git diff --name-only "$BEFORE_SHA...$GITHUB_SHA" |
              .github/scripts/classify-ci-cache-warmup.sh
          fi

  warm-node:
    name: Warm Node and Next.js Caches
    needs: changes
    if: ${{ !cancelled() && ((github.ref == 'refs/heads/main' && needs.changes.outputs.node == 'true') || (github.event_name == 'workflow_dispatch' && inputs.prebuild == 'frontend')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up writable Node workspace cache
        uses: ./.github/actions/setup-node-workspace
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Add local harness CLIs to PATH
        run: |
          echo "$GITHUB_WORKSPACE/.github/claude-code-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Restore shared Claude Code CLI
        id: claude-code-cli-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .github/claude-code-cli/node_modules
          key: ${{ runner.os }}-node-24-local-harness-clis-v2-${{ hashFiles('.github/claude-code-cli/package.json', '.github/claude-code-cli/package-lock.json') }}

      - name: Install local harness CLIs
        if: steps.claude-code-cli-cache.outputs.cache-hit != 'true'
        run: npm ci --prefix .github/claude-code-cli --strict-allow-scripts

      - name: Verify local harness CLIs
        run: .github/scripts/verify-local-harness-clis.sh

      - name: Save shared local harness CLIs
        if: github.ref == 'refs/heads/main' && steps.claude-code-cli-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .github/claude-code-cli/node_modules
          key: ${{ steps.claude-code-cli-cache.outputs.cache-primary-key }}

      - name: Build or promote complete frontend output
        uses: ./.github/actions/build-frontend-e2e
        with:
          setup-workspace: "false"
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          publish: "true"
          source-run: ${{ inputs.frontend_build_source_run }}

  warm-python:
    name: Warm Python ${{ matrix.python-version }} Cache
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Python and writable uv cache
        uses: ./.github/actions/setup-python-uv-cache
        with:
          python-version: ${{ matrix.python-version }}
          save-cache: "true"

      - name: Populate Python dependency cache
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          case "$PYTHON_VERSION" in
            3.10)
              (cd shared && uv sync --dev)
              (cd backend && uv sync)
              ;;
            3.11)
              (cd shared && uv sync --dev)
              (cd backend && uv sync --dev)
              (cd executor_manager && uv sync --dev)
              ;;
            3.12)
              (cd knowledge_engine && uv sync --dev)
              ;;
          esac

      - name: Restore shared wegent CLI pip cache
        if: matrix.python-version == '3.10'
        id: wegent-cli-pip-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-wegent-cli-v2-${{ hashFiles('wegent-cli/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-wegent-cli-v2-

      - name: Populate wegent CLI pip cache
        if: matrix.python-version == '3.10' && steps.wegent-cli-pip-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r wegent-cli/requirements.txt pytest pytest-cov pytest-mock

      - name: Save shared wegent CLI pip cache
        if: matrix.python-version == '3.10' && steps.wegent-cli-pip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/pip
          key: ${{ steps.wegent-cli-pip-cache.outputs.cache-primary-key }}

  warm-executor-rust:
    name: Warm Rust Compiler Cache
    needs: changes
    if: needs.changes.outputs.executor_rust == 'true' || needs.changes.outputs.backend_rs_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up executor Rust cache
        if: needs.changes.outputs.executor_rust == 'true'
        uses: ./.github/actions/setup-rust-cache
        with:
          manifest-path: executor/Cargo.toml
          components: clippy
          save-cache: "true"

      - name: Install executor Rust system dependencies
        if: needs.changes.outputs.executor_rust == 'true'
        run: .github/scripts/install-executor-rust-system-dependencies.sh

      - name: Compile executor tests and Clippy targets
        if: needs.changes.outputs.executor_rust == 'true'
        working-directory: executor
        run: |
          cargo test --locked --all-features --no-run
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Set up Backend Rust cache
        if: needs.changes.outputs.backend_rs_rust == 'true'
        uses: ./.github/actions/setup-rust-cache
        with:
          manifest-path: backend-rs/Cargo.toml
          components: clippy
          save-cache: "true"

      - name: Compile Backend Rust tests and Clippy targets
        if: needs.changes.outputs.backend_rs_rust == 'true'
        working-directory: backend-rs
        run: |
          cargo test --locked --no-run
          cargo clippy --locked --all-targets -- -D warnings

  warm-wework-windows-electron:
    name: Warm Wework Windows Desktop E2E Build
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.wework_target == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.ci-cache/electron
      WEGENT_CODEX_CACHE_DIR: ${{ github.workspace }}/.ci-cache/codex
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          filter: blob:none
          persist-credentials: false
      - name: Restore or build Windows Wework desktop E2E package
        uses: ./.github/actions/build-wework-windows-e2e
        with:
          save-cache: "true"

  warm-wework-macos-electron:
    name: Warm Wework macOS Electron Build Cache
    needs: changes
    if: needs.changes.outputs.wework_target == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Prepare shared macOS desktop E2E build
        uses: ./.github/actions/build-wework-macos-e2e
        with:
          save-cache: "true"
          publish: "true"

      - name: Set up macOS x64 compiler cache
        uses: ./.github/actions/setup-rust-cache
        with:
          manifest-path: executor/Cargo.toml
          targets: x86_64-apple-darwin
          save-cache: "true"

      - name: Warm macOS x64 release executor compiler cache
        working-directory: executor
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/executor/target
        run: cargo build --release --locked --target x86_64-apple-darwin --bin wegent-executor

  prepare-wework-desktop-image:
    name: Prepare Wework Desktop E2E Image
    needs: changes
    if: needs.changes.outputs.wework_target == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      desktop_image: ${{ steps.image.outputs.desktop-ref }}
      executor_image: ${{ steps.runtime.outputs.executor-ref }}
      backend_rs_image: ${{ steps.runtime.outputs.backend-rs-ref }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Resolve Wework desktop E2E image
        id: image
        run: |
          # Rust is compiled by runtime producers, independently of this environment.
          desktop_digest="$(
            sha256sum docker/wework-e2e/desktop.Dockerfile | cut -d ' ' -f 1
          )"
          echo "desktop-ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wegent-wework-e2e:desktop-$desktop_digest" \
            >> "$GITHUB_OUTPUT"

      - name: Resolve shared Rust E2E runtimes
        id: runtime
        env:
          EXECUTOR_SOURCE_DIGEST: ${{ hashFiles('frontend/e2e/fixtures/claudecode-executor/Dockerfile', 'executor/Cargo.toml', 'executor/Cargo.lock', 'executor/src/**', 'executor/crates/**', 'shared/rust/**', 'executor/vendor/**', 'sdk/plugin-auth/**', 'sdk/plugin-creator/**', 'shared/assets/**', 'shared/protocol/**', '.github/ci/rust-toolchain') }}
          BACKEND_RS_SOURCE_DIGEST: ${{ hashFiles('backend-rs/Cargo.toml', 'backend-rs/Cargo.lock', 'backend-rs/src/**', 'backend-rs/crates/**', 'shared/rust/**', 'shared/assets/codex-models/**', 'backend-rs/examples/**', 'backend-rs/migrations/**', '.github/runtime-images/backend-rs-e2e.Dockerfile', '.github/runtime-images/backend-rs-builder.Dockerfile', '.github/ci/rust-toolchain', '.github/actions/setup-rust-cache/action.yml') }}
        run: |
          runtime_output="$(mktemp)"
          GITHUB_OUTPUT="$runtime_output" \
            SOURCE_DIGEST="$EXECUTOR_SOURCE_DIGEST" \
            .github/scripts/resolve-executor-e2e-runtime.sh
          executor_image="$(sed -n 's/^image=//p' "$runtime_output")"
          test -n "$executor_image"
          backend_image="$(
            SOURCE_DIGEST="$BACKEND_RS_SOURCE_DIGEST" \
              .github/scripts/resolve-backend-rs-e2e-runtime.sh
          )"
          {
            echo "executor-ref=$executor_image"
            echo "backend-rs-ref=$backend_image"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Check Wework desktop E2E image
        id: desktop-image-check
        env:
          IMAGE: ${{ steps.image.outputs.desktop-ref }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish Wework desktop E2E image
        if: steps.desktop-image-check.outputs.exists != 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          file: docker/wework-e2e/desktop.Dockerfile
          push: true
          tags: ${{ steps.image.outputs.desktop-ref }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/wegent-wework-e2e:buildcache-desktop
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/wegent-wework-e2e:buildcache-desktop,mode=max

  warm-wework-desktop-core-e2e-build:
    name: Warm Wework Desktop Core E2E Build
    needs:
      - changes
      - prepare-wework-desktop-image
    if: needs.changes.outputs.wework_target == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      HOME: /root
    container:
      image: ${{ needs.prepare-wework-desktop-image.outputs.desktop_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          filter: blob:none
          persist-credentials: false

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.1

      - name: Log in to GHCR with ORAS
        run: echo "$GITHUB_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Resolve shared Wework desktop E2E build
        id: shared-build
        env:
          DESKTOP_IMAGE: ${{ needs.prepare-wework-desktop-image.outputs.desktop_image }}
          EXECUTOR_IMAGE: ${{ needs.prepare-wework-desktop-image.outputs.executor_image }}
          BACKEND_RS_IMAGE: ${{ needs.prepare-wework-desktop-image.outputs.backend_rs_image }}
        run: |
          mkdir -p .ci-artifacts
          .github/scripts/resolve-wework-core-e2e-build-ref.sh \
            "$GITHUB_REPOSITORY_OWNER" \
            "$DESKTOP_IMAGE" \
            "$EXECUTOR_IMAGE" \
            "$BACKEND_RS_IMAGE"

      - name: Restore shared Wework desktop E2E build
        id: restore-shared-build
        env:
          REFERENCE: ${{ steps.shared-build.outputs.reference }}
        run: |
          set +e
          .github/scripts/restore-wework-core-e2e-build-oci.sh \
            .ci-artifacts/wework-core-e2e-build.tar.zst \
            "$REFERENCE"
          restore_status=$?
          set -e
          case "$restore_status" in
            0) echo "cache-hit=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "cache-hit=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$restore_status" ;;
          esac

      - name: Build shared Wework desktop E2E artifact
        if: steps.restore-shared-build.outputs.cache-hit != 'true'
        uses: ./.github/actions/build-wework-core-e2e
        with:
          executor-image: ${{ needs.prepare-wework-desktop-image.outputs.executor_image }}
          backend-rs-image: ${{ needs.prepare-wework-desktop-image.outputs.backend_rs_image }}
          save-cache: "true"

      - name: Publish shared Wework desktop E2E build
        if: steps.restore-shared-build.outputs.cache-hit != 'true'
        env:
          REFERENCE: ${{ steps.shared-build.outputs.reference }}
        run: |
          .github/scripts/publish-wework-core-e2e-build-oci.sh \
            .ci-artifacts/wework-core-e2e-build.tar.zst \
            "$REFERENCE"

  warm-executor-e2e-image:
    name: Publish CI prebuilds (${{ matrix.component }})
    needs: changes
    if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.result == 'success' && (needs.changes.outputs.docker == 'true' || needs.changes.outputs.backend_rs_rust == 'true' || needs.changes.outputs.wework_target == 'true')) || (github.event_name == 'workflow_dispatch' && inputs.prebuild == 'linux'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [executor, backend-rs, downloads]
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Resolve runtime identity
        id: runtime
        env:
          COMPONENT: ${{ matrix.component }}
          EXECUTOR_SOURCE_DIGEST: ${{ hashFiles('frontend/e2e/fixtures/claudecode-executor/Dockerfile', 'executor/Cargo.toml', 'executor/Cargo.lock', 'executor/src/**', 'executor/crates/**', 'shared/rust/**', 'executor/vendor/**', 'sdk/plugin-auth/**', 'sdk/plugin-creator/**', 'shared/assets/**', 'shared/protocol/**', '.github/ci/rust-toolchain') }}
          BACKEND_RS_SOURCE_DIGEST: ${{ hashFiles('backend-rs/Cargo.toml', 'backend-rs/Cargo.lock', 'backend-rs/src/**', 'backend-rs/crates/**', 'shared/rust/**', 'shared/assets/codex-models/**', 'backend-rs/examples/**', 'backend-rs/migrations/**', '.github/runtime-images/backend-rs-e2e.Dockerfile', '.github/runtime-images/backend-rs-builder.Dockerfile', '.github/ci/rust-toolchain', '.github/actions/setup-rust-cache/action.yml') }}
        run: |
          case "$COMPONENT" in
            executor) SOURCE_DIGEST="$EXECUTOR_SOURCE_DIGEST" .github/scripts/resolve-executor-e2e-runtime.sh ;;
            backend-rs) echo "image=$(SOURCE_DIGEST="$BACKEND_RS_SOURCE_DIGEST" .github/scripts/resolve-backend-rs-e2e-runtime.sh)" >> "$GITHUB_OUTPUT" ;;
            downloads) ;;
          esac

      - name: Publish immutable dependencies and runtime
        env:
          COMPONENT: ${{ matrix.component }}
          BASE_IMAGE: ${{ steps.runtime.outputs.base-image }}
          RUNTIME_IMAGE: ${{ steps.runtime.outputs.image }}
          EXECUTOR_BUILD_CACHE: ghcr.io/${{ github.repository_owner }}/wegent-executor:buildcache-e2e
        run: .github/scripts/publish-ci-prebuild.sh "$COMPONENT"

  publish-macos-runtime-prebuilds:
    name: Publish native macOS runtime prebuilds
    if: github.event_name == 'workflow_dispatch' && inputs.prebuild == 'macos-runtimes'
    runs-on: ${{ inputs.macos_runtime_source_run != '' && 'ubuntu-latest' || 'macos-15' }}
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.1

      - name: Log in to GHCR with ORAS
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Set up shared Rust toolchain and cache
        if: inputs.macos_runtime_source_run == ''
        uses: ./.github/actions/setup-rust-cache
        with:
          manifest-path: executor/Cargo.toml
          targets: aarch64-apple-darwin

      - name: Resolve native runtime references
        id: native
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          for component in executor backend-rs; do
            digest="$(node .github/scripts/macos-e2e-source-digest.mjs "$component")"
            echo "$component=ghcr.io/$owner/wegent-wework-macos-e2e-runtime:$component-v1-$digest" >> "$GITHUB_OUTPUT"
          done

      - name: Restore verified native runtimes from CI
        if: inputs.macos_runtime_source_run != ''
        env:
          SOURCE_RUN: ${{ inputs.macos_runtime_source_run }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/restore-macos-ci-runtimes.mjs "$SOURCE_RUN" "$RUNNER_TEMP/native-prebuilds"

      - name: Restore or build native runtime prebuilds
        if: inputs.macos_runtime_source_run == ''
        env:
          WEWORK_EXECUTOR_TARGET_DIR: ${{ runner.temp }}/executor-target
          WEWORK_BACKEND_RS_TARGET_DIR: ${{ runner.temp }}/backend-rs-target
          EXECUTOR_REF: ${{ steps.native.outputs.executor }}
          BACKEND_REF: ${{ steps.native.outputs.backend-rs }}
        run: |
          test "$(uname -m)" = arm64
          for component in executor backend-rs; do
            if [[ "$component" == executor ]]; then reference="$EXECUTOR_REF"; else reference="$BACKEND_REF"; fi
            .github/scripts/restore-macos-e2e-runtime-oci.sh \
              "$RUNNER_TEMP/native-prebuilds/wegent-$component" "wegent-$component" "$reference"
          done
          .github/scripts/build-macos-e2e-runtimes.sh \
            "$RUNNER_TEMP/native-prebuilds/wegent-executor" \
            "$RUNNER_TEMP/native-prebuilds/wegent-backend-rs"

      - name: Publish immutable native runtime prebuilds
        env:
          EXECUTOR_REF: ${{ steps.native.outputs.executor }}
          BACKEND_REF: ${{ steps.native.outputs.backend-rs }}
        run: |
          for component in executor backend-rs; do
            if [[ "$component" == executor ]]; then reference="$EXECUTOR_REF"; else reference="$BACKEND_REF"; fi
            .github/scripts/publish-macos-e2e-runtime-oci.sh \
              "$RUNNER_TEMP/native-prebuilds/wegent-$component" "$reference"
            printf '%s: %s@%s\n' "$component" "${reference%:*}" "$(oras resolve "$reference")" \
              >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Promote verified complete macOS E2E build
        if: inputs.promote_macos_build
        env:
          SOURCE_RUN: ${{ inputs.macos_runtime_source_run }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test -n "$SOURCE_RUN"
          artifact_dir="$RUNNER_TEMP/macos-complete"
          node .github/scripts/restore-macos-ci-build.mjs "$SOURCE_RUN" "$artifact_dir"
          node .github/scripts/macos-e2e-build.mjs publish "$artifact_dir"
