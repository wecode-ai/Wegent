name: Wework Upgrade E2E

on:
  push:
    paths:
      - .github/workflows/wework-upgrade-e2e.yml
      - .github/workflows/wework-app.yml
      - wework/upgrade-policy.json
      - wework/launcher/**
      - wework/electron/src/bootstrap.ts
      - wework/electron/src/main.ts
      - wework/electron/src/runtime/**
      - wework/electron/src/host/*app-update*
      - wework/electron/src/host/electron-capabilities.ts
      - wework/electron/src/host/capability-router.ts
      - wework/electron/scripts/**
      - wework/electron/electron-builder.config.cjs
      - wework/electron/package.json
      - wework/e2e/desktop/scenarios/app-upgrade.scenario.mjs
      - wework/e2e/desktop/scenarios/app-update-full.scenario.mjs
      - wework/e2e/desktop/upgrade-suite.mjs
      - wework/e2e/desktop/checkpoints.mjs
      - wework/e2e/desktop/run-checkpoints.mjs
      - wework/scripts/*upgrade*
      - wework/scripts/lib/portable-desktop-release.mjs
      - wework/scripts/lib/upgrade-evidence.mjs
      - wework/src/features/app-update/**
      - wework/src/lib/app-updater.ts
      - wework/src/components/settings/AboutSettingsPage.tsx
  workflow_dispatch:

concurrency:
  group: wework-upgrade-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  upgrade-and-rollback:
    name: Upgrade and rollback (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-14
          - name: macOS x64
            runner: macos-15-intel
          - name: Windows x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      WEWORK_E2E_PARALLEL_CHECKPOINTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-workspace
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify policy and transaction tests
        run: |
          node --test wework/scripts/upgrade-policy.test.mjs wework/scripts/upgrade-evidence.test.mjs
          pnpm --dir wework/electron install --frozen-lockfile
          pnpm --filter wework prepare:electron
          pnpm --dir wework/electron test src/host/app-update-service.test.ts src/runtime/release-store.test.ts src/runtime/release-snapshot.test.ts src/runtime/release-profile.test.ts scripts/physical-release-files.test.mjs
          rustc --edition 2021 --test wework/launcher/src/main.rs -o "$RUNNER_TEMP/wework-launcher-tests.exe"
          "$RUNNER_TEMP/wework-launcher-tests.exe"
      - name: Verify real packaged upgrade, snapshot restore, and failed activation recovery
        run: pnpm --filter wework e2e:desktop -- --parallel-segments upgrade-and-rollback,app-update-full
      - name: Retain reproducible diagnostics and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wework-upgrade-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            wework/test-results/desktop-e2e/**/*.log
            wework/test-results/desktop-e2e/**/*result.json
            wework/test-results/desktop-e2e/**/failure-summary.json
            wework/test-results/upgrade-fixtures-build.log
          if-no-files-found: error
          retention-days: 7
