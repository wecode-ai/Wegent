name: Prepare shared macOS desktop E2E build
description: Restore or build one macOS application for cache warmup and desktop E2E.
inputs:
  save-cache:
    description: Allow trusted main cache writes.
    default: "false"
  publish:
    description: Publish the application under the caller's existing package permissions.
    default: "false"
  targets:
    description: Rust targets needed by this job.
    default: aarch64-apple-darwin
  prepare-script:
    description: Optional caller-owned dependency preparation to overlap with pnpm installation.
    default: ""
outputs:
  cache-hit:
    description: Shared macOS build result.
    value: ${{ steps.macos-build.outputs.cache-hit }}
  reference:
    description: Shared macOS build result.
    value: ${{ steps.macos-build.outputs.reference }}
  app-bin:
    description: Shared macOS build result.
    value: ${{ steps.configure.outputs.app-bin }}
  executor-bin:
    description: Shared macOS build result.
    value: ${{ steps.configure.outputs.executor-bin }}
  backend-rs-bin:
    description: Shared macOS build result.
    value: ${{ steps.configure.outputs.backend-rs-bin }}
  codex-bin:
    description: Shared macOS build result.
    value: ${{ steps.configure.outputs.codex-bin }}
runs:
  using: composite
  steps:
    - name: Set up ORAS
      id: setup-oras
      uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
      with:
        version: 1.3.1
      continue-on-error: true

    - name: Retry ORAS setup after a transient download failure
      if: steps.setup-oras.outcome == 'failure'
      uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
      with:
        version: 1.3.1

    - name: Log in to GHCR with ORAS
      shell: bash
      run: echo "$GITHUB_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Compute macOS runtime source digests
      shell: bash
      id: macos-source
      run: |
        executor_digest="$(node .github/scripts/macos-e2e-source-digest.mjs executor)"
        backend_digest="$(node .github/scripts/macos-e2e-source-digest.mjs backend-rs)"
        echo "executor=$executor_digest" >> "$GITHUB_OUTPUT"
        echo "backend-rs=$backend_digest" >> "$GITHUB_OUTPUT"

    - name: Resolve shared macOS Wework E2E build
      shell: bash
      id: macos-build
      env:
        EXECUTOR_SOURCE_DIGEST: ${{ steps.macos-source.outputs.executor }}
        BACKEND_RS_SOURCE_DIGEST: ${{ steps.macos-source.outputs.backend-rs }}
      run: |
        node .github/scripts/macos-e2e-build.mjs restore .ci-artifacts/macos-complete

    - name: Set up shared Rust toolchain and cache
      if: steps.macos-build.outputs.cache-hit != 'true'
      uses: ./.github/actions/setup-rust-cache
      with:
        manifest-path: executor/Cargo.toml
        targets: ${{ inputs.targets }}
        save-cache: ${{ inputs.save-cache }}

    - name: Set up pnpm
      if: steps.macos-build.outputs.cache-hit != 'true'
      uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Resolve pnpm store path
      shell: bash
      if: steps.macos-build.outputs.cache-hit != 'true'
      id: pnpm-store
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Restore shared macOS pnpm store
      if: steps.macos-build.outputs.cache-hit != 'true'
      id: macos-pnpm-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-store-v2-${{ hashFiles('pnpm-lock.yaml', 'wework/electron/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-v2-
          ${{ runner.os }}-pnpm-store-v1-

    - name: Install build and caller dependencies
      if: steps.macos-build.outputs.cache-hit != 'true' || inputs.prepare-script != ''
      shell: bash
      env:
        MACOS_BUILD_CACHE_HIT: ${{ steps.macos-build.outputs.cache-hit }}
        PREPARE_SCRIPT: ${{ inputs.prepare-script }}
      run: |
        children=()
        if [[ "$MACOS_BUILD_CACHE_HIT" != "true" ]]; then
          pnpm install --frozen-lockfile &
          children+=("$!")
          pnpm --dir wework/electron install --frozen-lockfile &
          children+=("$!")
        fi
        if [[ -n "$PREPARE_SCRIPT" ]]; then
          [[ "$PREPARE_SCRIPT" == .github/scripts/* && -f "$PREPARE_SCRIPT" ]]
          bash "$PREPARE_SCRIPT" &
          children+=("$!")
        fi
        result=0
        for child in "${children[@]}"; do
          if ! wait "$child"; then result=1; fi
        done
        exit "$result"

    - name: Save shared macOS pnpm store
      if: steps.macos-build.outputs.cache-hit != 'true' && inputs.save-cache == 'true' && github.ref == 'refs/heads/main' && steps.macos-pnpm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ steps.macos-pnpm-cache.outputs.cache-primary-key }}

    - name: Restore shared Wework Electron build dependencies
      if: steps.macos-build.outputs.cache-hit != 'true'
      id: wework-cargo-sources-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          executor/target
          backend-rs/target
          ~/Library/Caches/electron
        key: ${{ runner.os }}-wework-electron-app-v3-${{ hashFiles('executor/Cargo.lock', 'backend-rs/Cargo.lock', 'wework/electron/package.json', 'wework/electron/pnpm-lock.yaml', 'pnpm-lock.yaml', '.github/ci/rust-toolchain', '.github/actions/setup-rust-cache/action.yml') }}
        restore-keys: |
          ${{ runner.os }}-wework-electron-app-v3-
          ${{ runner.os }}-wework-electron-app-v1-

    - name: Restore macOS arm64 executor runtime
      id: macos-executor-runtime-cache
      if: steps.macos-build.outputs.cache-hit != 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.cache/wegent/wework-macos-e2e-runtimes/wegent-executor
        key: ${{ runner.os }}-${{ runner.arch }}-wework-macos-executor-runtime-v1-${{ steps.macos-source.outputs.executor }}

    - name: Restore macOS arm64 Rust backend runtime
      id: macos-backend-rs-runtime-cache
      if: steps.macos-build.outputs.cache-hit != 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.cache/wegent/wework-macos-e2e-runtimes/wegent-backend-rs
        key: ${{ runner.os }}-${{ runner.arch }}-wework-macos-backend-rs-runtime-v1-${{ steps.macos-source.outputs.backend-rs }}

    - name: Restore macOS arm64 runtimes from OCI
      shell: bash
      if: steps.macos-build.outputs.cache-hit != 'true'
      env:
        EXECUTOR_SOURCE_REF: ghcr.io/${{ github.repository_owner }}/wegent-wework-macos-e2e-runtime:executor-v1-${{ steps.macos-source.outputs.executor }}
        EXECUTOR_HEAD_REF: ghcr.io/${{ github.repository_owner }}/wegent-wework-macos-e2e-runtime:executor-head-${{ github.event.pull_request.head.sha || github.sha }}
        BACKEND_SOURCE_REF: ghcr.io/${{ github.repository_owner }}/wegent-wework-macos-e2e-runtime:backend-rs-v1-${{ steps.macos-source.outputs.backend-rs }}
        BACKEND_HEAD_REF: ghcr.io/${{ github.repository_owner }}/wegent-wework-macos-e2e-runtime:backend-rs-head-${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        runtime_root="$HOME/.cache/wegent/wework-macos-e2e-runtimes"
        .github/scripts/restore-macos-e2e-runtime-oci.sh \
          "$runtime_root/wegent-executor" \
          wegent-executor \
          "$EXECUTOR_SOURCE_REF" \
          "$EXECUTOR_HEAD_REF"
        .github/scripts/restore-macos-e2e-runtime-oci.sh \
          "$runtime_root/wegent-backend-rs" \
          wegent-backend-rs \
          "$BACKEND_SOURCE_REF" \
          "$BACKEND_HEAD_REF"

    - name: Build Wework Electron E2E application
      shell: bash
      if: steps.macos-build.outputs.cache-hit != 'true'
      env:
        CARGO_PROFILE_DEV_DEBUG: "0"
        WEWORK_EXECUTOR_TARGET_DIR: ${{ github.workspace }}/executor/target
        WEWORK_BACKEND_RS_TARGET_DIR: ${{ github.workspace }}/backend-rs/target
        WEWORK_EXECUTOR_PROFILE: release
      run: |
        runtime_root="$HOME/.cache/wegent/wework-macos-e2e-runtimes"
        executor_runtime="$runtime_root/wegent-executor"
        backend_runtime="$runtime_root/wegent-backend-rs"

        .github/scripts/build-macos-e2e-runtimes.sh \
          "$executor_runtime" \
          "$backend_runtime"
        # Package only after the runtime producers have completed successfully.
        WEWORK_E2E_PREBUILT_EXECUTOR_PATH="$executor_runtime" \
          CARGO_BUILD_TARGET=aarch64-apple-darwin \
          pnpm --filter wework ai:verify:electron:build

        test -x "$PWD/wework/electron/release/WeWork-darwin-arm64/WeWork.app/Contents/MacOS/WeWork"
        test -x "$PWD/wework/electron/release/WeWork-darwin-arm64/WeWork.app/Contents/Resources/bin/wegent-executor"
        test -x "$backend_runtime"

    - name: Archive and publish shared macOS Wework E2E build
      shell: bash
      if: inputs.publish == 'true' && steps.macos-build.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      run: |
        .github/scripts/archive-wework-macos-e2e-build.sh .ci-artifacts/macos-complete
        node .github/scripts/macos-e2e-build.mjs describe .ci-artifacts/macos-complete
        node .github/scripts/macos-e2e-build.mjs publish .ci-artifacts/macos-complete

    - name: Restore shared macOS Wework E2E build
      shell: bash
      if: steps.macos-build.outputs.cache-hit == 'true'
      run: |
        node .github/scripts/macos-e2e-build.mjs verify .ci-artifacts/macos-complete
        .github/scripts/restore-wework-macos-e2e-build.sh .ci-artifacts/macos-complete

    - name: Configure shared macOS Wework E2E build
      shell: bash
      id: configure
      run: |
        if [[ "${{ steps.macos-build.outputs.cache-hit }}" == "true" ]]; then
          build_root="$PWD/.ci-artifacts/macos-complete/wework-macos-e2e-build"
          app_bundle="$build_root/WeWork.app"
          backend_rs_bin="$build_root/wegent-backend-rs"
        else
          app_bundle="$PWD/wework/electron/release/WeWork-darwin-arm64/WeWork.app"
          backend_rs_bin="$HOME/.cache/wegent/wework-macos-e2e-runtimes/wegent-backend-rs"
        fi
        app_bin="$app_bundle/Contents/MacOS/WeWork"
        executor_bin="$app_bundle/Contents/Resources/bin/wegent-executor"
        codex_bin="$app_bundle/Contents/Resources/codex/vendor/aarch64-apple-darwin/bin/codex"
        test -x "$app_bin"
        test -x "$executor_bin"
        test -x "$codex_bin"
        test -x "$backend_rs_bin"
        {
          echo "CODEX_BIN=$codex_bin"
          echo "WEWORK_E2E_CODEX_BIN=$codex_bin"
          echo "WEWORK_E2E_APP_BIN=$app_bin"
          echo "WEWORK_E2E_EXECUTOR_BIN=$executor_bin"
          echo "WEWORK_E2E_BACKEND_RS_BIN=$backend_rs_bin"
        } >> "$GITHUB_ENV"
        {
          echo "app-bin=$app_bin"
          echo "executor-bin=$executor_bin"
          echo "backend-rs-bin=$backend_rs_bin"
          echo "codex-bin=$codex_bin"
        } >> "$GITHUB_OUTPUT"

    - name: Publish macOS arm64 runtimes to OCI
      shell: bash
      if: inputs.publish == 'true' && inputs.save-cache == 'true' && github.ref == 'refs/heads/main' && steps.macos-build.outputs.cache-hit != 'true'
      env:
        EXECUTOR_SOURCE_REF: ghcr.io/${{ github.repository_owner }}/wegent-wework-macos-e2e-runtime:executor-v1-${{ steps.macos-source.outputs.executor }}
        EXECUTOR_HEAD_REF: ghcr.io/${{ github.repository_owner }}/wegent-wework-macos-e2e-runtime:executor-head-${{ github.sha }}
        BACKEND_SOURCE_REF: ghcr.io/${{ github.repository_owner }}/wegent-wework-macos-e2e-runtime:backend-rs-v1-${{ steps.macos-source.outputs.backend-rs }}
        BACKEND_HEAD_REF: ghcr.io/${{ github.repository_owner }}/wegent-wework-macos-e2e-runtime:backend-rs-head-${{ github.sha }}
      run: |
        runtime_root="$HOME/.cache/wegent/wework-macos-e2e-runtimes"
        .github/scripts/publish-macos-e2e-runtime-oci.sh \
          "$runtime_root/wegent-executor" \
          "$EXECUTOR_SOURCE_REF" \
          "$EXECUTOR_HEAD_REF"
        .github/scripts/publish-macos-e2e-runtime-oci.sh \
          "$runtime_root/wegent-backend-rs" \
          "$BACKEND_SOURCE_REF" \
          "$BACKEND_HEAD_REF"

    - name: Save macOS arm64 executor runtime
      if: inputs.save-cache == 'true' && github.ref == 'refs/heads/main' && steps.macos-build.outputs.cache-hit != 'true' && steps.macos-executor-runtime-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.cache/wegent/wework-macos-e2e-runtimes/wegent-executor
        key: ${{ steps.macos-executor-runtime-cache.outputs.cache-primary-key }}

    - name: Save macOS arm64 Rust backend runtime
      if: inputs.save-cache == 'true' && github.ref == 'refs/heads/main' && steps.macos-build.outputs.cache-hit != 'true' && steps.macos-backend-rs-runtime-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.cache/wegent/wework-macos-e2e-runtimes/wegent-backend-rs
        key: ${{ steps.macos-backend-rs-runtime-cache.outputs.cache-primary-key }}

    - name: Save shared Wework Electron build dependencies
      if: steps.macos-build.outputs.cache-hit != 'true' && inputs.save-cache == 'true' && github.ref == 'refs/heads/main' && steps.wework-cargo-sources-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          executor/target
          backend-rs/target
          ~/Library/Caches/electron
        key: ${{ steps.wework-cargo-sources-cache.outputs.cache-primary-key }}
