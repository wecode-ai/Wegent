name: Set up sccache
description: Install sccache and configure Cargo to reuse compiler outputs.

inputs:
  version:
    description: The sccache release to install.
    required: false
    default: v0.16.0
  save-cache:
    description: Whether this job may populate the shared compiler cache.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install sccache
      id: install
      continue-on-error: true
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      env:
        SCCACHE_IDLE_TIMEOUT: "0"
      with:
        version: ${{ inputs.version }}

    - name: Report unavailable sccache
      if: steps.install.outcome != 'success'
      shell: bash
      run: |
        echo "::warning::sccache is unavailable; continuing without Rust compiler caching"

    - name: Export GitHub Actions cache credentials
      if: steps.install.outcome == 'success'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
      with:
        script: |
          const resultsUrl = process.env.ACTIONS_RESULTS_URL
          const runtimeToken = process.env.ACTIONS_RUNTIME_TOKEN
          if (!resultsUrl || !runtimeToken) {
            throw new Error(
              'GitHub Actions cache credentials are unavailable for sccache'
            )
          }
          core.exportVariable('ACTIONS_RESULTS_URL', resultsUrl)
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', runtimeToken)

    - name: Configure Rust compiler cache
      if: steps.install.outcome == 'success'
      shell: bash
      run: |
        export CARGO_INCREMENTAL=0
        # A single Rust compile can outlast the daemon's ten-minute request timer.
        export SCCACHE_IDLE_TIMEOUT=0
        export SCCACHE_BASEDIRS="$GITHUB_WORKSPACE"
        export SCCACHE_GHA_ENABLED=true
        export SCCACHE_GHA_VERSION="wegent-sccache-v1-$RUNNER_OS-$RUNNER_ARCH"
        if [[ "${{ inputs.save-cache }}" != "true" && "$GITHUB_REF" != "refs/heads/main" ]]; then
          export SCCACHE_GHA_RW_MODE=READ_ONLY
        fi

        # Stats can succeed without starting the server or checking remote storage.
        if ! sccache rustc -vV >/dev/null 2>&1; then
          echo "::warning::sccache could not start; continuing without Rust compiler caching"
          exit 0
        fi

        {
          echo "RUSTC_WRAPPER=sccache"
          for variable in CARGO_INCREMENTAL SCCACHE_IDLE_TIMEOUT SCCACHE_BASEDIRS SCCACHE_GHA_ENABLED SCCACHE_GHA_VERSION SCCACHE_GHA_RW_MODE; do
            if declare -p "$variable" >/dev/null 2>&1; then
              printf '%s=%s\n' "$variable" "${!variable}"
            fi
          done
        } >> "$GITHUB_ENV"
