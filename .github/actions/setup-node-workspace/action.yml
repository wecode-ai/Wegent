name: Set up Node workspace
description: Install the pnpm workspace with a main-owned shared cache

inputs:
  save-cache:
    description: Whether this job may save the shared workspace cache
    required: false
    default: "false"
  setup-toolchain:
    description: Whether to install pnpm and Node instead of using the job image
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up pnpm
      if: inputs.setup-toolchain == 'true'
      uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

    - name: Set up Node.js
      if: inputs.setup-toolchain == 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: "24"

    - name: Resolve Windows pnpm store
      if: runner.os == 'Windows'
      id: windows-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Restore Windows pnpm store
      if: runner.os == 'Windows'
      id: windows-store-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ steps.windows-store.outputs.path }}
        key: ${{ runner.os }}-node-24-pnpm-store-v1-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Identify workspace dependency cache
      if: runner.os != 'Windows'
      id: workspace-cache-context
      shell: bash
      run: |
        # pnpm records absolute workspace paths; host and container caches cannot share them.
        node --input-type=module -e "import { createHash } from 'node:crypto'; console.log('fingerprint=' + createHash('sha256').update(process.cwd()).digest('hex'))" >> "$GITHUB_OUTPUT"

    - name: Restore shared workspace dependencies
      if: runner.os != 'Windows'
      id: workspace-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          node_modules
          frontend/node_modules
          frontend/public/fonts
          wework/node_modules
          packages/*/node_modules
        key: ${{ runner.os }}-node-24-workspace-v2-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'pnpm-workspace.yaml', 'frontend/package.json', 'wework/package.json', 'packages/*/package.json') }}-${{ steps.workspace-cache-context.outputs.fingerprint }}

    - name: Install workspace dependencies
      if: runner.os == 'Windows' || steps.workspace-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Save Windows pnpm store
      if: runner.os == 'Windows' && inputs.save-cache == 'true' && steps.windows-store-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ steps.windows-store.outputs.path }}
        key: ${{ steps.windows-store-cache.outputs.cache-primary-key }}

    - name: Save shared workspace dependencies
      if: runner.os != 'Windows' && inputs.save-cache == 'true' && steps.workspace-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          node_modules
          frontend/node_modules
          frontend/public/fonts
          wework/node_modules
          packages/*/node_modules
        key: ${{ steps.workspace-cache.outputs.cache-primary-key }}
