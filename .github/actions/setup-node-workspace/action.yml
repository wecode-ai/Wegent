name: Set up Node workspace
description: Install the pnpm workspace with a main-owned shared cache

inputs:
  save-cache:
    description: Whether this job may save the shared workspace cache
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: "24"

    - name: Restore shared workspace dependencies
      id: workspace-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          node_modules
          frontend/node_modules
          frontend/public/fonts
          wework/node_modules
          packages/*/node_modules
        key: ${{ runner.os }}-node-24-workspace-v2-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'pnpm-workspace.yaml', 'frontend/package.json', 'wework/package.json', 'packages/*/package.json') }}
        restore-keys: |
          ${{ runner.os }}-node-24-workspace-v2-

    - name: Install workspace dependencies
      if: steps.workspace-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Save shared workspace dependencies
      if: inputs.save-cache == 'true' && steps.workspace-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          node_modules
          frontend/node_modules
          frontend/public/fonts
          wework/node_modules
          packages/*/node_modules
        key: ${{ steps.workspace-cache.outputs.cache-primary-key }}
