name: Set up Python and shared uv cache
description: Install Python and uv with a main-owned cache shared by CI jobs

inputs:
  python-version:
    description: Python version to install
    required: true
  save-cache:
    description: Whether this job may save the shared uv cache
    required: false
    default: "false"
  setup-python:
    description: Whether to install Python instead of using the job image
    required: false
    default: "true"
  setup-uv:
    description: Whether to install uv instead of using the job image
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Python
      if: inputs.setup-python == 'true'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up uv
      if: inputs.setup-uv == 'true'
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: "0.11.17"
        enable-cache: false

    - name: Restore and save shared uv cache
      if: inputs.save-cache == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-${{ runner.arch }}-uv-v1-python-${{ inputs.python-version }}-${{ hashFiles('backend/uv.lock', 'executor_manager/uv.lock', 'knowledge_engine/uv.lock', 'shared/uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-uv-v1-python-${{ inputs.python-version }}-

    - name: Restore shared uv cache
      if: inputs.save-cache != 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-${{ runner.arch }}-uv-v1-python-${{ inputs.python-version }}-${{ hashFiles('backend/uv.lock', 'executor_manager/uv.lock', 'knowledge_engine/uv.lock', 'shared/uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-uv-v1-python-${{ inputs.python-version }}-
