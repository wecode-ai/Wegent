name: Build Wework desktop Core E2E artifact
description: Build and archive the shared Linux desktop runtime used by Wework E2E shards

inputs:
  executor-image:
    description: Content-addressed Executor runtime image
    required: true
  backend-rs-image:
    description: Content-addressed Rust backend runtime image
    required: true
  save-cache:
    description: Whether writable dependency caches may be saved
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Restore published Electron and Codex downloads
      shell: bash
      run: .github/scripts/restore-ci-downloads.sh

    - name: Set up Node workspace
      uses: ./.github/actions/setup-node-workspace
      with:
        save-cache: ${{ inputs.save-cache }}
        setup-toolchain: "false"

    - name: Install Wework Electron dependencies
      shell: bash
      run: pnpm --dir wework/electron install --frozen-lockfile

    - name: Restore bundled Codex cache
      id: bundled-codex-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.cache/wegent/codex
        key: ${{ runner.os }}-wework-codex-v1-${{ hashFiles('wework/codex-binaries.lock.json') }}

    - name: Restore Rust runtimes and build shared Wework desktop E2E runtime
      shell: bash
      env:
        EXECUTOR_IMAGE: ${{ inputs.executor-image }}
        BACKEND_RS_IMAGE: ${{ inputs.backend-rs-image }}
        GITHUB_TOKEN: ${{ github.token }}
        RUNTIME_ARTIFACTS: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        RUNTIME_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # Allow the producer's 25-minute deadline plus runner queue time.
        # The 35-minute consumer deadline leaves time for setup and archiving.
        OCI_RUNTIME_WAIT_SECONDS: "1800"
        CI: true
        WEWORK_E2E_PREBUILT_EXECUTOR_PATH: ${{ github.workspace }}/.ci-artifacts/wegent-executor
        WEWORK_E2E_PREBUILT_EXECUTOR_WAIT_SECONDS: "1800"
        WEWORK_ELECTRON_DEPENDENCIES_READY: "true"
      run: |
        mkdir -p .ci-artifacts
        restore_runtime() {
          local component="$1" artifact="$2" binary="$3" image="$4" image_path="$5"
          if [[ "$RUNTIME_ARTIFACTS" == "true" ]]; then
            ACTIONS_ARTIFACT_WORKFLOW=e2e-tests.yml \
              ACTIONS_ARTIFACT_HEAD_SHA="$RUNTIME_HEAD_SHA" \
              ACTIONS_ARTIFACT_WAIT_SECONDS=1800 \
              .github/scripts/restore-actions-runtime.sh \
                "$artifact" "$component" "$binary" "$image" ".ci-artifacts/$binary"
          else
            .github/scripts/restore-oci-runtime-binary.sh \
              "$image" "$image_path" ".ci-artifacts/$binary"
          fi
        }
        restore_runtime executor executor-e2e-binary wegent-executor "$EXECUTOR_IMAGE" /app/executor &
        executor_pid=$!
        restore_runtime backend-rs backend-rs-e2e-runtime wegent-backend-rs "$BACKEND_RS_IMAGE" /app/wegent-backend-rs &
        backend_pid=$!

        status=0
        if [[ "$RUNTIME_ARTIFACTS" == "true" ]]; then
          if ! wait "$executor_pid"; then status=1; fi
          if ! wait "$backend_pid"; then status=1; fi
          if ((status != 0)); then exit "$status"; fi
          oras logout ghcr.io
        fi
        unset GITHUB_TOKEN
        printf '[wework-build] phase=package-start\n'
        pnpm --filter wework ai:verify:electron:build || status=$?
        if [[ "$RUNTIME_ARTIFACTS" != "true" ]]; then
          if ! wait "$executor_pid"; then status=1; fi
          if ! wait "$backend_pid"; then status=1; fi
        fi
        if ((status == 0)); then
          test -x wework/electron/release/WeWork-linux-x64/WeWork
          test -x wework/electron/release/WeWork-linux-x64/resources/bin/wegent-executor
          test -x .ci-artifacts/wegent-backend-rs
        fi
        exit "$status"

    - name: Save bundled Codex cache
      if: inputs.save-cache == 'true' && steps.bundled-codex-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.cache/wegent/codex
        key: ${{ steps.bundled-codex-cache.outputs.cache-primary-key }}

    - name: Archive Wework desktop Core E2E build
      shell: bash
      run: .github/scripts/archive-wework-core-e2e-build.sh
