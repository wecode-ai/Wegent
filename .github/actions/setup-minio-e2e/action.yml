name: Set up real object storage for E2E
description: Verify the pinned MinIO binary supplied by the Linux desktop E2E image.
runs:
  using: composite
  steps:
    - name: Enable real object storage
      shell: bash
      run: |
        binary="${WEWORK_E2E_MINIO_BIN:?The desktop E2E image must provide MinIO}"
        test -x "$binary"
        "$binary" --version
        echo "WEWORK_E2E_MINIO_BIN=$binary" >> "$GITHUB_ENV"
