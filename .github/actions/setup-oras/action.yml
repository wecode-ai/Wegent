name: Set up verified ORAS
description: Install the pinned ORAS binary from the authenticated GitHub Release API.
runs:
  using: composite
  steps:
    - name: Download and verify ORAS 1.3.1
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64)
            asset_id=371964747
            sha256=d52c4af76ce6a3ceb8579e51fb751a43ac051cca67f965f973a0b0e897a2bb86
            checksum=(sha256sum)
            ;;
          macOS/ARM64)
            asset_id=371964756
            sha256=d545a238f4c8be6dfae6c3d0ff5b09720c5588641d4a5180fb87c38a64500cc4
            checksum=(shasum -a 256)
            ;;
          macOS/X64)
            asset_id=371964744
            sha256=22b7d8947d32280283c2e1a2fabc59d3b3c3b3056ec070dabdfe016fda532e52
            checksum=(shasum -a 256)
            ;;
          *)
            echo "Unsupported ORAS runner: $RUNNER_OS/$RUNNER_ARCH" >&2
            exit 1
            ;;
        esac

        oras_dir="$(mktemp -d "$RUNNER_TEMP/oras.XXXXXX")"
        archive="$oras_dir/oras.tar.gz"
        curl --fail --silent --show-error --location --connect-timeout 15 --max-time 120 \
          --proto '=https' --proto-redir '=https' \
          --header 'Accept: application/octet-stream' \
          --header "Authorization: Bearer $GITHUB_TOKEN" \
          --output "$archive" \
          "https://api.github.com/repos/oras-project/oras/releases/assets/$asset_id"
        printf '%s  %s\n' "$sha256" "$archive" | "${checksum[@]}" --check
        tar -xzf "$archive" -C "$oras_dir" oras
        echo "$oras_dir" >> "$GITHUB_PATH"
