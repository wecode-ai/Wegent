packages:
  - frontend
  - wework
  - packages/*
confirmModulesPurge: false
allowBuilds:
  core-js: true
  dingtalk-workspace-cli: false
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
packageExtensions:
  'tiptap-markdown@0.8.10':
    dependencies:
      '@tiptap/pm': ^2.27.2
patchedDependencies:
  '@pierre/diffs@1.2.11': patches/@pierre__diffs@1.2.11.patch
  'mdast-util-gfm-autolink-literal@2.0.1': patches/mdast-util-gfm-autolink-literal@2.0.1.patch
minimumReleaseAgeExclude:
  - '@file-viewer/core@2.1.26'
  - '@file-viewer/doc@2.1.26'
  - '@file-viewer/docx@0.3.19'
  - '@file-viewer/pptx@2.1.26'
  - '@file-viewer/preset-lite@2.1.26'
  - '@file-viewer/preset-office@2.1.26'
  - '@file-viewer/react@2.1.26'
  - '@file-viewer/renderer-image@2.1.26'
  - '@file-viewer/renderer-media@2.1.26'
  - '@file-viewer/renderer-ofd@2.1.26'
  - '@file-viewer/renderer-pdf@2.1.26'
  - '@file-viewer/renderer-presentation@2.1.26'
  - '@file-viewer/renderer-spreadsheet@2.1.26'
  - '@file-viewer/renderer-text@2.1.26'
  - '@file-viewer/renderer-word@2.1.26'
  - '@file-viewer/vite-plugin@2.1.26'
  - '@file-viewer/eda-layout@2.1.26'
  - '@file-viewer/eda-orcad@2.1.26'
  - '@file-viewer/geometry-engine@2.1.26'
  - '@file-viewer/preset-engineering@2.1.26'
  - '@file-viewer/renderer-3d@2.1.26'
  - '@file-viewer/renderer-archive@2.1.26'
  - '@file-viewer/renderer-cad@2.1.26'
  - '@file-viewer/renderer-data@2.1.26'
  - '@file-viewer/renderer-drawing@2.1.26'
  - '@file-viewer/renderer-eda@2.1.26'
