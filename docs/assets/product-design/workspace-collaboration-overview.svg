<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1330" viewBox="0 0 1440 1330" role="img" aria-labelledby="title desc">
  <title id="title">Workspace 协作结构与任务执行</title>
  <desc id="desc">协作空间管理项目、成员、智能体和执行环境。项目包含 Issue 和由人或 AI 担任的项目管理者。管理者把 Issue 的某个步骤分给人或 Agent 与执行环境组成的 AI 执行者。分给人时 Wework 通知，人点击开始后创建任务；分给 AI 时执行模块自动创建任务，由执行器驱动智能体在执行环境中执行。产物同步回 Issue 对应步骤。有权限的成员未被分配也可直接创建任务。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <style>
      text { font-family: 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #172033; }
      .heading { font-size: 29px; font-weight: 650; }
      .label { font-size: 22px; font-weight: 600; }
      .body { font-size: 21px; }
      .small { font-size: 19px; fill: #59677c; }
      .center { text-anchor: middle; }
      .wire { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1440" height="1330" fill="#ffffff"/>
  <text x="48" y="59" font-size="34" font-weight="650">协作空间与任务执行</text>
  <text x="1390" y="56" class="small" text-anchor="end">Wework × Wegent · 概念设计</text>

  <!-- Workspace structure. Containment expresses the managed scope. -->
  <rect x="40" y="94" width="1360" height="504" rx="22" fill="#f4f7fd" stroke="#a9bde5" stroke-width="2"/>
  <text x="70" y="143" class="heading">Workspace · 协作空间</text>
  <text x="1370" y="140" class="small" text-anchor="end">管理成员、Agent、执行环境和 Project</text>

  <rect x="70" y="174" width="410" height="135" rx="14" fill="#ffffff" stroke="#d5deed"/>
  <text x="94" y="208" class="label">Member · 成员</text>
  <text x="94" y="249" class="body">人 + AI</text>
  <text x="94" y="281" class="small">人的身份独立于空间，通过成员关系加入</text>

  <rect x="515" y="174" width="410" height="135" rx="14" fill="#ffffff" stroke="#d5deed"/>
  <text x="539" y="208" class="label">Agent · 智能体</text>
  <text x="539" y="249" class="body">Wegent Team：定义 AI 的能力</text>
  <text x="539" y="281" class="small">与执行环境组合成 AI 的最小调度单元</text>

  <rect x="960" y="174" width="410" height="135" rx="14" fill="#ffffff" stroke="#d5deed"/>
  <text x="984" y="208" class="label">Execution Environment · 执行环境</text>
  <text x="984" y="249" class="body">本机 · 云主机 · 云端托管</text>
  <text x="984" y="281" class="small">所有者：个人 / 协作空间</text>

  <rect x="70" y="333" width="1300" height="235" rx="16" fill="#ffffff" stroke="#b7c7e4" stroke-width="1.5"/>
  <text x="96" y="375" class="heading">Project · 协作项目</text>
  <text x="1342" y="373" class="small" text-anchor="end">从空间中选成员加入项目</text>

  <rect x="96" y="397" width="878" height="144" rx="12" fill="#f8fafc" stroke="#dee5ee"/>
  <text x="119" y="433" class="label">Issue · 要完成的事情</text>
  <rect x="119" y="461" width="256" height="51" rx="9" fill="#ffffff" stroke="#d6deea"/>
  <text x="247" y="494" class="body center">步骤 1 · 需求</text>
  <rect x="407" y="461" width="256" height="51" rx="9" fill="#eaf0ff" stroke="#9db7ef"/>
  <text x="535" y="494" class="body center" style="fill:#2456bb">步骤 2 · 开发</text>
  <rect x="695" y="461" width="256" height="51" rx="9" fill="#ffffff" stroke="#d6deea"/>
  <text x="823" y="494" class="body center">步骤 3 · 验收</text>

  <rect x="999" y="397" width="345" height="144" rx="12" fill="#fff8e9" stroke="#e9ca8d"/>
  <text x="1171" y="433" class="label center">项目管理者 / 调度器</text>
  <text x="1171" y="478" class="body center">由人或 AI 担任</text>
  <text x="1171" y="513" class="small center">内部配置：项目流程（Workflow）</text>

  <!-- Assignment and execution, shown as two separate modules. -->
  <rect x="40" y="627" width="1360" height="663" rx="22" fill="#fcfcfd" stroke="#dce2eb" stroke-width="1.5"/>
  <text x="70" y="678" class="heading">分配与执行</text>
  <text x="70" y="715" class="small">调度器分配 Issue 步骤；执行模块创建 Task、执行并同步产物。</text>

  <rect x="70" y="748" width="306" height="360" rx="16" fill="#fffaf0" stroke="#e9d3a5"/>
  <text x="94" y="787" class="label" style="fill:#8c641d">分配模块</text>
  <rect x="90" y="840" width="266" height="151" rx="12" fill="#ffffff" stroke="#e3c58c" stroke-width="1.5"/>
  <text x="223" y="883" class="label center">项目管理者 / 调度器</text>
  <text x="223" y="925" class="body center">选择 Issue 的某个步骤</text>
  <text x="223" y="961" class="small center">决定交给谁</text>
  <text x="223" y="1067" class="small center">产出分配请求</text>

  <path d="M 356 916 H 414 V 832 H 470" class="wire" marker-end="url(#blue-arrow)"/>
  <path d="M 414 916 V 1012 H 470" class="wire" marker-end="url(#green-arrow)"/>
  <circle cx="414" cy="916" r="4" fill="#64748b"/>

  <rect x="470" y="791" width="190" height="82" rx="12" fill="#edf3ff" stroke="#8fafe9" stroke-width="1.5"/>
  <text x="565" y="843" class="center" font-size="28" font-weight="600" style="fill:#2456bb">人</text>
  <rect x="470" y="962" width="190" height="100" rx="12" fill="#eaf9f2" stroke="#7bc7a5" stroke-width="1.5"/>
  <text x="565" y="1000" class="label center" style="fill:#087b55">AI 执行单元</text>
  <text x="565" y="1036" class="body center">Agent + 执行环境</text>

  <rect x="718" y="748" width="648" height="360" rx="16" fill="#f5f8fc" stroke="#cbd5e1"/>
  <text x="742" y="781" class="label">执行模块</text>

  <path d="M 660 832 H 742" class="wire" style="stroke:#2563eb" marker-end="url(#blue-arrow)"/>
  <rect x="742" y="802" width="226" height="80" rx="12" fill="#ffffff" stroke="#a4bde8"/>
  <text x="855" y="850" class="label center">Wework 弹出通知</text>
  <path d="M 968 842 H 1018" class="wire" style="stroke:#2563eb" marker-end="url(#blue-arrow)"/>
  <rect x="1018" y="802" width="324" height="80" rx="12" fill="#edf3ff" stroke="#8fafe9"/>
  <text x="1180" y="835" class="label center">人点击开始 → 创建 Task</text>
  <text x="1180" y="865" class="small center">在 Wework 中执行</text>

  <path d="M 660 1012 H 742" class="wire" style="stroke:#059669" marker-end="url(#green-arrow)"/>
  <rect x="742" y="972" width="226" height="80" rx="12" fill="#ffffff" stroke="#95cbb4"/>
  <text x="855" y="1020" class="label center">自动创建 Task</text>
  <path d="M 968 1012 H 1018" class="wire" style="stroke:#059669" marker-end="url(#green-arrow)"/>
  <rect x="1018" y="972" width="324" height="80" rx="12" fill="#eaf9f2" stroke="#7bc7a5"/>
  <text x="1180" y="1005" class="label center">Executor 驱动 Agent</text>
  <text x="1180" y="1035" class="small center">在选定执行环境中执行</text>

  <path d="M 1342 842 H 1384 V 1145 H 1130 V 1180" class="wire" marker-end="url(#arrow)"/>
  <path d="M 1342 1012 H 1384" class="wire"/>
  <circle cx="1384" cy="1012" r="4" fill="#64748b"/>
  <text x="1300" y="1130" class="small center">执行结束</text>

  <rect x="70" y="1180" width="770" height="76" rx="12" fill="#f0f4fa"/>
  <text x="94" y="1210" class="label">未被分配，也能参与</text>
  <text x="94" y="1242" class="small">有权限的项目成员，可以从 Issue 直接创建 Task。</text>

  <rect x="898" y="1180" width="468" height="76" rx="12" fill="#eef2ff" stroke="#b2bdeb"/>
  <text x="1132" y="1211" class="label center">同步产物</text>
  <text x="1132" y="1243" class="body center">回到 Issue 对应步骤</text>
</svg>
