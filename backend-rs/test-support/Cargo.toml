[package]
name = "wegent-backend-test-support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared SQL protocol fixtures and query capture for Backend libraries"

[dependencies]
brz-metrics = { workspace = true, features = ["tokio"] }
futures-util = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
brz-mysql = { workspace = true, features = ["metrics", "slow-log"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
