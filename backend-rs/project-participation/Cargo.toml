[package]
name = "wegent-project-participation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Project assistant participation and assignment reception receipts"

[features]
test-support = ["dep:anyhow"]

[dependencies]
anyhow = { workspace = true, optional = true }
async-trait.workspace = true
brz-http-server = { workspace = true, features = ["macros"] }
brz-json.workspace = true
brz-mysql = { workspace = true, features = ["metrics", "slow-log"] }
brz-redis = { workspace = true, features = ["metrics", "slow-log"] }
chrono = { workspace = true, features = ["clock", "serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
tracing.workspace = true
wegent-backend-config.workspace = true
wegent-backend-persistence.workspace = true
wegent-device-identity.workspace = true
wegent-http-compat.workspace = true
wegent-identity.workspace = true
wegent-project-coordination.workspace = true
wegent-project-notifications.workspace = true
wegent-socket-events.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wegent-backend-test-support.workspace = true
