[package]
name = "wegent-git-repositories"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Git provider discovery, cache, refresh workers, and authenticated routes"

[dependencies]
async-trait = { workspace = true }
brz-http = { workspace = true, features = ["json"] }
brz-http-server = { workspace = true, features = ["macros"] }
brz-json = { workspace = true }
brz-redis = { workspace = true, features = ["metrics", "slow-log"] }
md-5 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
url = { workspace = true }
tracing = { workspace = true }
wegent-http-compat = { workspace = true }
wegent-identity = { workspace = true }
wegent-network-policy = { workspace = true }

[dev-dependencies]
wegent-backend-test-support = { workspace = true }
