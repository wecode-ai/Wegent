[package]
name = "wegent-smart-apps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Smart App marketplace discovery and authorized artifact download"

[dependencies]
base64.workspace = true
brz-http.workspace = true
brz-http-server = { workspace = true, features = ["macros"] }
brz-json.workspace = true
brz-mysql = { workspace = true, features = ["metrics", "slow-log"] }
brz-redis = { workspace = true, features = ["metrics", "slow-log"] }
chrono = { workspace = true, features = ["clock", "serde"] }
getrandom.workspace = true
hmac.workspace = true
jsonwebtoken.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
tracing.workspace = true
wegent-access.workspace = true
wegent-backend-config.workspace = true
wegent-backend-persistence.workspace = true
wegent-http-compat.workspace = true
wegent-identity.workspace = true
wegent-storage.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "time"] }
