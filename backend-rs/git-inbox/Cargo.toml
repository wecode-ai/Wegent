[package]
name = "wegent-git-inbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Signed Git webhook delivery and device-owned inbox subscriptions"

[dependencies]
aes-gcm.workspace = true
base64.workspace = true
brz-http-server = { workspace = true, features = ["macros"] }
brz-redis.workspace = true
chrono = { workspace = true, features = ["clock"] }
getrandom.workspace = true
hmac.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
tracing.workspace = true
url.workspace = true
wegent-http-compat.workspace = true
wegent-identity.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
