[package]
name = "wegent-knowledge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Knowledge-base and document API with scoped access and indexing"

[dependencies]
async-trait.workspace = true
brz-http-server = { workspace = true, features = ["macros"] }
brz-json.workspace = true
brz-mysql = { workspace = true, features = ["metrics", "slow-log"] }
brz-redis = { workspace = true, features = ["metrics", "slow-log"] }
chrono = { workspace = true, features = ["clock", "serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
tracing.workspace = true
wegent-access.workspace = true
wegent-attachments.workspace = true
wegent-backend-config.workspace = true
wegent-backend-persistence.workspace = true
wegent-http-compat.workspace = true
wegent-identity.workspace = true
wegent-knowledge-access.workspace = true
wegent-python-compat.workspace = true
wegent-resource-store.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
wegent-backend-test-support.workspace = true
