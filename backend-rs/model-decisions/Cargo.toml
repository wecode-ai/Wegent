[package]
name = "wegent-model-decisions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Authenticated decision-model catalog and provider execution"

[dependencies]
anyhow.workspace = true
brz-http = { workspace = true, features = ["json", "gzip", "metrics", "slow-log"] }
brz-http-server = { workspace = true, features = ["macros"] }
brz-mysql.workspace = true
brz-redis.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
wegent-access.workspace = true
wegent-http-compat.workspace = true
wegent-identity.workspace = true
wegent-llm-proxy.workspace = true
wegent-models.workspace = true
wegent-network-policy.workspace = true
wegent-python-compat.workspace = true
wegent-resource-store.workspace = true

[dev-dependencies]
async-trait.workspace = true
chrono.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt"] }
