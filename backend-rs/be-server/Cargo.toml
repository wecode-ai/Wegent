wegent-resource-library = { workspace = true }
wegent-resource-readiness = { workspace = true }
wegent-resource-store = { workspace = true }
wegent-job-runtime = { workspace = true }
wegent-socket-events = { workspace = true }
wegent-git-repositories = { workspace = true }
wegent-git-inbox = { workspace = true }
wegent-network-policy = { workspace = true }
wegent-notification-inbox = { workspace = true }
wegent-sites = { workspace = true }
wegent-skill-market = { workspace = true }
wegent-smart-apps = { workspace = true }
wegent-socket-adapter = { workspace = true }
wegent-access = { workspace = true }
wegent-admin-api = { workspace = true }
wegent-directory = { workspace = true }
wegent-identity = { workspace = true }
wegent-backend-config = { workspace = true }
wegent-backend-persistence = { workspace = true }
wegent-celery = { workspace = true }
wegent-channel-streaming = { workspace = true }
wegent-python-compat = { workspace = true }
wegent-http-compat = { workspace = true }
wegent-storage = { workspace = true }
wegent-protocol = { workspace = true }
wegent-crypto = { workspace = true }
aes = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
aes-gcm = { workspace = true }
base64 = { workspace = true }
bcrypt = { workspace = true }
cbc = { workspace = true, features = ["alloc", "block-padding"] }
brz-http = { workspace = true, features = ["json", "gzip", "metrics", "slow-log"] }
brz-http-gateway = { workspace = true, features = ["fallback-log"] }
brz-http-server = { workspace = true, features = ["macros", "metrics", "api-log", "slow-log", "hyper"] }
brz-socket-io = { workspace = true, features = ["macros", "metrics"] }
brz-logs = { workspace = true, features = ["metrics"] }
brz-metrics = { workspace = true, features = ["tokio"] }
brz-mysql = { workspace = true, features = ["metrics", "slow-log"] }
brz-redis = { workspace = true, features = ["metrics", "slow-log"] }
brz-schedule = { workspace = true }
brz-schedule-redis = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true, features = ["clock", "serde"] }
chrono-tz = { workspace = true, features = ["std"] }
erased-serde = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
getrandom = { workspace = true }
hmac = { workspace = true }
htmd = { workspace = true }
lettre = { workspace = true, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
pep440_rs = { workspace = true }
pulldown-cmark = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["http1", "server"] }
jsonwebtoken = { workspace = true }
# `md5` for the repository-token digest and the URL-metadata cache key
# (`hashlib.md5`).
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
brz-json = { workspace = true }
# Preserve source dict ordering at the remaining dynamic mutation boundaries.
serde_json = { workspace = true, features = ["preserve_order"] }
sha1 = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = { workspace = true }
tokio-util = { workspace = true, features = ["io"] }
tracing = { workspace = true }
url = { workspace = true }
yaml-rust2 = { workspace = true }
zip = { workspace = true, features = ["deflate"] }

[dev-dependencies]
wegent-connector-apps = { workspace = true, features = ["test-support"] }
wegent-plugin-runtime = { workspace = true, features = ["test-support"] }
wegent-runtime-observations = { workspace = true, features = ["test-support"] }
wegent-project-coordination = { workspace = true, features = ["test-support"] }
wegent-project-participation = { workspace = true, features = ["test-support"] }
wegent-database-migrations = { workspace = true, features = ["test-support"] }
wegent-runtime-execution = { workspace = true, features = ["test-support"] }
wegent-socket-adapter = { workspace = true, features = ["test-support"] }
wegent-responses-streaming = { workspace = true, features = ["test-support"] }
wegent-execution-emission = { workspace = true, features = ["test-support"] }
wegent-socket-events = { workspace = true, features = ["test-support"] }
wegent-identity = { workspace = true, features = ["test-support"] }
wegent-task-store = { workspace = true, features = ["test-support"] }
wegent-backend-test-support = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }

[lints.rust]
# `deny` rather than `forbid` so `config::init_env` can relax it for the single
# `env::set_var` call that ports the reference dotenv export. Everything else
# stays unsafe-free.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[lib]
name = "wegent_backend_rs"

[[bin]]
name = "wegent-backend-rs"
path = "src/main.rs"
