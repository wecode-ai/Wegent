wegent-project-scheduler = { workspace = true }
wegent-attachment-links = { workspace = true }
wegent-attachments = { workspace = true }
wegent-chat-history = { workspace = true }
wegent-responses-api = { workspace = true }
wegent-responses-streaming = { workspace = true }
wegent-media = { workspace = true }
wegent-capabilities = { workspace = true }
wegent-models = { workspace = true }
wegent-model-decisions = { workspace = true }
wegent-runtime-check = { workspace = true }
wegent-runtime-execution = { workspace = true }
