[package]
name = "wegent-backend-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Incremental Rust migration gateway for the Wegent backend"
license.workspace = true

[dependencies]
wegent-workspaces = { workspace = true }
wegent-wework-transcripts = { workspace = true }
wegent-tasks = { workspace = true }
wegent-task-export-docx = { workspace = true }
wegent-oidc = { workspace = true }
wegent-onboarding = { workspace = true }
wegent-authentication = { workspace = true }
wegent-backend-users = { workspace = true }
wegent-remote-workspace = { workspace = true }
wegent-workspace-archive = { workspace = true }
wegent-execution-preparation = { workspace = true }
wegent-execution-events = { workspace = true }
wegent-execution-runtime = { workspace = true }
wegent-executor-manager = { workspace = true }
wegent-mcp-transport = { workspace = true }
wegent-mcp-providers = { workspace = true }
wegent-knowledge = { workspace = true }
wegent-knowledge-access = { workspace = true }
wegent-teams = { workspace = true }
wegent-devices = { workspace = true }
wegent-plugin-catalog = { workspace = true }
wegent-plugin-store = { workspace = true }
wegent-project-coordination = { workspace = true }
wegent-attachments = { workspace = true }
wegent-responses-api = { workspace = true }
wegent-media = { workspace = true }
wegent-capabilities = { workspace = true }
wegent-models = { workspace = true }
wegent-runtime-check = { workspace = true }
wegent-task-store = { workspace = true }
wegent-terminal = { workspace = true }
wegent-resource-store = { workspace = true }
wegent-job-runtime = { workspace = true }
wegent-socket-events = { workspace = true }
wegent-git-repositories = { workspace = true }
wegent-network-policy = { workspace = true }
wegent-sites = { workspace = true }
wegent-access = { workspace = true }
wegent-directory = { workspace = true }
wegent-identity = { workspace = true }
wegent-backend-config = { workspace = true }
wegent-backend-persistence = { workspace = true }
wegent-celery = { workspace = true }
wegent-python-compat = { workspace = true }
wegent-http-compat = { workspace = true }
wegent-storage = { workspace = true }
wegent-protocol = { workspace = true }
wegent-crypto = { workspace = true }
aes = { workspace = true }
aes-gcm = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bcrypt = { workspace = true }
cbc = { workspace = true, features = ["alloc", "block-padding"] }
brz-http = { workspace = true, features = ["json", "gzip", "metrics", "slow-log"] }
brz-http-gateway = { workspace = true, features = ["fallback-log"] }
brz-http-server = { workspace = true, features = ["macros", "metrics", "api-log", "slow-log", "hyper"] }
brz-socket-io = { workspace = true, features = ["macros", "metrics"] }
brz-logs = { workspace = true, features = ["metrics"] }
brz-metrics = { workspace = true, features = ["tokio"] }
brz-mysql = { workspace = true, features = ["metrics", "slow-log"] }
brz-redis = { workspace = true, features = ["metrics", "slow-log"] }
brz-schedule = { workspace = true }
brz-schedule-redis = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true, features = ["clock", "serde"] }
chrono-tz = { workspace = true, features = ["std"] }
chardetng = { workspace = true }
csv = { workspace = true }
encoding_rs = { workspace = true }
erased-serde = { workspace = true }
flate2 = { workspace = true, features = ["zlib"] }
futures-util = { workspace = true, features = ["std"] }
getrandom = { workspace = true }
hmac = { workspace = true }
htmd = { workspace = true }
lettre = { workspace = true, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
pep440_rs = { workspace = true }
rustpython-parser = { workspace = true, features = ["num-bigint"] }
rustpython-ast = { workspace = true, features = ["num-bigint", "fold"] }
unicode-normalization = { workspace = true }
pulldown-cmark = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["http1", "server"] }
jsonwebtoken = { workspace = true }
# `md5` for the repository-token digest and the URL-metadata cache key
# (`hashlib.md5`).
md-5 = { workspace = true }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
brz-json = { workspace = true }
# Preserve source dict ordering at the remaining dynamic mutation boundaries.
serde_json = { workspace = true, features = ["preserve_order"] }
sha1 = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = { workspace = true }
tokio-util = { workspace = true, features = ["io"] }
tracing = { workspace = true }
turbojpeg = { workspace = true, features = ["cmake"] }
url = { workspace = true }
yaml-rust2 = { workspace = true }
# Pillow's PNG encoder compresses with `deflateInit2(level 9, windowBits 15,
# memLevel 9, Z_FILTERED)`. `flate2` fixes memLevel at 8 and `zlib-rs` does not
# reproduce zlib's deflate stream byte-for-byte, so the attachment PNG encoder
# calls the already-linked zlib through this FFI surface.
libz-sys = { workspace = true }
brotli = { workspace = true, features = ["std"] }
zstd = { workspace = true, features = ["arrays"] }
zip = { workspace = true, features = ["deflate"] }
jsonschema = { workspace = true }

[dev-dependencies]
wegent-project-coordination = { workspace = true, features = ["test-support"] }
wegent-socket-events = { workspace = true, features = ["test-support"] }
wegent-identity = { workspace = true, features = ["test-support"] }
wegent-task-store = { workspace = true, features = ["test-support"] }
wegent-backend-test-support = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }

[lints.rust]
# `deny` rather than `forbid` so `config::init_env` can relax it for the single
# `env::set_var` call that ports the reference dotenv export. Everything else
# stays unsafe-free.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[lib]
name = "wegent_backend_rs"

[[bin]]
name = "wegent-backend-rs"
path = "src/main.rs"
