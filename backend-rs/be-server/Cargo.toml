wegent-llm-proxy = { workspace = true }
wegent-teams = { workspace = true }
wegent-devices = { workspace = true }
wegent-device-lifecycle = { workspace = true }
wegent-device-artifacts = { workspace = true }
wegent-database-migrations = { workspace = true }
wegent-connector-apps = { workspace = true }
wegent-plugin-catalog = { workspace = true }
wegent-plugin-package = { workspace = true }
wegent-plugin-runtime = { workspace = true }
wegent-plugin-store = { workspace = true }
