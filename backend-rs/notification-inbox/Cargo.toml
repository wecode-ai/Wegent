[package]
name = "wegent-notification-inbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "User-scoped Wework notifications and channel preferences"

[dependencies]
brz-http-server.workspace = true
brz-json.workspace = true
brz-mysql.workspace = true
chrono = { workspace = true, features = ["clock"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
tracing.workspace = true
wegent-http-compat.workspace = true
wegent-identity.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
wegent-backend-test-support.workspace = true
