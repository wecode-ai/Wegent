[package]
name = "wegent-task-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Task persistence, transactional lifecycle, and stable documents"

[features]
test-support = []

[dependencies]
wegent-protocol = { workspace = true }
wegent-backend-persistence = { workspace = true }
wegent-resource-store = { workspace = true }
wegent-python-compat = { workspace = true }
async-trait = { workspace = true }
brz-mysql = { workspace = true, features = ["metrics", "slow-log"] }
brz-json = { workspace = true }
chrono = { workspace = true, features = ["clock", "serde"] }
getrandom = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
wegent-backend-test-support = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
