[package]
name = "wegent-runtime-observations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Durable Runtime observations, collector leases, and delivery"

[features]
test-support = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
brz-http-server = { workspace = true, features = ["macros"] }
brz-mysql = { workspace = true, features = ["metrics", "slow-log"] }
chrono = { workspace = true, features = ["clock"] }
futures-util = { workspace = true, features = ["std"] }
jsonwebtoken.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "time"] }
tracing.workspace = true
wegent-backend-config.workspace = true
wegent-http-compat.workspace = true
wegent-identity.workspace = true
wegent-job-runtime.workspace = true
wegent-protocol.workspace = true
wegent-socket-events.workspace = true
