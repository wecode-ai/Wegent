[package]
name = "wegent-mcp-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MCP provider registry, user configuration, and OAuth credentials"

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
brz-http = { workspace = true, features = ["json"] }
brz-http-server = { workspace = true, features = ["macros"] }
brz-json = { workspace = true }
brz-mysql = { workspace = true, features = ["metrics", "slow-log"] }
chrono = { workspace = true, features = ["clock"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
tracing = { workspace = true }
url = { workspace = true }
wegent-backend-config = { workspace = true }
wegent-backend-persistence = { workspace = true }
wegent-crypto = { workspace = true }
wegent-http-compat = { workspace = true }
wegent-identity = { workspace = true }
wegent-network-policy = { workspace = true }
wegent-python-compat = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
wegent-backend-test-support = { workspace = true }
