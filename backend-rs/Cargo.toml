[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"

[workspace.dependencies]
aes = "0.8"
aes-gcm = "0.10"
anyhow = "1"
async-trait = "0.1"
base64 = "0.23.1"
bcrypt = "0.19"
brotli = { version = "8.0.4", default-features = false }
brz-http = "=0.0.14"
brz-http-gateway = "=0.2.15"
brz-http-server = "=0.0.33"
brz-json = "=0.0.11"
brz-logs = "=0.0.17"
# Use one metrics registry across Breeze components.
brz-metrics = "=0.0.13"
brz-mysql = "=0.0.33"
brz-redis = "=0.0.18"
brz-schedule = "=0.0.1"
