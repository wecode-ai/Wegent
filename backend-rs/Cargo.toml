[workspace]
resolver = "2"
members = [
    "access",
    "attachments",
    "authentication",
    "backend-config",
    "be-server",
    "capabilities",
    "celery",
    "devices",
    "directory",
    "execution-events",
    "execution-preparation",
    "execution-runtime",
    "executor-manager",
    "git-repositories",
    "http-compat",
    "identity",
    "job-runtime",
    "knowledge",
    "knowledge-access",
    "mcp-providers",
    "mcp-transport",
    "media",
    "models",
    "network-policy",
    "oidc",
    "onboarding",
    "persistence",
    "plugin-catalog",
    "plugin-store",
    "project-coordination",
    "python-compat",
    "remote-workspace",
    "resource-store",
    "responses-api",
    "runtime-check",
    "sites",
    "socket-events",
    "storage",
    "task-export-docx",
    "task-store",
    "tasks",
    "teams",
    "terminal",
    "test-support",
    "users",
    "wework-transcripts",
    "workspace-archive",
    "workspaces",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"

[workspace.dependencies]
aes = "0.8"
aes-gcm = "0.10"
anyhow = "1"
async-trait = "0.1"
base64 = "0.23.1"
bcrypt = "0.19"
brotli = { version = "8.0.4", default-features = false }
brz-http = "=0.0.14"
brz-http-gateway = "=0.2.15"
brz-http-server = "=0.0.33"
brz-json = "=0.0.11"
brz-logs = "=0.0.17"
# Use one metrics registry across Breeze components.
brz-metrics = "=0.0.13"
brz-mysql = "=0.0.33"
brz-redis = "=0.0.18"
brz-schedule = "=0.0.1"
brz-schedule-redis = "=0.0.1"
brz-socket-io = "=0.0.7"
bytes = "1"
cbc = "0.1"
chardetng = "=1.0.0"
chrono = { version = "0.4", default-features = false }
chrono-tz = { version = "0.10", default-features = false }
csv = "=1.4.0"
encoding_rs = "=0.8.42"
erased-serde = "0.4"
flate2 = { version = "1", default-features = false }
futures-util = { version = "0.3", default-features = false }
getrandom = "0.2"
hmac = "0.12"
htmd = "=0.5.6"
http = "1"
http-body-util = "0.1"
hyper = "1"
jsonschema = { version = "0.60.2", default-features = false }
jsonwebtoken = { version = "9.3", default-features = false }
lettre = { version = "=0.11.23", default-features = false }
libz-sys = "1.1"
md-5 = "0.10"
pep440_rs = "=0.7.3"
pulldown-cmark = "0.13"
regex = "1"
rustpython-ast = { version = "=0.4.0", default-features = false }
rustpython-parser = { version = "=0.4.0", default-features = false }
serde = "1"
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = "1"
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
turbojpeg = { version = "=1.5.1", default-features = false }
unicode-normalization = "=0.1.25"
url = "2"
wegent-access = { path = "access" }
wegent-authentication = { path = "authentication" }
wegent-backend-config = { path = "backend-config" }
wegent-backend-persistence = { path = "persistence" }
wegent-backend-test-support = { path = "test-support" }
wegent-backend-users = { path = "users" }
wegent-capabilities = { path = "capabilities" }
wegent-celery = { path = "celery" }
wegent-crypto = { path = "../shared/rust/crypto" }
wegent-directory = { path = "directory" }
wegent-workspace-archive = { path = "workspace-archive" }
wegent-execution-preparation = { path = "execution-preparation" }
wegent-execution-events = { path = "execution-events" }
wegent-execution-runtime = { path = "execution-runtime" }
wegent-executor-manager = { path = "executor-manager" }
