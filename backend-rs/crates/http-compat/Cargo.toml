[package]
name = "wegent-http-compat"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "Apache-2.0"
description = "FastAPI response compatibility for Wegent HTTP services"

[dependencies]
brz-http-server = "=0.0.33"
brz-json = "=0.0.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
