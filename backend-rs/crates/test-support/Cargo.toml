[package]
name = "wegent-backend-test-support"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "Apache-2.0"
description = "Shared SQL protocol fixtures and query capture for Backend libraries"

[dependencies]
brz-metrics = { version = "=0.0.13", features = ["tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
brz-mysql = { version = "=0.0.29", features = ["metrics", "slow-log"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
