[package]
name = "wegent-capabilities"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "Apache-2.0"
description = "Skill catalogue authorization, task resolution, and cached Kind reads"

[dependencies]
sha2 = "0.10"
jsonwebtoken = { version = "9.3", default-features = false }
wegent-backend-config = { path = "../config" }
wegent-backend-persistence = { path = "../persistence" }
wegent-directory = { path = "../directory" }
wegent-identity = { path = "../identity" }
wegent-access = { path = "../access" }
wegent-http-compat = { path = "../http-compat" }
wegent-python-compat = { path = "../python-compat" }
wegent-resource-store = { path = "../resource-store" }
wegent-task-store = { path = "../task-store" }
anyhow = "1"
brz-http-server = { version = "=0.0.33", features = ["macros"] }
brz-mysql = { version = "=0.0.30", features = ["metrics", "slow-log"] }
brz-redis = { version = "=0.0.18", features = ["metrics", "slow-log"] }
brz-json = "=0.0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"

[dev-dependencies]
async-trait = "0.1"
wegent-identity = { path = "../identity", features = ["test-support"] }
wegent-backend-test-support = { path = "../test-support" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
