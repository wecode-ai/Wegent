[package]
name = "wegent-access"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "Apache-2.0"
description = "Entity membership and effective role resolution on caller-owned queries"

[dependencies]
wegent-directory = { path = "../directory" }
serde_json = { version = "1", features = ["preserve_order"] }
async-trait = "0.1"
brz-json = "=0.0.11"
brz-mysql = { version = "=0.0.29", features = ["metrics", "slow-log"] }
brz-redis = { version = "=0.0.18", features = ["metrics", "slow-log"] }
serde = { version = "1", features = ["derive"] }
wegent-backend-persistence = { path = "../persistence" }

[dev-dependencies]
wegent-backend-test-support = { path = "../test-support" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
