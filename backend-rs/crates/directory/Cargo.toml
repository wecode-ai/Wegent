[package]
name = "wegent-directory"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "Apache-2.0"
description = "Employee-directory provider contracts and profile values"

[dependencies]
async-trait = "0.1"
brz-json = "=0.0.11"
brz-mysql = { version = "=0.0.30", features = ["metrics", "slow-log"] }
brz-redis = { version = "=0.0.18", features = ["metrics", "slow-log"] }
serde = { version = "1", features = ["derive"] }
wegent-backend-persistence = { path = "../persistence" }
