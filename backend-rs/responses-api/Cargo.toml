[package]
name = "wegent-responses-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Responses HTTP routes, presentation, and authentication"

[dependencies]
futures-util = { workspace = true, features = ["std"] }
anyhow = { workspace = true }
brz-http-server = { workspace = true, features = ["macros"] }
brz-json = { workspace = true }
brz-mysql = { workspace = true, features = ["metrics", "slow-log"] }
brz-redis = { workspace = true, features = ["metrics", "slow-log"] }
chrono = { workspace = true, features = ["clock", "serde"] }
http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = { workspace = true }
tracing = { workspace = true }
wegent-attachments = { workspace = true }
wegent-backend-config = { workspace = true }
wegent-backend-persistence = { workspace = true }
wegent-execution-runtime = { workspace = true }
wegent-http-compat = { workspace = true }
wegent-identity = { workspace = true }
wegent-models = { workspace = true }
wegent-python-compat = { workspace = true }
wegent-resource-store = { workspace = true }
wegent-task-store = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
jsonwebtoken = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
wegent-backend-test-support = { workspace = true }
wegent-identity = { workspace = true, features = ["test-support"] }
