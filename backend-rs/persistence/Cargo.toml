[package]
name = "wegent-backend-persistence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Request-scoped SQL handles and task routing contracts"

[dependencies]
async-trait = { workspace = true }
brz-mysql = { workspace = true, features = ["metrics", "slow-log"] }
chrono = { workspace = true, features = ["clock", "serde"] }
tracing = { workspace = true }
wegent-backend-config = { workspace = true }

[dev-dependencies]
futures-util = { workspace = true, features = ["std"] }
wegent-http-compat = { workspace = true }
wegent-backend-test-support = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
