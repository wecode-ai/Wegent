[package]
name = "wegent-executor"
version = "1.8.7"
edition = "2021"
rust-version.workspace = true
description = "Wegent task executor service"
license = "Apache-2.0"

[package.metadata.wegent]
source-inputs = ["../shared/protocol/runtime_task_create_request_v2.schema.json"]

[lib]
doctest = false

[[bin]]
name = "wegent-executor"
path = "src/bin/wegent-executor.rs"

[[bin]]
name = "wegent-executor-dev"
path = "src/bin/wegent-executor-dev.rs"
required-features = ["dev-reload"]

[[example]]
name = "terminal_load"
path = "examples/terminal_load.rs"
test = true

[features]
default = []
dev-reload = ["dep:ctrlc", "dep:notify"]

[workspace]
resolver = "2"
members = ["crates/*"]
default-members = [".", "crates/*"]
exclude = ["vendor/tf-rust-socketio"]

[workspace.package]
rust-version = "1.77"

[dependencies]
wegent-claude-harness = { path = "crates/claude-harness" }
wegent-mcp-runtime = { path = "crates/mcp-runtime" }
wegent-native-home = { path = "crates/native-home" }
wegent-multimodal = { path = "crates/multimodal" }
wegent-execution-stream = { path = "crates/execution-stream" }
wegent-plugin-packages = { path = "crates/plugin-packages" }
wegent-model-proxy = { path = "crates/model-proxy" }
wegent-local-task-store = { path = "crates/task-store" }
wegent-automation = { path = "crates/automation" }
wegent-workspace = { path = "crates/workspace" }
wegent-hooks = { path = "crates/hooks" }
wegent-subprocess = { path = "crates/subprocess" }
wegent-execution-contracts = { path = "crates/execution-contracts" }
wegent-runtime-config = { path = "crates/config" }
wegent-runtime-logging = { path = "crates/logging" }
wegent-filesystem = { path = "../shared/rust/filesystem" }
wegent-protocol = { path = "../shared/rust/protocol" }
wegent-crypto = { path = "../shared/rust/crypto" }
axum = { version = "0.8", features = ["multipart", "ws"] }
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"
cron = "0.15"
ctrlc = { version = "3.4", features = ["termination"], optional = true }
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
regex = "1.11"
futures-util = "0.3"
flate2 = "1.0"
getrandom = "0.3"
httpdate = "1"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
ignore = "0.4"
libc = "0.2"
fs2 = "0.4"
notify = { version = "6.1", optional = true }
portable-pty = "0.9"
pulldown-cmark = { version = "0.13", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
# Forward opaque MCP metadata without changing serialized manifest key order.
serde_json = { version = "1.0", features = ["preserve_order", "raw_value"] }
sha2 = "0.10"
zstd = "0.13"
tar = "0.4"
tempfile = "3.23"
tf-rust-socketio = { version = "0.9.2", path = "vendor/tf-rust-socketio", features = ["async"] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.21"
toml_edit = { version = "0.22", features = ["serde"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
wegent-model-proxy = { path = "crates/model-proxy", features = ["test-support"] }
wegent-executor-test-support = { path = "crates/test-support" }
http-body-util = "0.1"
tokio = { version = "1.48", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
