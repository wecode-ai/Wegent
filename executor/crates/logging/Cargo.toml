[package]
name = "wegent-runtime-logging"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
description = "Executor event logging and rolling log lifecycle"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
wegent-runtime-config = { path = "../config" }

[dev-dependencies]
tempfile = "3.23"
