[package]
name = "wegent-execution-stream"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
description = "Ordered streaming delivery, delta compaction, failure propagation, and flushing"

[dependencies]
wegent-execution-contracts = { path = "../execution-contracts" }
wegent-runtime-logging = { path = "../logging" }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.48", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.48", features = ["test-util"] }
