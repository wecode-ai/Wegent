[package]
name = "wegent-subprocess"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
description = "Platform process spawning and child lifetime primitives"

[dependencies]
regex = "1"
tempfile = "3.23"
libc = "0.2"
tokio = { version = "1.48", features = ["io-util", "process", "rt", "sync"] }
wegent-runtime-logging = { path = "../logging" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.23"
