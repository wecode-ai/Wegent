[package]
name = "wegent-hooks"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
description = "Hook discovery, command execution, and rollout observation"

[dependencies]
thiserror = "2.0"
libc = "0.2"
wegent-runtime-config = { path = "../config" }
wegent-subprocess = { path = "../subprocess" }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
base64 = "0.22"
tempfile = "3.23"
wegent-executor-test-support = { path = "../test-support" }
