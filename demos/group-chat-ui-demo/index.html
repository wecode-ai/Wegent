<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wework 群聊设计 Demo</title>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --border: #e8e8e6;
    --text: #1f2329;
    --text-2: #6b7280;
    --text-3: #9ca3af;
    --dark: #1f2329;
    --ai: #7c3aed;
    --ai-bg: #f3efff;
    --tag-blue: #eef2ff;
    --tag-blue-text: #4f46e5;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  .app { display: flex; height: 100vh; }

  /* ============ 左侧边栏 ============ */
  .sidebar {
    width: 232px; flex-shrink: 0;
    background: var(--bg);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 12px 10px;
  }
  .brand { font-size: 17px; font-weight: 700; padding: 6px 10px 14px; }
  .side-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border-radius: 8px;
    color: var(--text); font-size: 14px;
  }
  .side-item:hover { background: #ececea; }
  .side-section {
    margin-top: 18px; padding: 0 10px 6px;
    font-size: 12px; color: var(--text-3);
    display: flex; justify-content: space-between; align-items: center;
  }
  .side-section .plus { color: var(--text-3); font-size: 15px; padding: 0 4px; border-radius: 4px; }
  .side-section .plus:hover { background: #ececea; color: var(--text-2); }
  .proj {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border-radius: 8px;
    color: var(--text-2); font-size: 13.5px;
    white-space: nowrap; overflow: hidden;
  }
  .proj:hover { background: #ececea; }
  .proj.active { background: #e6e6e3; color: var(--text); font-weight: 500; }
  .proj .count { margin-left: auto; font-size: 12px; color: var(--text-3); flex-shrink: 0; }

  /* ============ 主区域 ============ */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--panel); }
  .topbar {
    height: 52px; flex-shrink: 0;
    display: flex; align-items: center; gap: 4px;
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
  }
  .topbar .crumb {
    display: flex; align-items: center; gap: 6px;
    font-weight: 600; font-size: 14px; margin-right: 8px;
  }
  .badge-cloud {
    font-size: 11px; font-weight: 400; color: var(--text-3);
    background: var(--bg); border-radius: 4px; padding: 1px 6px;
  }
  .tab {
    padding: 6px 14px; border-radius: 8px; font-size: 14px; color: var(--text-2);
  }
  .tab:hover { background: var(--bg); }
  .tab.active { background: #efefed; color: var(--text); font-weight: 600; }
  .topbar-right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 8px; font-size: 13px;
    border: 1px solid var(--border); background: #fff; color: var(--text);
  }
  .btn:hover { background: var(--bg); }
  .btn-dark { background: var(--dark); color: #fff; border-color: var(--dark); }
  .btn-dark:hover { background: #000; }
  .btn-ai { color: var(--ai); border-color: #e5dcfb; background: var(--ai-bg); }
  .btn-ai:hover { background: #ebe3fd; }
  /* PostHog 风格：右上角 icon 入口，切换右侧面板 */
  .icon-btn {
    position: relative;
    width: 36px; height: 36px; border-radius: 9px;
    border: 1px solid var(--border); background: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 16px; color: var(--text-2);
  }
  .icon-btn:hover { background: var(--bg); color: var(--text); }
  .icon-btn.on { background: #efefed; color: var(--text); box-shadow: inset 0 0 0 1px #dcdcda; }
  .icon-btn .dot {
    position: absolute; top: -6px; right: -6px;
    min-width: 16px; height: 16px; border-radius: 8px;
    background: #ef4444; color: #fff; font-size: 10px;
    display: flex; align-items: center; justify-content: center; padding: 0 4px;
    border: 2px solid #fff;
  }

  /* ============ 看板 ============ */
  .board-wrap { flex: 1; overflow: auto; padding: 16px 20px; }
  .board-toolbar { display: flex; gap: 10px; margin-bottom: 14px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 12px; font-size: 13px; color: var(--text-2); background: #fff;
  }
  .board { display: flex; gap: 14px; align-items: flex-start; }
  .col { width: 264px; flex-shrink: 0; }
  .col-head {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 600; margin-bottom: 10px; padding: 0 2px;
  }
  .col-head .n { color: var(--text-3); font-weight: 400; }
  .col-head .add { margin-left: auto; color: var(--text-3); font-size: 16px; padding: 0 4px; border-radius: 4px; }
  .col-head .add:hover { background: var(--bg); }
  .card {
    background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,.03);
    transition: box-shadow .15s;
  }
  .card:hover { box-shadow: 0 3px 10px rgba(0,0,0,.07); }
  .card-title { font-size: 14px; font-weight: 600; line-height: 1.4; cursor: pointer; }
  .card-title:hover { text-decoration: underline; }
  .card-sub { font-size: 12px; color: var(--text-2); margin-top: 3px; }
  .tags { display: flex; gap: 6px; margin-top: 8px; }
  .tag {
    font-size: 11px; padding: 2px 8px; border-radius: 6px;
    background: var(--tag-blue); color: var(--tag-blue-text);
  }
  .card-meta { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 12px; color: var(--text-2); }
  /* 任务卡片上的群聊入口 */
  .chat-entry {
    display: flex; align-items: center; gap: 6px;
    margin-top: 10px; padding-top: 9px;
    border-top: 1px dashed var(--border);
    font-size: 12.5px; color: var(--text-2);
    width: 100%; text-align: left;
  }
  .chat-entry:hover { color: var(--text); }
  .chat-entry .unread {
    margin-left: auto; min-width: 17px; height: 17px; border-radius: 9px;
    background: #ef4444; color: #fff; font-size: 10.5px;
    display: flex; align-items: center; justify-content: center; padding: 0 5px;
  }
  .chat-entry .ai-flag { margin-left: auto; color: var(--ai); font-size: 11.5px; display: flex; align-items: center; gap: 3px; }

  /* ============ 右侧停靠面板（PostHog 风格） ============ */
  .dock {
    width: 0; flex-shrink: 0; overflow: hidden;
    background: #fff; border-left: 1px solid transparent;
    display: flex; flex-direction: column;
    transition: width .22s ease;
  }
  .dock.show { width: 400px; border-left-color: var(--border); }
  .dock-inner { width: 400px; height: 100%; display: flex; flex-direction: column; }
  .dock-head {
    padding: 12px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    display: flex; align-items: center; gap: 10px; min-height: 61px;
  }
  .dock-head .g-icon {
    width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
    background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .dock-head .g-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dock-head .g-sub { font-size: 11.5px; color: var(--text-3); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .back-link {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; color: var(--text-2); padding: 3px 8px; border-radius: 6px;
    margin-bottom: 2px; flex-shrink: 0;
  }
  .back-link:hover { background: var(--bg); color: var(--text); }
  .t-ctx {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; color: var(--text-2); background: var(--bg);
    border-radius: 5px; padding: 2px 8px; margin-top: 3px;
  }
  .members { display: flex; align-items: center; margin-left: auto; flex-shrink: 0; }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; color: #fff;
    border: 2px solid #fff; margin-left: -7px;
  }
  .avatar.ai { background: var(--ai-bg); color: var(--ai); }
  .dock-close {
    color: var(--text-3); font-size: 14px; padding: 5px 8px; border-radius: 7px; flex-shrink: 0;
  }
  .dock-close:hover { background: var(--bg); color: var(--text-2); }

  .msg-scroll { flex: 1; overflow-y: auto; padding: 18px 16px; }
  .msg-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .msg-row.mine { flex-direction: row-reverse; }
  .m-avatar {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; color: #fff;
  }
  .m-avatar.ai { background: var(--ai-bg); color: var(--ai); }
  .m-body { min-width: 0; max-width: calc(100% - 40px); }
  .m-name { font-size: 12px; color: var(--text-3); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .msg-row.mine .m-name { justify-content: flex-end; }
  .ai-tag { color: var(--ai); background: var(--ai-bg); font-size: 10.5px; padding: 0 5px; border-radius: 4px; }
  .bubble {
    display: inline-block; padding: 9px 13px; border-radius: 12px;
    background: #f2f2f0; line-height: 1.65; font-size: 13.5px;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg-row.mine .bubble { background: var(--dark); color: #fff; }
  .bubble .mention { color: #7dd3fc; font-weight: 500; }
  .ai-status { font-size: 12px; color: var(--ai); margin-top: 5px; display: flex; align-items: center; gap: 4px; }
  .msg-row.mine .ai-status { justify-content: flex-end; }
  .ai-status.done { color: var(--text-3); }
  .spin {
    width: 11px; height: 11px; border: 1.5px solid #d8cff7; border-top-color: var(--ai);
    border-radius: 50%; animation: sp .7s linear infinite; display: inline-block;
  }
  @keyframes sp { to { transform: rotate(360deg); } }

  .thread-empty {
    height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--text-2); gap: 10px; text-align: center; padding: 0 36px;
  }
  .thread-empty .e-icon {
    width: 50px; height: 50px; border-radius: 14px; background: var(--bg);
    display: flex; align-items: center; justify-content: center; font-size: 21px; color: var(--text-3);
  }
  .thread-empty .e-title { font-weight: 600; color: var(--text); }
  .thread-empty .e-sub { font-size: 12.5px; color: var(--text-3); line-height: 1.6; }

  /* 输入区 */
  .composer-wrap { padding: 10px 14px 14px; flex-shrink: 0; position: relative; }
  .composer {
    border: 1px solid var(--border); border-radius: 14px; background: #fff;
    padding: 11px 13px; box-shadow: 0 2px 8px rgba(0,0,0,.04);
  }
  .composer textarea {
    width: 100%; border: none; outline: none; resize: none;
    font-family: inherit; font-size: 13.5px; line-height: 1.5; background: transparent;
  }
  .composer-bar { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .c-tool { color: var(--text-3); font-size: 15px; padding: 4px 6px; border-radius: 6px; }
  .c-tool:hover { background: var(--bg); color: var(--text-2); }
  .send-btn {
    margin-left: auto; width: 32px; height: 32px; border-radius: 9px;
    background: var(--dark); color: #fff; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .send-btn:disabled { background: #d6d6d3; cursor: default; }
  /* @ 唤起面板 */
  .mention-pop {
    position: absolute; bottom: 100%; left: 14px; right: 14px; margin-bottom: 6px;
    background: #fff; border: 1px solid var(--border);
    border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.12);
    padding: 6px; display: none; z-index: 30;
  }
  .mention-pop.show { display: block; }
  .mention-pop .mp-title { font-size: 11px; color: var(--text-3); padding: 6px 10px 4px; }
  .mp-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 8px 10px; border-radius: 8px; text-align: left; font-size: 13.5px;
  }
  .mp-item:hover, .mp-item.sel { background: var(--bg); }
  .mp-item .mp-desc { margin-left: auto; font-size: 11px; color: var(--text-3); }

  /* ============ 任务详情弹窗 ============ */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.32);
    display: none; align-items: flex-start; justify-content: center;
    padding-top: 7vh; z-index: 50;
  }
  .modal-mask.show { display: flex; }
  .modal {
    width: 720px; max-height: 84vh; overflow-y: auto;
    background: #fff; border-radius: 14px; padding: 20px 26px 0;
    box-shadow: 0 20px 60px rgba(0,0,0,.2);
  }
  .modal .m-id { font-size: 12px; color: var(--text-3); }
  .modal h2 { font-size: 20px; margin: 8px 0 14px; }
  .prop-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .modal-foot {
    position: sticky; bottom: 0; margin: 18px -26px 0; padding: 12px 26px;
    border-top: 1px solid var(--border); background: #fff;
    display: flex; align-items: center; gap: 10px;
  }
  .modal-foot .hint { font-size: 12px; color: var(--text-3); margin-right: auto; }

  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-8px);
    background: var(--dark); color: #fff; font-size: 13px;
    padding: 9px 18px; border-radius: 10px; opacity: 0; transition: all .25s; z-index: 99;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="brand">Wework</div>
    <div class="side-item">☁️ 项目空间</div>
    <div class="side-item">👤 我的工作</div>
    <div class="side-section">项目空间 <button class="plus">+</button></div>
    <div class="proj">🗂 本地github任务 <span class="count">6</span></div>
    <div class="proj">🗂 本地内置任务 <span class="count">3</span></div>
    <div class="proj active">🗂 修改名字 <span class="count">11</span></div>
    <div class="proj">🗂 钉钉表格接入 <span class="count">56</span></div>
    <div class="proj">🗂 githubDemo <span class="count">10</span></div>
  </aside>

  <!-- 主区域 -->
  <div class="main">
    <div class="topbar">
      <div class="crumb">☁️ 修改名字 <span class="badge-cloud">云端</span></div>
      <button class="tab active">看板</button>
      <button class="tab">文件</button>
      <button class="tab">管理</button>
      <div class="topbar-right">
        <button class="btn btn-dark">＋ 新建任务</button>
        <!-- 入口 1：右上角 icon，切换右侧群聊面板（PostHog 风格） -->
        <button class="icon-btn" id="dock-toggle" title="项目群聊" onclick="toggleDock()">
          💬<span class="dot" id="dock-badge">4</span>
        </button>
      </div>
    </div>

    <!-- 看板视图 -->
    <div class="board-wrap" id="view-board">
      <div class="board-toolbar">
        <button class="chip">状态 ▾</button>
        <button class="chip">全部状态 ▾</button>
        <button class="chip">🔍 搜索任务</button>
      </div>
      <div class="board" id="board"></div>
    </div>
  </div>

  <!-- 右侧停靠面板：项目群聊 / 任务 Thread 共用 -->
  <div class="dock" id="dock">
    <div class="dock-inner">
      <!-- 项目群聊头 -->
      <div class="dock-head" id="dock-head-group">
        <div class="g-icon">👥</div>
        <div style="min-width:0">
          <div class="g-name">修改名字 群聊</div>
          <div class="g-sub">项目成员与 AI 共同参与</div>
        </div>
        <div class="members">
          <span class="avatar" style="background:#f59e0b">A</span>
          <span class="avatar" style="background:#0ea5e9">四</span>
          <span class="avatar ai">🤖</span>
          <span class="avatar ai">✨</span>
        </div>
        <button class="btn btn-ai" style="padding:5px 10px;font-size:12px" onclick="toast('打开「管理 AI」面板（Demo 未实现）')">＋ 管理 AI</button>
        <button class="dock-close" onclick="toggleDock(false)">✕</button>
      </div>
      <!-- 任务 Thread 头 -->
      <div class="dock-head" id="dock-head-thread" style="display:none">
        <div style="min-width:0">
          <button class="back-link" onclick="showGroup()">← 项目群聊</button>
          <div class="g-name" id="th-title"></div>
          <div class="t-ctx">🗂 <span id="th-id"></span> · 任务上下文已挂载</div>
        </div>
        <button class="dock-close" style="margin-left:auto" onclick="toggleDock(false)">✕</button>
      </div>

      <div class="msg-scroll" id="dock-msgs"></div>

      <div class="composer-wrap">
        <div class="mention-pop" id="mention-pop">
          <div class="mp-title">@ 唤起 AI 参与讨论</div>
          <div id="mention-list"></div>
        </div>
        <div class="composer">
          <textarea id="dock-input" rows="2" placeholder="发送消息，输入 @ 唤起 AI…"></textarea>
          <div class="composer-bar">
            <button class="c-tool" title="附件">📎</button>
            <button class="c-tool" title="@ AI" onclick="insertAt()">@</button>
            <button class="send-btn" id="dock-send" disabled onclick="sendDock()">➤</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 任务详情弹窗（入口 3） -->
<div class="modal-mask" id="modal-mask" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="m-id">▤ <span id="md-id"></span> ⧉</div>
    <h2 id="md-title"></h2>
    <div class="prop-row">
      <button class="chip">● 状态 · <b id="md-status"></b> ▾</button>
      <button class="chip">⚑ 优先级 · 普通 ▾</button>
      <button class="chip">👤 负责人 · 添加 ▾</button>
      <button class="chip">👤 创建人 · admin</button>
    </div>
    <div class="prop-row">
      <button class="chip">☰ 父任务 · 无父任务 ▾</button>
      <button class="chip">📅 截止时间 · 添加日期</button>
    </div>
    <div class="prop-row"><button class="chip">🏷 标签 feedback ✕ &nbsp;wework ✕</button></div>
    <p style="font-size:13.5px" id="md-desc"></p>
    <p style="font-size:12px;color:var(--text-3);margin-top:26px">支持 Markdown，可拖拽文件到编辑器添加附件</p>
    <div class="modal-foot">
      <span class="hint">ESC 关闭 · ⌘↵ 保存</span>
      <!-- 入口 3：任务详情内的群聊入口 -->
      <button class="btn" onclick="closeModal(); openThread(currentTaskId)">💬 群聊 <span id="md-unread"></span></button>
      <button class="btn btn-dark" onclick="toast('跳转到「与 AI 沟通」主对话（Demo 未实现）')">✨ 开始对话</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= Mock 数据 ================= */
const AI_MEMBERS = [
  { id: 'ai1', name: '测试AI1', icon: '🤖', desc: '项目助理 · 任务/看板' },
  { id: 'ai2', name: '代码助手', icon: '✨', desc: '代码审查 · 修复' },
];
const HUMAN = { name: 'admin', color: '#f59e0b', letter: 'A' };

const TASKS = [
  { id: '1FFD6B9-9', title: '$项目空间 看看所有任务', sub: 'Feedback report: WF-19FA8ED9AFC', col: '收集箱', status: '收集箱', unread: 3, aiActive: true },
  { id: 'WF-19FA8F17FB0', title: '$项目空间 看看所有任务', sub: 'Feedback report: WF-19FA8F17FB0', col: '进行中', status: '进行中', unread: 0, aiActive: false },
  { id: 'WF-19FA9129BB6', title: '$项目空间 看看我有多少个项目', sub: 'Feedback report: WF-19FA9129BB6', col: '进行中', status: '进行中', unread: 1, aiActive: true },
  { id: 'WF-19FABF278A3', title: '看看有报错吗', sub: '看看有报错吗 Feedback report: WF-19FABF278A3', col: '进行中', status: '进行中', unread: 0, aiActive: false },
];

let groupMsgs = [
  { from: 'ai', ai: AI_MEMBERS[0], text: '哈喽，我在～我是测试AI1。有什么想让我帮你看项目、任务，或者处理代码的都可以直接说。', status: 'done' },
  { from: 'me', text: '看看这个项目里面有多少个任务' },
  { from: 'me', text: '@测试AI1 ', mention: true, aiAck: true },
  { from: 'ai', ai: AI_MEMBERS[0], text: '当前项目「修改名字」里一共有 11 个任务。\n\n按状态看：\n- 进行中：6 个\n- 收件箱：4 个\n- 待处理：1 个\n- 已完成：0 个', status: 'done' },
];
let threadMsgs = {}; // taskId -> msgs
let dockMode = 'group'; // 'group' | 'thread'
let currentTaskId = null;

/* ================= 看板渲染 ================= */
const COLS = ['待开始', '收集箱', '进行中', '待确认'];
function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  COLS.forEach(col => {
    const tasks = TASKS.filter(t => t.col === col);
    const colEl = document.createElement('div');
    colEl.className = 'col';
    colEl.innerHTML = `<div class="col-head">● ${col} <span class="n">${tasks.length}</span><button class="add">+</button></div>`;
    if (!tasks.length) {
      colEl.innerHTML += `<div style="border:1px dashed var(--border);border-radius:12px;padding:22px;text-align:center;color:var(--text-3);font-size:12.5px">拖拽任务到这里</div>`;
    }
    tasks.forEach(t => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-title" onclick="openModal('${t.id}')">${t.title}</div>
        <div class="card-sub">${t.sub}</div>
        <div class="tags"><span class="tag">feedback</span><span class="tag">wework</span></div>
        <div class="card-meta">⚑ 普通 📅 07-28 <span style="margin-left:auto;color:var(--text-3)">未指定</span></div>
        <button class="chat-entry" onclick="openThread('${t.id}')">
          💬 任务群聊
          ${t.unread ? `<span class="unread">${t.unread}</span>` : (t.aiActive ? `<span class="ai-flag">🤖 AI 在处理</span>` : '')}
        </button>`;
      colEl.appendChild(card);
    });
    board.appendChild(colEl);
  });
}

/* ================= 消息渲染 ================= */
function msgEl(m) {
  const row = document.createElement('div');
  if (m.from === 'me') {
    row.className = 'msg-row mine';
    row.innerHTML = `
      <div class="m-avatar" style="background:${HUMAN.color}">${HUMAN.letter}</div>
      <div class="m-body">
        <div class="m-name">${HUMAN.name}</div>
        <div class="bubble">${m.mention ? '<span class="mention">@测试AI1</span>' : escapeHtml(m.text)}</div>
        ${m.aiAck ? '<div class="ai-status">⤴ AI 已接收</div>' : ''}
      </div>`;
  } else {
    const statusHtml = m.status === 'processing'
      ? '<div class="ai-status"><span class="spin"></span> 正在处理</div>'
      : '<div class="ai-status done">✓ 已完成</div>';
    row.className = 'msg-row';
    row.innerHTML = `
      <div class="m-avatar ai">${m.ai.icon}</div>
      <div class="m-body">
        <div class="m-name">${m.ai.name} <span class="ai-tag">AI</span></div>
        ${m.text ? `<div class="bubble">${escapeHtml(m.text)}</div>` : ''}
        ${statusHtml}
      </div>`;
  }
  return row;
}
function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }

function renderMsgs() {
  const box = document.getElementById('dock-msgs');
  box.innerHTML = '';
  if (dockMode === 'thread' && !(threadMsgs[currentTaskId] || []).length) {
    box.innerHTML = `<div class="thread-empty">
      <div class="e-icon">👥</div>
      <div class="e-title">开始讨论这个任务</div>
      <div class="e-sub">在这里讨论任务：消息仅属于这个任务的 Thread，并保留后续上下文。</div>
    </div>`;
    return;
  }
  const list = dockMode === 'group' ? groupMsgs : threadMsgs[currentTaskId];
  list.forEach(m => box.appendChild(msgEl(m)));
  box.scrollTop = box.scrollHeight;
}

/* ================= 面板开关与模式切换 ================= */
function toggleDock(force) {
  const dock = document.getElementById('dock');
  const show = force !== undefined ? force : !dock.classList.contains('show');
  dock.classList.toggle('show', show);
  document.getElementById('dock-toggle').classList.toggle('on', show);
  if (show && dockMode === 'group') showGroup();
}
function showGroup() {
  dockMode = 'group';
  document.getElementById('dock-head-group').style.display = 'flex';
  document.getElementById('dock-head-thread').style.display = 'none';
  document.getElementById('dock-input').placeholder = '发送消息，输入 @ 唤起 AI…';
  toggleDock(true);
  renderMsgs();
}
function openThread(taskId) {
  const t = TASKS.find(x => x.id === taskId);
  currentTaskId = taskId;
  dockMode = 'thread';
  document.getElementById('th-id').textContent = t.id;
  document.getElementById('th-title').textContent = t.title;
  document.getElementById('dock-head-group').style.display = 'none';
  document.getElementById('dock-head-thread').style.display = 'flex';
  document.getElementById('dock-input').placeholder = '讨论这个任务，输入 @ 唤起 AI…';
  t.unread = 0; renderBoard(); updateBadge();
  toggleDock(true);
  renderMsgs();
}

/* ================= 任务详情弹窗 ================= */
function openModal(taskId) {
  const t = TASKS.find(x => x.id === taskId);
  document.getElementById('md-id').textContent = t.id;
  document.getElementById('md-title').textContent = t.title;
  document.getElementById('md-status').textContent = t.status;
  document.getElementById('md-desc').textContent = t.sub;
  document.getElementById('md-unread').textContent = t.unread ? `(${t.unread})` : '';
  document.getElementById('modal-mask').classList.add('show');
}
function closeModal() { document.getElementById('modal-mask').classList.remove('show'); }

/* ================= 发送与模拟 AI 状态机 ================= */
function aiReplyFlow(list, userMsg, replyText) {
  list.push(userMsg);
  userMsg.aiAck = true; // 1. AI 已接收
  renderMsgs();
  const proc = { from: 'ai', ai: AI_MEMBERS[0], text: '', status: 'processing' };
  setTimeout(() => { list.push(proc); renderMsgs(); }, 500); // 2. 正在处理
  setTimeout(() => { proc.text = replyText; proc.status = 'done'; renderMsgs(); }, 2200); // 3. 已完成
}

function sendDock() {
  const input = document.getElementById('dock-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = ''; toggleSend();
  hideMention();
  if (dockMode === 'group') {
    aiReplyFlow(groupMsgs, { from: 'me', text },
      '收到，我来处理～\n\n当前项目「修改名字」里一共有 11 个任务：\n- 进行中：6 个\n- 收件箱：4 个\n- 待处理：1 个\n\n需要我把某个任务的详情贴出来吗？');
  } else {
    if (!threadMsgs[currentTaskId]) threadMsgs[currentTaskId] = [];
    aiReplyFlow(threadMsgs[currentTaskId], { from: 'me', text },
      '已基于该任务的上下文处理完成 ✅\n\n- 关联任务：' + currentTaskId + '\n- 结论已回写到任务描述\n\n需要我继续深入可以在这里直接说。');
    const t = TASKS.find(x => x.id === currentTaskId);
    t.aiActive = true; renderBoard();
  }
}

/* ================= @ 唤起面板 ================= */
const dockInput = document.getElementById('dock-input');
const mentionPop = document.getElementById('mention-pop');
function renderMentionPop() {
  document.getElementById('mention-list').innerHTML = AI_MEMBERS.map((a, i) => `
    <button class="mp-item ${i === 0 ? 'sel' : ''}" onclick="pickMention('${a.name}')">
      <span class="m-avatar ai" style="width:26px;height:26px;font-size:13px">${a.icon}</span>
      ${a.name}
      <span class="mp-desc">${a.desc}</span>
    </button>`).join('');
}
function insertAt() {
  dockInput.value += '@';
  dockInput.focus();
  dockInput.dispatchEvent(new Event('input'));
}
function pickMention(name) {
  dockInput.value = dockInput.value.replace(/@[^@\s]*$/, '@' + name + ' ');
  hideMention(); dockInput.focus(); toggleSend();
}
function hideMention() { mentionPop.classList.remove('show'); }
dockInput.addEventListener('input', () => {
  toggleSend();
  if (dockInput.value.match(/@[^@\s]*$/)) { renderMentionPop(); mentionPop.classList.add('show'); }
  else hideMention();
});
dockInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendDock(); } });
function toggleSend() {
  document.getElementById('dock-send').disabled = !dockInput.value.trim();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); hideMention(); } });

function updateBadge() {
  const total = TASKS.reduce((s, t) => s + t.unread, 0);
  const dot = document.getElementById('dock-badge');
  dot.style.display = total ? 'flex' : 'none';
  dot.textContent = total;
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

renderBoard(); updateBadge();
if (location.hash === '#chat') showGroup();
</script>
</body>
</html>
