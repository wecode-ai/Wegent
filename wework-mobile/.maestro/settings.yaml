appId: com.wecode.wegent
name: Mobile settings lifecycle
tags:
  - mobile-e2e
---
- runFlow: subflows/login.yaml
- tapOn:
    id: drawer-actions
- tapOn:
    id: drawer-settings
- assertVisible:
    id: settings-dialog
- assertVisible: ${E2E_BACKEND_URL}
- tapOn:
    id: close-settings
- assertNotVisible:
    id: settings-dialog
- tapOn:
    id: drawer-actions
- tapOn:
    id: drawer-settings
- tapOn:
    id: disconnect-backend
- assertVisible:
    id: authorization-card
