appId: com.wecode.wegent
name: Mobile conversation setup controls
tags:
  - mobile-e2e
---
- runFlow: subflows/login.yaml
- runFlow: subflows/open-project-chat.yaml
- tapOn:
    id: new-chat-device
- assertVisible:
    id: new-chat-choice-sheet
- tapOn:
    id: new-chat-choice-${E2E_SECOND_DEVICE_ID}
- assertVisible: .*Wework E2E Remote Docker Device.*
- tapOn:
    id: new-chat-device
- tapOn:
    id: new-chat-choice-${E2E_DEVICE_ID}
- tapOn:
    id: new-chat-project
- tapOn:
    id: new-chat-choice-standalone-chat
- assertNotVisible:
    id: new-chat-work-mode
- tapOn:
    id: new-chat-project
- tapOn:
    id: new-chat-choice-${E2E_DEVICE_ID}:${E2E_WORKSPACE_PATH}
- assertVisible:
    id: new-chat-work-mode
- assertVisible:
    id: new-chat-work-mode
    text: '.*在本地工作.*'
- extendedWaitUntil:
    visible:
      id: new-chat-branch
    timeout: 30000
- tapOn:
    id: new-chat-work-mode
- assertVisible:
    id: new-chat-choice-worktree
- tapOn:
    id: new-chat-choice-worktree
- assertVisible:
    id: new-chat-branch
- tapOn:
    id: new-chat-input
- assertVisible:
    id: new-chat-permission
- tapOn:
    id: new-chat-permission
- tapOn:
    id: new-chat-choice-read-only
- assertVisible:
    id: new-chat-permission
    text: .*只读.*
- tapOn:
    id: new-chat-permission
- tapOn:
    id: new-chat-choice-workspace-write
- assertVisible:
    id: new-chat-permission
    text: .*工作区.*
- tapOn:
    id: new-chat-permission
- tapOn:
    id: new-chat-choice-full-access
- assertVisible:
    id: new-chat-permission
    text: .*完整访问.*
