appId: com.wecode.wegent
name: Mobile remote project lifecycle
tags:
  - mobile-e2e
---
- runFlow: subflows/login.yaml
- tapOn:
    id: drawer-actions
- tapOn:
    id: drawer-new-project
- assertVisible:
    id: project-dialog
- tapOn:
    id: project-create-submit
- assertVisible:
    id: project-create-error
- tapOn:
    id: project-name
- inputText: ${E2E_PROJECT_NAME}
- assertVisible:
    id: project-name
    text: ${E2E_PROJECT_NAME}
- tapOn:
    id: project-workspace-path
- inputText: ${E2E_WORKSPACE_PATH}
- assertVisible:
    id: project-workspace-path
    text: ${E2E_WORKSPACE_PATH}
- tapOn:
    id: project-create-submit
- extendedWaitUntil:
    notVisible:
      id: project-dialog
    timeout: 30000
- assertVisible:
    id: project-${E2E_PROJECT_NAME}
- tapOn:
    id: workspace-new-${E2E_DEVICE_ID}-${E2E_WORKSPACE_PATH}
- assertVisible:
    id: new-chat-input
- assertVisible:
    id: new-chat-project
